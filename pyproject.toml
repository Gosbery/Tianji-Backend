[project]
name = "bazi-api"
version = "0.2.0"
description = "A transparent, evidence-first Bazi RAG laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "lunar-python>=1.4.8",
  "pydantic-settings>=2.10.0",
  "pyyaml>=6.0.2",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
