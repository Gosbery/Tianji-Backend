- id: candidate-ziping-xiangshen-role
  title: 候选概念：相神是成格所赖的辅助要素
  card_type: concept
  content: 第十五篇将使全局格局得以成立的关键辅助要素称为“相”，其角色随具体结构变化。
  rule: 只有在具体格局中识别出“全局之格赖此而成”的要素后，才讨论相神；不可预设某一固定十神恒为相神。
  school: 子平格局法
  concepts:
  - 相神
  - 用神
  - 格局
  conditions:
  - 已经说明月令用神和全局成格关系
  exceptions:
  - 原文明确要求随地换形，不能用单一固定表套用
  prohibited_uses:
  - 不得把相神固定映射为某一个十神
  - 未校勘前不得作为正式规则发布
  source_refs:
