- id: candidate-ziping-luck-context
  title: 候选方法：行运必须与原局喜忌合看
  card_type: method
  content: 第二十五篇要求把每一步运的干支放回原命局和月令喜忌中统观，并区分干支、冲合与原局条件。
  rule: 行运判断以原局已经建立的喜忌为前提，逐一检查运干、运支与原局的生克冲合，不能只按单字固定吉凶。
  school: 子平格局法
  concepts:
  - 行运
  - 喜忌
  - 月令
  - 干支关系
  conditions:
  - 原局结构和喜忌已有可追溯依据
  exceptions:
  - 同类干支、同为冲合，仍可能因原局配合而结果不同
  prohibited_uses:
  - 不得脱离原局把某一步运固定判为吉或凶
  - 未校勘前不得作为正式规则发布
