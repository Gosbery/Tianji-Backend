cards:
- id: candidate-ziping-yongshen-month-command
  title: 候选规则：用神先从月令讨论
  card_type: rule
  content: 《子平真诠》第八篇把月令作为讨论用神和格局的起点，并说明月令本身无可用者仍需结合四柱另取。
  rule: 依《子平真诠》的格局语境，先以日干配月令辨别结构；月令无可用时，再结合四柱透干会支另取。
  school: 子平格局法
  concepts:
  - 月令
  - 用神
  - 格局
  conditions:
  - 采用《子平真诠》的月令格局语境
  exceptions:
  - 建禄月劫等月令本身不可直接为用的情形
  disagreements:
  - school: 其他用神体系
    claim: “用神”术语可能指扶抑、调候或其他取用方法，不能与本卡自动合并。
    source_refs:
    - annotation_id: annotation:ziping-zhenquan:yongshen-scope
  prohibited_uses:
  - 不得只凭月令一项下完整命局结论
  - 未校勘前不得作为正式规则发布
  annotation_refs:
  - annotation:ziping-zhenquan:yongshen-scope
