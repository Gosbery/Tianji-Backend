- id: candidate-ziping-stars-boundary
  title: 候选边界：星辰不单独决定格局成败
  card_type: boundary
  content: 第二十一篇把格局的生克配合与星辰神煞区分开，不以吉星或凶星替代格局分析。
  rule: 在本书体系内，星辰只能作为附加观察，不能越过月令、四柱和生克关系直接决定格局成败。
  school: 子平格局法
  concepts:
  - 星辰
  - 格局
  - 生克
  - 月令
  conditions:
  - 讨论神煞或星辰对格局的影响
  exceptions:
  - 本卡不评价其他流派对神煞的独立用法
  prohibited_uses:
  - 不得仅凭吉神断富贵
  - 不得仅凭凶煞断灾祸
  - 未校勘前不得作为正式规则发布
