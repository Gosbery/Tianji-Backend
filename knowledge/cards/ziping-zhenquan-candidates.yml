- id: candidate-ziping-external-pattern-scope
  title: 候选规则：外格只在月令无用时讨论
  card_type: boundary
  content: 第二十二篇把外格限定为月令无用时的权宜取法；月令或干头已有可用结构时，不应舍近求远另立外格。
  rule: 先检查月令及透干是否已有可用结构；只有月令本无用神且无更直接结构时，才进入外格候选。
  school: 子平格局法
  concepts:
  - 外格
  - 月令
  - 用神
  - 格局
  conditions:
  - 采用《子平真诠》的月令格局语境
  exceptions:
  - 用神已破不等于月令本无用，不能因此改取外格
  prohibited_uses:
  - 不得为迁就结论强立外格
  - 未校勘前不得作为正式规则发布
  source_refs:
