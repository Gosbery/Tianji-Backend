  - id: method-duan-image-work
    title: 段建业方法研究卡：取象、主宾与做功
    content: 研究时从命盘关系取象，区分主宾与体用，检查组合如何做功，再讨论虚实和应期；所有现实判断必须标注为待事实反馈验证，不能以象代替命盘事实。
    card_type: method
    school: 盲派象法
