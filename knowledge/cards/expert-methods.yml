  - id: method-liang-month-pattern
    title: 梁湘润方法研究卡：月令、格局与救应
    content: 研究时依次核对月令取用、格局成立条件、成败与救应，并把调候需要和格局用神分开陈述；原文、后人评注和研究摘要不得混写。
    card_type: method
    school: 子平格局法
