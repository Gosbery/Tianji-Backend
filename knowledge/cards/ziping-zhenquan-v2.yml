- id: ziping-rule-ch42-p001
  title: 第42章规则1：伤官格按成格路径选择行运
  schema_version: 2
  card_type: method
  content: 伤官取运，即以伤官所成之局，分而配之。伤官用财，财旺身轻，则利印比；身强财浅，则喜财运，伤官亦宜。
  rule: 在“伤官格按成格路径选择行运”的判断链中，应核验本段结论：伤官取运，即以伤官所成之局，分而配之。伤官用财，财旺身轻，则利印比；身强财浅，则喜财运，伤官亦宜。
  school: 子平格局法
  concepts:
  - 财
  - 伤官
  conclusion: 伤官取运，即以伤官所成之局，分而配之。伤官用财，财旺身轻，则利印比；身强财浅，则喜财运，伤官亦宜。
  premises:
  - 原局格局、用神、相神与忌神已有可追溯判断
  - 当前只讨论行运如何作用于原局
  conditions:
  - 原文条件：伤官用财，财旺身轻，则利印比
  - 原文条件：身强财浅，则喜财运，伤官亦宜
  - 逐项核对运干运支如何影响伤官格按成格路径选择行运
  exceptions:
  - 同一五行在不同原局或不同成格路径中喜忌可以相反
  break_conditions:
  - 脱离原局只凭运支或运干固定断吉凶
  - 忽略原局已有的合冲和强弱条件
  rescue_conditions:
  - 先恢复原局成格路径，再判断此运补足、制伏、通关或取清何者
  counterexamples:
