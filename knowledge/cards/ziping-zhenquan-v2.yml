- id: ziping-rule-ch04-p001
  title: 第4章规则1：天干五合的性情与作用
  schema_version: 2
  card_type: rule
  content: 合化之义，以十干阴阳相配而成。河图之数，以一二三四五配六七八十，先天之道也。故始于太阴之水，而终于冲气之土，以气而语其生之序也。盖未有五行之先，必先有阴阳老少，而后冲气，故生以土。终之既有五行，则万物又生于土，而水火木金，亦寄质焉，故以土先之。是以甲己相合之始，则化为土；土则生金，故乙庚化金次之；金生水，故丙辛化水又次之；水生木，故丁壬化木又次之；木生火，故戊癸化火又次之，而五行遍焉。先之以土，相生之序，自然如此。此十干合化之义也。
  rule: 在“天干五合的性情与作用”的判断链中，应核验本段结论：合化之义，以十干阴阳相配而成。河图之数，以一二三四五配六七八十，先天之道也。
  school: 子平格局法
  concepts:
  - 阴阳
  - 五行
  - 十干
  conclusion: 合化之义，以十干阴阳相配而成。河图之数，以一二三四五配六七八十，先天之道也。
