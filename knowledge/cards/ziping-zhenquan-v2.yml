- id: ziping-rule-ch34-p001
  title: 第34章规则1：财格按成格路径选择行运
  schema_version: 2
  card_type: method
  content: 财格取运，即以财格所就之局，分而配之。其财旺生官者，运喜身旺印缓，不利七煞伤官；若生官而后透印，伤官之地，不甚有害。至于生官而带食破局，则运喜印绶，而逢煞反吉矣。
  rule: 在“财格按成格路径选择行运”的判断链中，应核验本段结论：财格取运，即以财格所就之局，分而配之。其财旺生官者，运喜身旺印缓，不利七煞伤官；若生官而后透印，伤官之地，不甚有害。
  school: 子平格局法
  concepts:
  - 财
  - 印绶
  - 伤官
  conclusion: 财格取运，即以财格所就之局，分而配之。其财旺生官者，运喜身旺印缓，不利七煞伤官；若生官而后透印，伤官之地，不甚有害。
  premises:
  - 原局格局、用神、相神与忌神已有可追溯判断
  - 当前只讨论行运如何作用于原局
  conditions:
  - 原文条件：其财旺生官者，运喜身旺印缓，不利七煞伤官
  - 原文条件：若生官而后透印，伤官之地，不甚有害
  - 逐项核对运干运支如何影响财格按成格路径选择行运
  exceptions:
  - 原文条件：至于生官而带食破局，则运喜印绶，而逢煞反吉矣
  - 同一五行在不同原局或不同成格路径中喜忌可以相反
  break_conditions:
  - 原文条件：其财旺生官者，运喜身旺印缓，不利七煞伤官
  - 脱离原局只凭运支或运干固定断吉凶
  - 忽略原局已有的合冲和强弱条件
  rescue_conditions:
  - 原文条件：其财旺生官者，运喜身旺印缓，不利七煞伤官
  - 原文条件：若生官而后透印，伤官之地，不甚有害
  - 先恢复原局成格路径，再判断此运补足、制伏、通关或取清何者
  counterexamples:
  - 见到财运便一律断财吉，未检查财在该格中是否党煞、坏印或泄食
  priority: 72
  priority_note: 行运规则必须后于原局结构判断，不能反过来用流年运字定义原局。
  exclusions: []
  prohibited_uses:
