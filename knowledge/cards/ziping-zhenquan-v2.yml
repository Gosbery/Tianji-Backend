- id: ziping-rule-ch32-p001
  title: 第32章规则1：正官格按原局配置选择行运
  schema_version: 2
  card_type: method
  content: 取运之道，一八字则有一八字这论，其理甚精，其法甚活，只可大略言之。变化在人，不可泥也。
  rule: 在“正官格按原局配置选择行运”的判断链中，应核验本段结论：取运之道，一八字则有一八字这论，其理甚精，其法甚活，只可大略言之。变化在人，不可泥也。
