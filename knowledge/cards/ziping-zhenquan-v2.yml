- id: ziping-rule-ch47-p007
  title: 第47章规则7：外格必须满足严格资格且先排除正格
  schema_version: 2
  card_type: rule
  content: 有弃命保财者，四柱皆财而身无气，舍而从之，格成大贵。若透印则身赖印生而不从，有官煞则亦无从财兼从煞之理，其格不成。如庚申、乙酉、丙申、乙丑，王十万命造也。运喜伤食财乡，不宜身旺。有弃命从煞者，四柱皆煞，而日主无根，舍而从之，格成大贵。若有伤食，则煞受制而不从，有印则印以化煞而不从。如乙酉、乙酉、乙酉、甲申，李侍郎命是也。运喜财官，不宜身旺，食伤则尤忌矣。
  rule: 在“外格必须满足严格资格且先排除正格”的判断链中，应核验本段结论：有弃命保财者，四柱皆财而身无气，舍而从之，格成大贵。若透印则身赖印生而不从，有官煞则亦无从财兼从煞之理，其格不成。
  school: 子平格局法
  concepts:
  - 财
  - 杂格
  conclusion: 有弃命保财者，四柱皆财而身无气，舍而从之，格成大贵。若透印则身赖印生而不从，有官煞则亦无从财兼从煞之理，其格不成。
  premises:
  - 已先检查月令、透干和会支，未发现可成立的常规格局
  - 逐项满足该外格原文列明的资格
  conditions:
  - 原文条件：若透印则身赖印生而不从，有官煞则亦无从财兼从煞之理，其格不成
