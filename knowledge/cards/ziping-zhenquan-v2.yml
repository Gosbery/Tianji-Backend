- id: ziping-rule-ch40-p001
  title: 第40章规则1：七杀格按制化轻重选择行运
  schema_version: 2
  card_type: method
  content: 偏官取运，即以偏官所成之局分而配之。煞用食制，煞重食轻则助食，煞轻食重则助煞，煞食均而日主根轻则助身。忌正官之混杂，畏印绶之夺食。
  rule: 在“七杀格按制化轻重选择行运”的判断链中，应核验本段结论：偏官取运，即以偏官所成之局分而配之。煞用食制，煞重食轻则助食，煞轻食重则助煞，煞食均而日主根轻则助身。
  school: 子平格局法
  concepts:
  - 正官
  - 印绶
  - 偏官
  conclusion: 偏官取运，即以偏官所成之局分而配之。煞用食制，煞重食轻则助食，煞轻食重则助煞，煞食均而日主根轻则助身。
  premises:
  - 原局格局、用神、相神与忌神已有可追溯判断
  - 当前只讨论行运如何作用于原局
  conditions:
  - 原文条件：煞用食制，煞重食轻则助食，煞轻食重则助煞，煞食均而日主根轻则助身
  - 逐项核对运干运支如何影响七杀格按制化轻重选择行运
  - 区分助成格之神、损成格之神与取清之神
  exceptions:
  - 同一五行在不同原局或不同成格路径中喜忌可以相反
  break_conditions:
  - 原文条件：忌正官之混杂，畏印绶之夺食
  - 脱离原局只凭运支或运干固定断吉凶
  - 忽略原局已有的合冲和强弱条件
  rescue_conditions:
  - 先恢复原局成格路径，再判断此运补足、制伏、通关或取清何者
  counterexamples:
  - 见到财运便一律断财吉，未检查财在该格中是否党煞、坏印或泄食
  priority: 72
  priority_note: 行运规则必须后于原局结构判断，不能反过来用流年运字定义原局。
  exclusions: []
  prohibited_uses:
  - 不得省略前提与破格条件只引用结论
  - 不得把机器校勘内容标作人工审核
