- id: ziping-rule-ch39-p001
  title: 第39章规则1：七杀格的食制、印化、财清与取纯
  schema_version: 2
  card_type: rule
  content: 煞以攻身，似非美物，百大贵之格，多存七煞。盖控制得宜，煞为我用，如大英雄大豪杰，似难驾驭，而处之有方，则惊天动地之功，忽焉而就。此王侯将相所以多存七煞也。
  rule: 在“七杀格的食制、印化、财清与取纯”的判断链中，应核验本段结论：煞以攻身，似非美物，百大贵之格，多存七煞。盖控制得宜，煞为我用，如大英雄大豪杰，似难驾驭，而处之有方，则惊天动地之功，忽焉而就。
  school: 子平格局法
  concepts:
  - 偏官
  conclusion: 煞以攻身，似非美物，百大贵之格，多存七煞。盖控制得宜，煞为我用，如大英雄大豪杰，似难驾驭，而处之有方，则惊天动地之功，忽焉而就。
  premises:
  - 以日主配月令提出格局候选
  - 四柱透干、会支、位置与根气已经由程序列明
  conditions:
  - 原文条件：盖控制得宜，煞为我用，如大英雄大豪杰，似难驾驭，而处之有方，则惊天动地之功，忽焉而就
  - 围绕七杀格的食制、印化、财清与取纯逐项核对原文列出的配合
  - 同时检查成格要素、忌神、相神和力量是否到位
  exceptions:
  - 同名十神在不同月令格局中作用不同，不按名称固定判吉凶
  break_conditions:
  - 关键成格要素被合去、冲伤或受制
  - 只见一个十神便跳过月令和全局配合直接定格
  rescue_conditions:
  - 原文条件：煞以攻身，似非美物，百大贵之格，多存七煞
  - 原文条件：此王侯将相所以多存七煞也
  - 检查原局是否另有制忌、合忌、通关、护用或取清关系
  counterexamples:
  - 原文条件：煞以攻身，似非美物，百大贵之格，多存七煞
  - 只因命局出现相关十神便宣称符合“七杀格的食制、印化、财清与取纯”，却未满足本条所列条件
  priority: 82
  priority_note: 本条属于格局判断主链；先确认月令与结构事实，再依成败救应顺序应用。
