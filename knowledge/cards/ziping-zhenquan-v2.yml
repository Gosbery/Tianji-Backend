  title: 第32章规则7：正官格按原局配置选择行运
  schema_version: 2
  card_type: method
  content: 此皆大略言之，其八字各有议论。运中每遇一字，各有研究，随时取用，不可言形。凡格皆然，不独正官也。
  rule: 在“正官格按原局配置选择行运”的判断链中，应核验本段结论：此皆大略言之，其八字各有议论。运中每遇一字，各有研究，随时取用，不可言形。
  school: 子平格局法
  concepts:
  - 正官
  conclusion: 此皆大略言之，其八字各有议论。运中每遇一字，各有研究，随时取用，不可言形。
  premises:
  - 原局格局、用神、相神与忌神已有可追溯判断
  - 当前只讨论行运如何作用于原局
  conditions:
  - 原文条件：运中每遇一字，各有研究，随时取用，不可言形
  - 逐项核对运干运支如何影响正官格按原局配置选择行运
  - 区分助成格之神、损成格之神与取清之神
  exceptions:
  - 原文条件：凡格皆然，不独正官也
  - 同一五行在不同原局或不同成格路径中喜忌可以相反
  break_conditions:
