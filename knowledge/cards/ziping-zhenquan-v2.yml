- id: ziping-rule-ch38-p001
  title: 第38章规则1：食神格按成格路径选择行运
  schema_version: 2
  card_type: method
  content: 食神取运，即以食神所成之局，分而配之。食神生财，财重食轻，则行财食，财食重则喜帮身。官煞之方，俱为不美。
  rule: 在“食神格按成格路径选择行运”的判断链中，应核验本段结论：食神取运，即以食神所成之局，分而配之。食神生财，财重食轻，则行财食，财食重则喜帮身。
  school: 子平格局法
  concepts:
  - 财
  - 食神
  conclusion: 食神取运，即以食神所成之局，分而配之。食神生财，财重食轻，则行财食，财食重则喜帮身。
  premises:
  - 原局格局、用神、相神与忌神已有可追溯判断
  - 当前只讨论行运如何作用于原局
  conditions:
  - 原文条件：食神生财，财重食轻，则行财食，财食重则喜帮身
  - 逐项核对运干运支如何影响食神格按成格路径选择行运
  - 区分助成格之神、损成格之神与取清之神
  exceptions:
  - 同一五行在不同原局或不同成格路径中喜忌可以相反
  break_conditions:
  - 脱离原局只凭运支或运干固定断吉凶
  - 忽略原局已有的合冲和强弱条件
  rescue_conditions:
  - 原文条件：食神生财，财重食轻，则行财食，财食重则喜帮身
  - 先恢复原局成格路径，再判断此运补足、制伏、通关或取清何者
  counterexamples:
  - 见到财运便一律断财吉，未检查财在该格中是否党煞、坏印或泄食
  priority: 72
  priority_note: 行运规则必须后于原局结构判断，不能反过来用流年运字定义原局。
  exclusions: []
  prohibited_uses:
  - 不得省略前提与破格条件只引用结论
  - 不得把机器校勘内容标作人工审核
