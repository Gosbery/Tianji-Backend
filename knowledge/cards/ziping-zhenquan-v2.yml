  - 忽略原局已有的合冲和强弱条件
  rescue_conditions:
  - 先恢复原局成格路径，再判断此运补足、制伏、通关或取清何者
  counterexamples:
  - 原文条件：运中每遇一字，各有研究，随时取用，不可言形
  - 见到财运便一律断财吉，未检查财在该格中是否党煞、坏印或泄食
  priority: 72
