- id: ziping-rule-ch36-p001
  title: 第36章规则1：印绶格按成格路径选择行运
  schema_version: 2
  card_type: method
  content: 印格取运，即以印格所成之局，分而配之。其印绶用官者，官露印重，财运反吉，伤食之方，亦为最利。
  rule: 在“印绶格按成格路径选择行运”的判断链中，应核验本段结论：印格取运，即以印格所成之局，分而配之。其印绶用官者，官露印重，财运反吉，伤食之方，亦为最利。
  school: 子平格局法
  concepts:
  - 财
  - 印绶
  conclusion: 印格取运，即以印格所成之局，分而配之。其印绶用官者，官露印重，财运反吉，伤食之方，亦为最利。
  premises:
  - 原局格局、用神、相神与忌神已有可追溯判断
  - 当前只讨论行运如何作用于原局
  conditions:
  - 原文条件：其印绶用官者，官露印重，财运反吉，伤食之方，亦为最利
  - 逐项核对运干运支如何影响印绶格按成格路径选择行运
