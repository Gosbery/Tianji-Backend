- id: ziping-rule-ch20-p008
  title: 第20章规则8：同样生克因位置先后而结果不同
  schema_version: 2
  card_type: rule
  content: 辛生申月，年壬月戊，时上丙官，不愁隔戊之壬，格亦许贵。假使年丙月壬而时戊，或年戊月丙而时壬，则壬能克丙，无望其贵矣。
  rule: 在“同样生克因位置先后而结果不同”的判断链中，应核验本段结论：辛生申月，年壬月戊，时上丙官，不愁隔戊之壬，格亦许贵。假使年丙月壬而时戊，或年戊月丙而时壬，则壬能克丙，无望其贵矣。
  school: 子平格局法
  concepts:
