- id: ziping-rule-ch07-p001
  title: 第7章规则1：刑冲会合须按结构解读
  schema_version: 2
  card_type: rule
  content: 刑者，三刑也，子卯巳申子类是也。冲者，六冲也，子午卯酉之类是也，会者，三会也，申子辰之类是也。合者，六合也，子与丑合之类是也。此皆以地支宫分而言，系对射之意也。三方为会，朋友之意也。并对为合，比邻之意也。至于三刑取庑，姑且阙疑，虽不知其所以然，于命理亦无害也。
  rule: 在“刑冲会合须按结构解读”的判断链中，应核验本段结论：刑者，三刑也，子卯巳申子类是也。冲者，六冲也，子午卯酉之类是也，会者，三会也，申子辰之类是也。
  school: 子平格局法
  concepts:
  - 刑冲会合
  conclusion: 刑者，三刑也，子卯巳申子类是也。冲者，六冲也，子午卯酉之类是也，会者，三会也，申子辰之类是也。
