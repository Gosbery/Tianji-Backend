- id: ziping-rule-ch01-p001
  title: 第1章规则1：十干十二支的阴阳五行基础
  schema_version: 2
  card_type: rule
  content: 天地之间，一气而已。惟有动静，遂分阴阳。有老少，遂分四象。老者极动静之时，是为太阳太阴；少者初动初静之际，是为少阴少阳。有是四象，而五行具于其中矣。水者，太阴也；火者，太阳也；木者，少阳也；金者，少阴也；土者，阴阳老少、木火金水冲气所结也。
  rule: 在“十干十二支的阴阳五行基础”的判断链中，应核验本段结论：天地之间，一气而已。惟有动静，遂分阴阳。
  school: 子平格局法
  concepts:
  - 阴阳
  - 五行
  - 十干
  - 十二支
  conclusion: 天地之间，一气而已。惟有动静，遂分阴阳。
  premises:
  - 四柱干支、月令和日主已经准确排定
  - 当前采用《子平真诠》的月令格局语境
