- id: ziping-rule-ch41-p001
  title: 第41章规则1：伤官格结合财印官煞及气候取用
  schema_version: 2
  card_type: rule
  content: 伤官虽非吉神，实为秀气，故文人学士，多于伤官格内得之。而夏木见水，冬金见火，则又为秀之尤秀者也。其中格局比他格多，变化尤多，在查其气候，量其强弱，审其喜忌，观其纯杂，微之又微，不可执也。
  rule: 在“伤官格结合财印官煞及气候取用”的判断链中，应核验本段结论：伤官虽非吉神，实为秀气，故文人学士，多于伤官格内得之。而夏木见水，冬金见火，则又为秀之尤秀者也。
  school: 子平格局法
  concepts:
  - 格局
  - 伤官
  conclusion: 伤官虽非吉神，实为秀气，故文人学士，多于伤官格内得之。而夏木见水，冬金见火，则又为秀之尤秀者也。
  premises:
  - 以日主配月令提出格局候选
  - 四柱透干、会支、位置与根气已经由程序列明
  conditions:
  - 原文条件：其中格局比他格多，变化尤多，在查其气候，量其强弱，审其喜忌，观其纯杂，微之又微，不可执也
  - 围绕伤官格结合财印官煞及气候取用逐项核对原文列出的配合
  - 同时检查成格要素、忌神、相神和力量是否到位
  exceptions:
