- id: ziping-case-ch31-p002
  title: 典型命例：第31章正官格的成格配合与禁忌
  schema_version: 2
  card_type: case
  content: 原典命例：甲申 / 壬申 / 乙巳 / 戊寅。以刑冲破害为忌，则以生之护之为喜矣。存其喜而去其忌则贵，而贵之中又有高低者，何也？以财印并透者论之，两不相碍，其贵也大。如薛相公命，甲申、壬申、乙巳，戊寅，壬印戊财，以乙隔之，水与土不相碍，故为大贵。若壬戌、丁未、戊甲、乙卯，杂气正官，透干会支，最为贵格，而壬财丁印，二者相合，仍以孤官无辅论，所以不上七品。
  school: 子平格局法
  concepts:
  - 正官
  - 财
