  premises:
  - 原局格局、用神、相神与忌神已有可追溯判断
  - 当前只讨论行运如何作用于原局
  conditions:
  - 逐项核对运干运支如何影响正官格按原局配置选择行运
  - 区分助成格之神、损成格之神与取清之神
