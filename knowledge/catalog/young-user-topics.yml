- id: topic:family
  label: 六亲与家庭
  priority: extended
  description: 讨论父母、兄弟姐妹和子女等传统六亲映射，并提示历史性别语境。
  query_terms: [父母, 父亲, 母亲, 原生家庭, 兄弟, 姐妹, 手足, 同辈, 子女, 晚辈, 养育]
  retrieval_terms: [六亲, 父母, 兄弟, 子女, 年柱, 月柱, 时柱, 正印, 偏印, 印绶, 正财, 偏财, 财星, 比肩, 劫财, 比劫, 食神, 伤官, 食伤]
  risk: interpretive
  related_work_ids: [work-ziping-zhenquan, work-ditiansui, work-yuanhai-ziping, work-sanming-tonghui, work-shenfeng-tongkao, work-mingli-yueyan]
- id: topic:health
  label: 健康文献观点
  priority: extended
  description: 仅检索古籍关于五行、旺衰与疾病的历史观点，禁止诊断、寿命预测和治疗建议。
  query_terms: [健康, 身体, 身心, 疾病, 生病, 症状, 寿命, 活几年, 吃药, 停药]
  retrieval_terms: [疾病, 五行, 旺衰, 调候, 病药, 岁运, 传统文献, 非诊断]
  risk: health
  related_work_ids: [work-ditiansui, work-sanming-tonghui, work-shenfeng-tongkao, work-mingli-yueyan]
- id: topic:strength-climate
  label: 调候与旺衰
  priority: extended
  description: 讨论日主强弱、气候寒暖燥湿及体用、病药等不同分析路径。
  query_terms: [旺衰, 身强, 身弱, 调候, 寒暖, 燥湿, 体用, 病药, 用神]
  retrieval_terms: [旺衰, 强弱, 调候, 体用, 病药, 用神, 月令, 格局, 救应]
  risk: standard
  related_work_ids: [work-ziping-zhenquan, work-ditiansui, work-sanming-tonghui, work-shenfeng-tongkao, work-mingli-yueyan]
