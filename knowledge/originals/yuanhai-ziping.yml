  text: 又曰：凡命有气象，常取生时干神为气，四柱干神为象，则甲己则有土气，乙庚有金气，丙辛有水气之类为化象，甲乙丙丁为本象，行运至气象得地处吉，不得地处凶。庚辛壬癸乙庚丙辛为金水象，运至申酉丑上得地。庚辛戊己甲乙乙庚为金土象，运至申酉辰上得地。庚辛丙丁乙庚戊癸为金火象，运至巳午戌上得地。庚辛甲乙乙庚丁壬为金木象，运至丑寅卯上得地。甲乙壬癸丁壬丙辛为水木象，运至亥子辰上得地。丙丁甲乙戊癸丁壬为火木象，运至寅卯未上得地。戊己壬癸甲己丙辛为水土象，运至辰上得地。戊己丙丁戊癸甲己为火土象，运至戌上得地。戊己甲乙甲己丁壬为土水象，运至未上得地。戊己庚辛乙庚甲己为金土象，运至丑上得地。看四柱干神得何象，如纯金木水火土，亦为五象，若杂而不入象者不发，发亦不久。如五纯象亦有太过之象，仍详当生月令得地，然後看行运得地不得地而言，不可以遇禄马贵人为得运，遇空亡羊刃劫杀为失运也。
