  text: 此印绶之妙者，多是受父母之荫，承父母赀财，现成安享之人。若又以两三命相并，当以印绶多者为上。又主一生少病，能饮食。或若财多乘旺，必多淹留。虽喜官鬼而官鬼多或入格，又不可专以印绶言之。假如甲乙日得亥子月生，丙丁日得寅卯月生，戊己日得巳午月生，庚辛日得辰戌丑未月生，壬癸日得申酉月生者是也，其余以类言之。
