  text: 且如甲乙得寅卯运，名曰劫财、败财，主克父母及克妻，破财争斗之事。行丙丁巳午运名伤官，主克子女，讼事囚系。行庚申辛酉，七杀官乡，主得名，发越太过则灾病恶疾。行壬癸亥子生气印绶运，主吉庆增産。辰戌丑未戊己财运主名利皆通。此乃死法，譬喻须随格局喜忌推之，不可执一，妙在识其通变，拙说如神。干旺宜行衰运，干弱宜旺运，正乃“干弱则求气旺之籍，有余则喜不足之营”。须要通变，更兼孤寡、空亡、勾绞、丧门、吊客、宅墓、病死、官符、白虎诸杀推之，其验如神。
