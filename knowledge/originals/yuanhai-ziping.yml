  sequence: 127
  text: 如木人用金为官，阳男运出未入申，阴男运出亥入戌，金人用木为财，阳男出丑入寅，阴男出巳入辰，俱向禄临马，原有官行官运发官，原有财行财运发财，原有灾行灾运发灾。更看当生年时得气浅深。四柱得气深、迎运便发，得气浅、须交过运始发，得其中气、运至中则发。《珞琭子》云：其为气也，将来者进，成功者退。《莹和尚》云：迎之以临官帝旺，将来者进，背之以休废死绝，功成者退。又曰：生逢休败之地，早岁孤贫，老遇健旺之乡，晚年偃蹇。《莹和尚》云：身须逐运，必假运而资身，势须及时，亦假时而成势。又云：生逢旺岁，运须处於旺乡，晚遇衰年，运恰宜於困地。《壶中子》曰：老幼慎勿坐强，壮实惟宜趋旺，生旺虽吉而未必吉，衰灭虽凶而未必凶，达此者始可论运。盖人自生至老，必从微以至少壮，十岁之时方当少年，惟可行胎养生沐浴冠带处，三十四十，当阳强齿壮之时，可行旺处。五十六十，天癸枯竭，只可行衰败死绝，反此者谓之一生运背，三限驱驰，直饶晚入旺乡，已非符叶。又云：命中五行衰老，运宜盛，五行盛者，运宜衰。衰者复行衰运，是谓不及，不及则迍蹇沈滞。盛者复行盛运，是谓太过，过则击作成败。要归於中而已。
