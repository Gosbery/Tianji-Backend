  sequence: 2
  text: 阴男阳女逆运。假如乙丑年，乙庚之岁戊为头，正月起戊寅，初一日立春後十五日生男。逆数至初一立春节止，得五三十五日，起五岁运，运行丁丑。如甲子年，甲己之年丙作首，正月雨寅，初一立春後十日生女，逆数至初一日立春止，得九日，三三单九日，起三岁运，逆行乙丑。余皆仿此。若多一日，减一日；少一日，增一日。
