  sequence: 96
  text: 偏财是父，乃印绶之官星也。如甲日以戊为父，再见甲寅字或木局全，或临死绝冲刑之地，主克父也。不然主离异、不睦或疾病伤残。若得庚字、申字救庶，无大害。如甲旺戊衰，亦主有疾少靠。如戊临生旺贵人、天月德，亦主有贵。更得丙丁生助，享父之福无穷。如临杀地，父死他乡。如居衰败受制之处，墓绝之地，主父平常，不得父力也。
