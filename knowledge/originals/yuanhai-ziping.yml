  chapter_path:
  - 第146章 论妻妾
  sequence: 99
  text: 见癸字则妾不正(癸乃戊之妻也)。见己土丑未字，则主自安。比肩分夺，财临桃花，主妻妾私通。日下、月下坐财官，主妻多内助，更得妻财。偏财得位，妾胜於妻；正财自旺，妻不容妾。官杀重见，妻招干蛊可畏。财官并美，为人怕妻，见杀尤忌。财多身弱，妻反胜夫；财命有气，妻妾和顺，是得妻力。日坐空亡，难为妻妾。又看孤鸾之日，阳错阴差，主克妻或因妻致眷，寒房冷娶，入赘填房。女人犯此，主母家淩替或致讼事。余仿此例。
