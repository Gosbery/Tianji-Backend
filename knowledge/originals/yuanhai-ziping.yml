  text: 出癸入甲，如返汗之人，多主不吉。古语云：伤寒换阳，行运换甲，换过是人，换不过是鬼。且如甲戌接癸亥，此乃干支接木。丑运交寅，辰交巳、未交申、戌交亥，此乃转角接木。东南西北，四方转角谓之接木，格局凶者死，格局善者灾，老人大忌，後生差慢。寅卯辰一气，巳午未一气，申酉戌一气，亥子丑一气，气之相连，皆非接木之说，纵遇接甲，亦无大祸。
