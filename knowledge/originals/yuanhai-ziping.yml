  text: 《珞琭子》云：年虽逢於冠带，尚有余灾。运初入於衰乡，犹披鲜福。《王氏注》云：年运或初离沐浴暴败之地，顺行至冠带，未可便以为福，尚有衰败之余灾也。或自旺地而行，初入衰乡，亦不可便以为祸，犹披旺之鲜福也。行运所以有前後五年之说。《壶中子》曰：将彻不彻，宁有久否之殃，欲交不交，尚有几残之祸。盖言运行在衰绝之处，将入吉庆之地，必於临离之时，更有重挠。运在吉庆之地，将入衰绝之处，必于初入之时，更有重福。又云：吉运未到先作福，凶神过去始为殃，乃火未焰而先烟，水既往而犹湿之理，当更详之。又云：阴男阳女，时观出入之年，阴女阳男，更看元辰之岁。盖言阴男阳女禀气不顺，故大运时观出运入运之年，而有吉凶之变。阳男阴女禀气虽顺，不以出入之年为应，亦不可遇元辰之厄会。《壶中子》云：元辰犯运，仲尼困陈蔡之饥是也。又曰：凡大运行有益处，为吉泰之运，亦不能常为福。须候太岁行年，更於生旺和合，方可发福。若大运至吉乡，却遇逐年太岁，小运到刑害之乡，亦主细累浮灾，但不为重害也。若大运行迍蹇凶祸之地，逐年太岁又见刑冲，小运不和，冲击死绝，方主发祸，若小运与太岁到生旺禄马贵神一切吉神，其年却有小庆，过去则否。《烛神经》云：凡推命之祸福，须先度量基地厚薄，然後定灾福。如命有十分福气，行三四分恶运都不觉凶，福力厚故也。若五六分恶运，只浮灾细累而已，至七八分恶运，方有重灾。如命有五分福气，行三四分恶运，为甚凶，若四五分恶运，则须死，盖基地不牢故也。若大运曾历过本命长生处者，谓之气盛之运，虽岁运来冲克者，为祸不重，运气强故也。未经长生而岁运刑冲克破，则便为灾，盖气未备运弱故也。若曾过旺相而逢死绝，如命不吉，为灾亦轻。阴阳五行代谢之顺道也，纵死於此，亦须令疾而终，若方经长生，历於败地，其中有刑克恶杀与命相符而见者，则五行之气反战，故有凶恶而终。
