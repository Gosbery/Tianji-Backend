  text: 如带印绶，须带官星，谓之官印两全，必为贵命。若官星虽现成得父母力，为福亦厚也。须行官运便发，或行印绶运亦发。若用官不显，用印绶为妙，最怕四柱中岁运临财乡以伤其印。若伤印主破家，离祖出赘。又临死绝之地，若非降官失职，必夭其寿。
