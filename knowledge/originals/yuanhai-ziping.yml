- id: yuanhai-ziping-ch065-p007
  volume: 选章正文
  chapter_path:
  - 第65章 论日为主
  sequence: 9
  text: 以日为主，年为本，月为提纲，时为辅佐。以日为主，大要看时临於甚度，或身旺，或身弱。又看地支有何格局，金木水火土之数，後看月令中金木水火土何者旺。又看岁运有何旺，却次日下消详，此非是拘之一隅之说也。且如甲子日生，四柱中有个申字，合用子辰为水局。次看余辰有何损益，四柱中有何字损其甲子日主之秀气。有坏其用神则要制之，不要益之。论命者切不可泥之月令消详，故表而出之。
  normalized_text: 以日为主，年为本，月为提纲，时为辅佐。以日为主，大要看时临於甚度，或身旺，或身弱。又看地支有何格局，金木水火土之数，後看月令中金木水火土何者旺。又看岁运有何旺，却次日下消详，此非是拘之一隅之说也。且如甲子日生，四柱中有个申字，合用子辰为水局。次看余辰有何损益，四柱中有何字损其甲子日主之秀气。有坏其用神则要制之，不要益之。论命者切不可泥之月令消详，故表而出之。
