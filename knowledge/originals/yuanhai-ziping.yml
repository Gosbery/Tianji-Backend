  text: 又曰：凡水命，四柱有土，至火运本是财运，却反为鬼者，以火生土，土克水，是财化为鬼，转福成祸。四柱有金至土运是鬼运，却反为吉者，以土生金，金生水，是化鬼为助气，反祸为福。又如水命人柱中有寅午戌，或纳音火，更行寅午戌，皆为好运，若四柱有金有火，固是为福，若行水运，则分其福，即为不好运。四柱多土，却行木运，名曰损气，主驳杂，虽有救，亦多辛苦歇灭，余仿此推。
