  text: 夫运者，人生之传舍。探命之说，尤以三元、四柱、五行、生死、格局致合，以定根基，然後考核运气，协而从之，以定平生之凶吉也。且根基如木，运气如春，春无木而不着，木无春而不荣。赋以根基浅薄者，如蒿莱之微，春风潜发，亦能敷茂，岂能久耶。根基厚壮者，如松柏之实，不为岁寒所变，此所谓先论根基，後言运气者欤。
