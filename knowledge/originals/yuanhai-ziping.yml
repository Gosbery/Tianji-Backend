  text: 亦名逆刃。如乙见甲为劫财。乙以庚为夫，见丙克庚，故克夫，男命则克妻。五阳见五阴为败财，主克妻害子。五阴见五阳为劫财，主破耗，防小人，不克妻。乙以戊己为财，以甲夺己坏戊；丁以庚辛为财，丙能夺辛破庚类，如此也。兄见弟，弟能败兄之财，夺兄之妻；弟见兄，兄能劫弟之财，而不敢娶弟之妻。财者，人之所欲，方令弟兄见之，多有争夺，如夷齐能有几人。男命见劫财多克妻，女命见伤官多克夫，此极论也。
