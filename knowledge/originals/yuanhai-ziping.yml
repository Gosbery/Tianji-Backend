  sequence: 83
  text: 伤官者，其验如神。伤官务要伤尽，伤之不尽，官来乘旺，其祸不可胜言。伤官见官，为祸百端。倘月令在伤官之位，及四柱配合作事，皆在伤官之处，又行身旺乡，真贵人也。伤官主人多才艺，傲物气高，常以天下之人不如己。而贵人亦惮之，衆人亦恶之。运一逢官，祸不可言。或有吉神可解，必生恶疾以残其躯，不然遭官事。如运行剥官，财神不旺，皆是安享之人。仔细推详，万无一失。
