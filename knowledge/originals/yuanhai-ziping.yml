  sequence: 100
  text: 比肩者，兄弟也。且如甲见甲为兄，乙为弟妹，寅卯亦然。见庚则克兄，见辛则伤弟。甲木旺，主兄姐争财。甲寅乙卯既多，则兄弟姐妹不和，争斗是非。见己合甲，兄姐不正；见庚弟妹不正。如见杀多，乙木得局，是杀合会乙木而伤甲。此兄不若弟之福，借弟之力而加恃。甲木寅月，乙木受制，主兄旺弟衰。其余和顺不睦，但以八字休旺死绝断之，无不应验矣。
