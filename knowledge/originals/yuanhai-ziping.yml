  text: 又曰：凡行运长生，主有创建作新之事。到临官帝旺，主兴盛、快乐、发福、进财、生子、骨肉之庆。到衰病之乡，多退败、破财、疾病等事。到死绝乡，主骨肉死丧、自身衰祸、钝闷百事蹇塞。到败运，主落魄、懒惰、酒色、昏迷。到胎库成形冠带之乡，百事得中、安康、平易。凡行运至夹贵华盖贵人六合上，及乘生旺气者，皆主善庆，仍须察当生根基，十分则应五分，生时五分则应十分，福与灾同。凡行运至临官帝旺上，太岁持之，官员主荐章改秩之喜，官印食神亦然。马旺贵人之地，必入参侍之列，盖贵为君道，马主迁动也。又曰：凡子丑寅卯辰巳四柱阳多人，行运至午未申酉戌亥上，乘阴气而发。午未申酉戌亥四柱阴多人，行子丑寅卯辰巳运，乘阳气而发。二者阴阳均协，然阴人阳发者快，阳人阴发者迟。
