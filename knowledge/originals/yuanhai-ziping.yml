  - 第142章 六亲总论
  sequence: 93
  text: 年为祖上，月为父母、伯叔兄弟门户，日为妻妾己身。且如六亲受克如何？印绶见财，克母及祖母也；见比劫羊刃，克妻妾及父也；官杀多者，难为兄弟；伤官食神多难为子息；枭印伤孙克祖母也。譬如正印作合母不正，财作合妻不正，偏财作合妾不正，比肩作合姐妹不正，伤官作合祖母不正，食神作合孙女不正。假如甲日为主，见癸为母，见戊辰，戊为父及妾，见己丑未字则与戊字相争夺，又伤癸水，克母之义明矣。见甲寅字，克父及妾；见庚申字，主克兄姐也；见乙卯字，克弟妹；见丙巳字，克子女也，余仿此。此必以运见何字则克何人。更将冲克衰旺向背，将来者进，功成者退。兼有孤神，寡宿，旬中有空亡者忌，二三反吉。金空则鸣，火空则发，水空则流
    (此三者上吉)；木空则朽，土空则崩 (二者主凶)。当以本生年起，克害无疑也。
