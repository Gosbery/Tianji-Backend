  text: 且如生命，天干内腑所属，诗曰：甲肝乙胆丙小肠，丁心戊胃己脾乡，庚是大肠辛属肺，壬是膀胱癸肾藏。天干外肢所属：甲头乙项丙肩求，丁心戊胁己属腹，庚系人脐辛为股，壬胫癸足自来求。子疝气，丑肚腹，寅臂肢，卯目手，辰背胸，巳面齿，午心腹，未脾胸，申咳疾，酉肝腩，戌背肺，亥头肝。肝乃肾家苗，肾乃肝之主，肾通於眼，胆藏魂，肝藏魄，肾藏精，心藏神，脾藏气。
