  sequence: 22
  text: 偏官即七杀，要制伏。盖七杀偏官即小人，小人无知多凶暴，无忌惮，乃能劳力以养君子。而服役护御君子者，小人也。惟是不惩不戒，无术以控制之，则不能驯服而为用。故杨子曰：御得其道，则驯服或作使；御失其道，则徂(音同促)诈或作敌，小人有徂诈也，要控御得其道矣。若失控御，小人得权，则祸立见矣。经曰：人有偏官，如抱虎而眠，虽借其威足以慑群畜，稍失关防，必为其噬脐，不可不虑也。
