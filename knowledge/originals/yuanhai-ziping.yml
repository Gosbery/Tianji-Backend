- id: yuanhai-ziping-ch055-p001
  volume: 选章正文
  chapter_path:
  - 第55章 论起大运法
  sequence: 1
  text: 凡起大运，俱从所生之日，阳男阴女顺行，数至未来节。阳女阴男逆行，数已过去节，但折除三日为一岁。阳男阴女顺运，假如甲子年，甲己之年丙作首，正月建丙寅，初一日立春後一日生男，顺数至二月节惊蛰，且得三十日，起十岁运，顺行丁卯。如乙丑年，乙庚之岁成为头，正月起戊寅，初一立春，十八日生女，顺数至二月惊蛰节止，得四三十二日，起四岁运，顺行己卯。余皆仿此。
  normalized_text: 凡起大运，俱从所生之日，阳男阴女顺行，数至未来节。阳女阴男逆行，数已过去节，但折除三日为一岁。阳男阴女顺运，假如甲子年，甲己之年丙作首，正月建丙寅，初一日立春後一日生男，顺数至二月节惊蛰，且得三十日，起十岁运，顺行丁卯。如乙丑年，乙庚之岁成为头，正月起戊寅，初一立春，十八日生女，顺数至二月惊蛰节止，得四三十二日，起四岁运，顺行己卯。余皆仿此。
