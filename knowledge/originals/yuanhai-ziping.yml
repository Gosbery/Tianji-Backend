  text: 木命见庚辛申酉多者，肝胆病。内则惊精、虚怯痨疾、呕血、头晕目眩、痰喘、头风脚气、左瘫右痪、口眼歪斜、风症。筋骨疼痛。外则皮肤乾燥、眼目之疾、发须疏少、颠朴手足损伤之患。女则堕胎、血气不调(堕胎，指孕妇不足月生産，又名小産、早産。血气不调，中医以气为血之帅，血为气之母，二者相互依存，如果不相协和，则可致病，而气血不调就是其病机。在这里指的是因气血不调所致的月经疾病)。小儿急慢惊风，夜啼咳嗽。经云：筋骨疼痛，盖因木被金伤。
