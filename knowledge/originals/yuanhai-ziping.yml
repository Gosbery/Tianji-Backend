  text: 夫大运者，以天干曰五运，地支曰六气，故名运气。子平之法，大运看支，岁君看干，交运同接木，何也？且干支二字，六十花甲子之说用花字，若天干地支得其时则自然开花结子盛矣。月令者，运元也，行运就月上起。譬之树苗，树之见苗则知名，月之用神则知其格，故谓交运如同接木。然命有根苗花实者何？正合此意也，岂不宜矣！
