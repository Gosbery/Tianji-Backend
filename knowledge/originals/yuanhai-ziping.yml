  text: 七杀者，子也。如甲见庚申是子，辛酉是女。若见丙火午寅，或杀临羊刃杀宫，主克子，不然疾病不肖。遇戊己得令，则子得力和顺。见丙巳字，女不正。若临沐浴桃花，更兼暗合食神多者，其女私通。若杀临长生、月德、天德所临之地，贵人禄马，食神财乡，言有强父贵子，要禀中和。阳日阳时男见重，阳日阴时先男後女，阴日阴时女见重，阴日阳时先女後男。伤官见官，子孙凶顽。时上伤官及空亡，难为子息。女命取伤官是子，食神是女，若见印绶、枭神，难得子也。男命官杀得地而禀中和者，言其有子，将生成之数断之。生旺倍加，死绝减半，太过不及，不以此断。太过有子而多克夭或凶顽，不及则少生养。官杀得地而有扶助，吉曜多者，其子忠孝贤明。居休囚死绝、破败衰病、勾绞、元亡、空虚之地，则子当不肖，贫贱疾病之子。更兼孤神寡宿，主孤苦伶仃。且如甲子之日、甲子之时，庚死於子，死中至老没儿郎。
