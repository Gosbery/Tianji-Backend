  sequence: 87
  text: 伤官七杀，甚如伤身七杀，其验如神。年带伤官，父母不全；月带伤官，兄弟不完；时带伤官，子息为顽；日带伤官，妻妾不完。其余伤官，务要伤尽则吉，见财方可。轻者远窜之灾，重则刑夭之难。伤官有战，其命难存。若月令在伤官之位，及四柱相合皆在伤官之处，如行身旺，即贵人也。伤官之人，多负才傲物，常以他人不知己，君子恶之，小人畏之。逢官运无财救，必主大灾，不然主暗昧恶疾，以残其身，或运遭官刑矣。如四柱虽伤尽官星，身若逢财运发福，是为伤官见财。仔细推详，万无一失。
