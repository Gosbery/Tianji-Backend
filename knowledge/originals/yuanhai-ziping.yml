- id: yuanhai-ziping-ch066-p001
  volume: 选章正文
  chapter_path:
  - 第66章 论月令
  sequence: 10
  text: 假令年为本，带官星印绶，则早年有官出自祖宗。月为提纲，带官星印绶则慷慨聪明，见识高人。时为辅佐，平生操履。若年月日有吉神，则时归生旺之处。若凶神则要归时制伏之乡。时上吉凶神，则年月日吉者生之，凶者制之。假令月令有用神，得父母力。年有用神，得祖宗力。时有用神，得子孙力。反此则不得力。
  normalized_text: 假令年为本，带官星印绶，则早年有官出自祖宗。月为提纲，带官星印绶则慷慨聪明，见识高人。时为辅佐，平生操履。若年月日有吉神，则时归生旺之处。若凶神则要归时制伏之乡。时上吉凶神，则年月日吉者生之，凶者制之。假令月令有用神，得父母力。年有用神，得祖宗力。时有用神，得子孙力。反此则不得力。
