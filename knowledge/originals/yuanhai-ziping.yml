  text: 又曰：凡行运，看纳音年庚金木水火土是何命人，如土命而行西南方，为西南得朋之庆。木命而行东方，火命而行南方，金命而行西方，水命而行北方，皆为得地。更看所行之运纳音与命相孚同类，最为上吉，财官次之。若泄气或受克重则不吉。
