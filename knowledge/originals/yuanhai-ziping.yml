  text: 夫印绶者，生我之谓也，亦名生气。以阳见阴，以阴见阳为之正印；阳见阳，阴见阴谓之偏印。喜官星生印，忌财旺破印。如甲人生亥子月中，水为印，忌火伤官，忌土破印。要行生旺之乡，怕行死绝。若行死绝之地，或有物以伤之，则危矣。印绶之人智虑，一生少病，能饱食丰厚，享现成财禄。若两三命相并，当以印绶多者取之，最忌财来乘旺，必生淹滞。若官鬼多或入别格，又不可专以印论。
