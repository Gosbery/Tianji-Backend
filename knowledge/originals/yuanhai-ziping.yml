  text: 又曰：丁丑人行丁未运，名曰将凡入圣，以假为真，不以退神论。四柱有丁丑丁未者，不在此限。若戊寅人行丁丑运，虽是退神，却有济化为福。若庚辰生人，或庚辰月行乙酉运，乙酉生人，或乙酉月行庚辰运，名曰鸳鸯两两，主发迹，但重叠者不佳。乙庚人酉年月日时者，大凶。甲申人行丙寅运名曰力停相冲，主破财争竞，屈伸不辨。丙戌人行辛卯运，主钝滞，只宜武人。丙子人行壬寅运，壬入丙家，破财不吉。余仿此推。
