  - 第161章 论太岁吉凶
  sequence: 134
  text: 太岁乃年中天子，故不可犯，犯之则凶。经云：“日犯岁君，灾殃必重，五行有救，其年反必招财。”且如甲日见戊土太岁是也，克重者死。甲乙者，寅卯亥未日时者，犯克岁君，决死无疑。有救则吉，乃八字庚辛酉巳丑金局也。经云：戊己愁逢甲乙，干头需要庚辛或丙丁火局焚木，有灾勿咎，效此推之。或得己和甲亦解之。大抵太岁不可伤之，相生者吉，乃五行有救，其年反必为财。犯岁君者，其年必主凶丧，克妻妾及破财是非，犯上之悔。加以勾绞、空亡、咸地、宅墓、病符、死符、白虎、羊刃诸杀并临，祸患百出。神煞加临，轻重推之。日干虽不克岁，犹恐运克岁君，若加岁运冲刑，羊刃冲合，主破耗丧事，倘有贵人禄马释之稍吉。八字有救无虞。故云：太岁乃衆杀之主，人命遇之未必为灾。若遇战斗之乡，必主刑於本命。
