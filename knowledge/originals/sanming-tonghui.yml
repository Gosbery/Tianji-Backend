  sequence: 53
  text: 经云：印绶、财星重见，百事难通。又云：月印纯粹，无财星，主文章中黄甲。又曰：身旺印多，财运无妨，身弱有印，煞运何伤！又曰：印绶有根，喜遇财星，印绶无根，忌见财曜，官星者，印绶之根也，印绶有官有财，则财生官，官生印，印生身，身克财则荣贵，故不忌。又云：印绶有根，逢财则发，逢官则显，逢合则晦，逢冲则灾。《通明赋》云：财印交错，论其气禀之轻重，倘若财轻而印气重，舍财取印，其贵可知；倘若印气轻而财气重，舍印取财，虽有背禄，支干重旺，反作资财。《宝鉴》云：印绶财伤，母年早丧。《奥旨》云：印绶被伤，失宗业，抛离故里。《络绎赋》云：印临子位，受子之荣。《千里马》云：逢印看官，而遇官十有七贵。《造微论》云：印绶逢华，尊居翰苑。《万祺赋》云：正印见财则凶，逢官则吉，有官无印，纵富贵而伤残，有印无官，纵荣华而有失，四柱愁逢死绝，三元喜见长生。古诗云：命逢印绶福非轻，年少从容享见成，旺相印多偏福厚，受恩承荫立功名。又：月逢印绶喜官星，运入官乡福必清，死绝运临身不利，再行财运百无成。又：印绶无亏享福全，为官承荫有田园，官膺宣敕盈财谷，日用盘餐费万钱。又：重重印绶格清奇，更要支中仔细推，支上咸池干带合，风流浪荡破家儿。又：印绶重重享见成，食神只恐暗相刑，早年若不归泉路，孤苦离乡宿疾萦。又：印绶不宜身太旺，总然无事也平常，除非原命多官煞，却有声名作栋梁。又：印绶生人旺气纯，官煞多遇转精神，印行死绝并财地，无救终为泉下人。合诸说，观印绶喜忌见矣。
  normalized_text: 经云：印绶、财星重见，百事难通。又云：月印纯粹，无财星，主文章中黄甲。又曰：身旺印多，财运无妨，身弱有印，煞运何伤！又曰：印绶有根，喜遇财星，印绶无根，忌见财曜，官星者，印绶之根也，印绶有官有财，则财生官，官生印，印生身，身克财则荣贵，故不忌。又云：印绶有根，逢财则发，逢官则显，逢合则晦，逢冲则灾。《通明赋》云：财印交错，论其气禀之轻重，倘若财轻而印气重，舍财取印，其贵可知；倘若印气轻而财气重，舍印取财，虽有背禄，支干重旺，反作资财。《宝鉴》云：印绶财伤，母年早丧。《奥旨》云：印绶被伤，失宗业，抛离故里。《络绎赋》云：印临子位，受子之荣。《千里马》云：逢印看官，而遇官十有七贵。《造微论》云：印绶逢华，尊居翰苑。《万祺赋》云：正印见财则凶，逢官则吉，有官无印，纵富贵而伤残，有印无官，纵荣华而有失，四柱愁逢死绝，三元喜见长生。古诗云：命逢印绶福非轻，年少从容享见成，旺相印多偏福厚，受恩承荫立功名。又：月逢印绶喜官星，运入官乡福必清，死绝运临身不利，再行财运百无成。又：印绶无亏享福全，为官承荫有田园，官膺宣敕盈财谷，日用盘餐费万钱。又：重重印绶格清奇，更要支中仔细推，支上咸池干带合，风流浪荡破家儿。又：印绶重重享见成，食神只恐暗相刑，早年若不归泉路，孤苦离乡宿疾萦。又：印绶不宜身太旺，总然无事也平常，除非原命多官煞，却有声名作栋梁。又：印绶生人旺气纯，官煞多遇转精神，印行死绝并财地，无救终为泉下人。合诸说，观印绶喜忌见矣。
