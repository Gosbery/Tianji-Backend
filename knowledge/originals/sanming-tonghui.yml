  sequence: 72
  text: 夫疾病皆因五行不和，即人身五脏不和也。盖五行通于五脏，六腑通于九窍，凡十干受病属六腑，十二支受病属五脏。丙丁己午火局南离，主病在上；壬癸亥子水局北坎，主病在下；甲乙寅卯属震，主病在左；庚辛申酉属兑，主病在右；戊己辰戌丑未属坤艮，主病在脾胃及中脘。诸风晕掉、眼光日昏，血不调畅、早年落发、筋青瓜枯，属肝家甲乙寅卯木受亏主病故也；诸脓血疮疥、舌苦喑哑者，属心家丙丁巳午火受亏主病故也；浮肿、脚气、黄肿、口臭、翻胃、脾寒膈热者，属脾家戊己辰戌丑未土受亏主病故也；鼻塞酒槁、语蹇气结、咳嗽喊者，属肺家庚辛申酉受亏主病故也；白浊、白带、霍乱、泻痢、疝气小肠，属肾家壬癸亥子受亏主病故也。
