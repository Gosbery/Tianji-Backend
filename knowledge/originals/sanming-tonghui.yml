  text: 壬申 己酉 丁巳 庚子，壬与己，庚与丁为官，壬与庚、己与丁为印。又云：看官星，有天官乡，取月干制岁干，如六甲年正月建丙寅，五月庚午，六月辛未，庚辛金能制甲木，戊癸即相带而行，甲癸人在午未，乙丙人在辰巳，丁戊人在寅卯，己庚人在戌亥，辛壬人在申酉，若人遇之，当食天禄，贵处朝伦。有地官乡，取月建制岁干，如岁干是甲乙，属木，七八月见申，属金，金能制木，甲乙人在申酉，丙丁人亥子，戊己人在寅卯，庚辛人在巳午，壬癸人在辰戌丑未，若人遇之，主早承休荫，官序易升。有真官乡，取命前三辰月干与命干合，如丙子人二月生，为命前三辰是辛卯，丙与辛合，故丙子二月生人为真官，中生之类，君子遇之，职居近侍，小人遇之，亦主富豪。如刘行素御史，
