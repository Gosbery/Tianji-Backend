  sequence: 52
  text: 又云：甲日子月，忌己巳时，怕午冲；乙日亥月，忌戊辰时，怕巳冲。丙日卯月，忌辛卯时，怕酉冲，寅月忌庚寅时，怕申冲；丁日寅月，忌庚子时，怕申冲，卯月忌辛丑时，怕酉冲。戊日午月，忌癸卯时，怕子冲；己日巳月，怕壬子、壬戌时，忌亥冲。庚日午月，忌己卯、乙酉时，怕子冲，巳月忌戊寅时，怕亥冲；辛日巳月，忌庚寅、甲午时，怕亥冲，午月忌辛卯、乙未时，怕子冲。壬日酉月，忌丁未时，怕卯冲，申月忌丙午时，怕寅冲，酉月忌丁巳时怕卯冲。以上日干，皆喜见比肩疏通，忌见食伤销印生财，犯此，物运又临身印衰乡财旺之地，必然贪财坏印，剥官退职。
