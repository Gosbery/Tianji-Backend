- id: sanming-tonghui-ch151-p001
  volume: 选章正文
  chapter_path:
  - 第151章 论伤官
  sequence: 54
  text: 伤官者，我生彼之谓，乃甲见丁、乙见丙之类，甲用辛为官，丁火乘旺，盗我之气，克制辛金，使不辅甲为贵，故名伤官。伤官格务要伤尽，方作贵看，元有官星，伤之则重。经云：“伤官见官，祸患百端”是也。伤官虽凶，乃我所生，自家之物，伤尽则能生财，财旺则能生官，造化展转有情。如月令在伤官，四柱作合结局，皆在伤位，无冲无破，不见一点官星，谓之伤尽。又有月支伤官，时上伤官，四柱无官星，亦谓伤尽。更身旺、财旺或印旺，名标金榜，一品贵人。此格主多材艺，傲物气高，心险无忌惮，多谋少遂，弄巧成拙，常以天下之人不如己，而人亦惮之恶之。伤官无财主贫穷，盖生财气者即食神伤官，盗财气者即七煞官星，所以伤官要见财，不要见官。假如甲生午月，木不南奔，身势太柔，岂可再逢金制？金能盗土之气，所以不要见官。既无官星，而柱却无一点财可恃，虽聪明机巧，不过虚名虚利。经云“伤官无财可倚，虽巧必贫”是也。
