  text: 古歌云：食神制煞吉非常，财旺妻荣子更强，柱中若要吞啖煞，管教金殿佐君王。又：食神逢禄号天厨，冲克空亡官煞无，死绝运临偏印地，寿星合处福交孚。又：食神印绶不宜逢，惟见财官福更隆，食神喜行身旺地，逢枭逢比总成空。又：食神生旺最堪讠夸，惟行水木土金佳，官煞更无来混杂，平生衣禄足荣华。又：甲人见丙本盗气，丙去生财号食神，心广体胖衣禄厚，若临偏印主孤贫。又：食神生旺无刑克，命逢此格胜财官，更得身旺逢财地，青春年少步金銮。又：食神无损寿绵长，庶母逢之不可当，若无偏财来救护，命如秋草带冬霜。又：食神月上号天厨，人命逢之富有余，切忌枭来明减福，最嫌冲去暗消除。生财化鬼兼无病，制煞为祥信有储，士子如逢利甲第，官封要职领天书。合诸说，观食神喜忌尽矣。
