  text: 丁未 丁未 丙午 丙午，丙日坐午，日主自旺，有二午、二丁、二未，财官俱伤，虽伤官伤尽，奈四柱火气太旺，窃气又重，运行东南火旺之乡，无一点财气，身空旺无倚，至贫之人，切不可见伤官伤尽身旺，便作好命看。又如甲日生人，柱有辛为官，又有丁伤官，若生秋月官旺，虽逢丁火或居亥、子之上，或见午伏壬、癸之下，则丁不能伤官，终为有官爵之命，岁运遇煞官印绶，俱吉，忌身衰败运，切不可见伤官格有官星，便不作好命看。又曰：人命原有些小伤官，不能损贵气，或运入官乡，官自旺强健，或入印运制伏伤煞，或有财生助，或从化入于别格，不失为好命，怕再行伤地，病而不起者有之，否则文书口舌，官事破败，殃祸踵至。柱元有财，又行财运，亦可成就功名利禄，一行官煞地，或财衰败死绝地，即失财禄，非官讼则丧服重并。又曰：四柱伤官，惟年干伤官最重，谓之福基受伤，终身不可除去，若月支更有，甚于伤身七煞。如甲日人，以辛为官，见丁卯年，生寅午戌月，是伤官重犯，又有卯为劫刃，名背禄逐马，主为人退悔，反伤祖荫，运行官乡，流年再见，或煞旺身弱运，必祸。若月令真正伤官，又见官星，如甲日生午月，见辛未时，午中丁火伤辛；乙日生巳月，见庚或甲申时，巳中丙火伤庚；丙日午月，见戊子、癸巳时，午中己土伤癸之例。大要日主健旺，再临伤官运，可发名利，日主微弱，运历财官乡，祸不可言。又曰：伤官，如甲日见丁，喜壬合癸破；乙见丙，喜辛合壬破；丙见己，喜甲合乙破；丁见戊，喜癸合甲破；戊见辛，喜丙合丁破；己见庚，喜乙合丙破；庚见癸，喜戊合己破；癸见甲，喜己合庚破。
