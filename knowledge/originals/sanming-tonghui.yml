  text: 凡行运，长生主有创建作新之事；到临官、帝旺，主兴盛快乐，发福进财，生子骨肉之庆；到衰病之乡，多退败、破财、疾病等事；到死绝乡，主骨肉死丧，自身衰祸钝闷，百事蹇塞；到败运，主落魄懒惰，酒色昏迷；到胎库成形、冠带之乡，百事得中，安康平易。凡行运至夹贵、华盖、贵人，六合上，及乘生旺气者，皆主善庆，仍须察当生根基，十分则应五分，生时则应十分，福与灾同；凡行运至临官、帝旺上，太岁持之，官员主荐事改秩之喜中。
