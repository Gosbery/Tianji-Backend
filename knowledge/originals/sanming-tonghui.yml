  text: 丙子 辛卯 丙子 辛卯，正合此说。又云：术者以甲见辛为官，不知真五行克纳音为真官，此最紧福坤。干头自见官而得合者为上，有诸神来朝者最佳。如甲寅生，纳音水，得己亥，甲己为真土，是纳音见真五行克也。若不见太岁本干克，但于日月时上见乙庚亦是。若止见庚，谓之偏官，比之全者减力，又不见乙庚，止见乙巳、乙丑、乙酉，余位中多见申，不见申止得三五分力，余仿此。又如己酉、己卯见丁壬，壬子、壬午见乙庚，虽纳音见真五行克为官，奈本干同受克，故不作真官，而作真鬼断之，大小运流年逢之，灾尤重。此亦看官星者所当知。《喜忌篇》云：“五行正官，忌冲刑克破之官。”《五言》云：“有官要有印，无刑足可夸，不为金殿客，也作富豪家。”《秘诀》云：“官星重见，只作煞推，再至官乡，灾非难免，若是太多，制之为福。”古歌云：“正气官星用月支，喜逢财印到年时，破害冲空俱不犯，富贵双全报尔知。”又：“官星不可被刑冲，官煞同来吉变凶，化煞为官方是吉，化官为煞祸重重。”又“官星大抵要身强，身弱须求气旺方，印绶兼行财旺地，无冲伤破是荣昌。”又：“生月官星坐禄乡，日辰生旺福无疆，有财有印无伤破，年少成名坐玉堂。”又：“月逢正禄号真官，不犯刑伤禄最宽，日主兴隆名利显，运逢财印步金銮。”又：“印多官多为贵命，官旺身衰反为病，官多身旺化为财，财旺身衰贫病并。”又：“正官大抵要纯和，四柱无伤掇显科，时上喜逢财健旺，柱中欣见印生多。提纲独遇为真贵，年位重逄乃太多，别处若有煞来混，反为辛苦受奔波。”合诸说，观正官喜忌见矣。
