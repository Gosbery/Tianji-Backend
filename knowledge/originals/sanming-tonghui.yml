  sequence: 89
  text: 且如六甲生人，以癸水为母，癸为正印，如遇己土正财；戊土为父（戊合癸也），戊是偏财，如遇比劫，则父有伤。六乙生人亦以癸为母，癸是偏印；以戊为父，戊是正财。甲乙俱以庚辛为子，庚金为男，在甲则为七煞，在乙则为正官也；辛金为女，在乙则为七煞，在甲则为正官也。己土为妻，戊土为妾，谓乙木克己土也。虽云阴见阴不成配合，然阴木克不得阳土，且妇人以阴为正也，故云甲乙俱以己为妻，戊为妾。如女人则甲遇庚七煞，乙遇庚正官，皆夫星也。谓庚是阳男为正夫，属阳不可以辛阴为夫也，但阳见阳多无情，阴见阳则夫妇和鸣。
