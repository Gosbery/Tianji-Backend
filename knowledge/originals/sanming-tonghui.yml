- id: sanming-tonghui-ch144-p001
  volume: 选章正文
  chapter_path:
  - 第144章 论印绶
  sequence: 41
  text: 印绶者，乃五行生我之名。如甲乙在亥子月，丙丁在寅卯月之类，乃我气之源，为生气，为父母，能护我官星，使无伤克，譬人生得物相助相养，受现成之福，岂不为妙？此格主聪明，多智慧，性慈惠，语善良，迟讷体，貌丰厚，能饮食，平生少病，不逢凶横，但吝财耳，为官多为正官，受宣敕不拘文武，皆掌印信，喜官星，以官能生印。经云：印赖官生。又云：有官无印，即非真官，有印有官，方成厚福是也。忌财星，以财能破印。经云：印绶生月岁时，忌见财星，运入财乡，却宜退身避位是也。岁运同论，印绶不逢损伤，多受父母倚荫，资财见成，安享富贵，诸命相比，当以印绶多者为上，月最要，日时次之，年干虽重，须归禄月日时，方可取用，若年露印，月日时无，亦不济事。四柱元有官星为妙，若印绶少，官鬼多，或入他格，又不可专言印绶，若印绶复遇拱禄、专禄、归禄、鼠贵、夹贵、时贵等格，尤为奇特，但主少子或无子，印绶多者清孤。凡印绶，喜七煞，但煞不可太多，多则伤身。原无七煞，行运遇之则发；原有七煞，行财运，或印绶死绝，或临墓地，皆凶。经云：煞能生印，畏行财乡，破印助鬼，决主不详。凡格喜身旺，惟印绶喜生弱，若元局带财伤印，运行比劫身旺，亦能发福，无则不宜，如无官煞财神，又行身旺，主平常。
