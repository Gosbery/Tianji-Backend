  sequence: 40
  text: 又曰：术者多以甲见戊、乙见己类为财，不知甲己见丙辛、丙辛见戊癸等类为真财，生居有气旺相之位，主富盛。又纳音本干自见真五行，如乙亥人月日时中见庚，乙亥纳音火，乙庚真金，干头自是财也，此名天财，主富足优逸。若纳音反制克干头，如丁卯火却能制乙庚金，此名鬼财，主一生得世财，或为豪猾胥吏起家。戊寅、戊申得丙辛，乙酉、乙卯得戊癸，准此。更带辰戌丑未，主为艺术，大获世财。
