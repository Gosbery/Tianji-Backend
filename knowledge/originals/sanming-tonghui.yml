  sequence: 58
  text: 《万祺》云：伤官元辰无官星，又行伤官运，此为窃气太过，即一木叠逢火位，名为散气之文，非贫则夭，喜身旺及官乡，伤官见官，再剥再滞，运入官乡局中，反吉，即伤官伤尽却喜见官星。伤官若带财见印，祸不轻。伤官若带印，官煞不为刑，伤官多者宜行印，即食多用印。伤官少者又行印乡，即枭神夺食。伤官若带印，不宜逢财，伤官若带官，不宜行制伏，伤官用财，不宜行此劫，伤官用印，不忌见官煞，伤官若见官星重叠，莫作官星论。伤官用官，在年月必要剥官，运在日时，不宜被伤，一见被伤，祸不可言，不可临墓，住寿难延。《千里马》云：伤官见官，妙入印财之地。又云：伤官逢财而有子。《相心赋》云：伤官伤尽，多艺多能，使心机而傲物气高，多谲诈而侮人志大，颧高骨峻，眼大眉粗。《景鉴》云：伤官无财而带刃，行奸弄巧。《通明赋》云：重见伤官，身必辛勤劳苦。又云：伤官多而身旺无依，定为僧道艺术为士。秘诀云：伤官太重，子必有亏。又云：年带伤官，父母不全，月带伤官，兄弟不完，时整伤官，子息凶顽，日带伤官，妻妾不贤。又云：伤官不尽，须防不测之灾，伤官逢财，乃享优游之福，七煞同来，疾损须忧，身旺无依，孤克难免，伤官遇劫，聚财如柳絮随风，伤官无印，求利似荷钱擎雨。
