  sequence: 27
  text: 舍干支而总言之，甲生亥死午，乙生午死亥，就禄于寅卯，是甲乙、寅卯同也。丙生寅死酉，丁生酉死寅，就禄于巳午，是丙丁、巳午同也。庚生巳死子，辛生子死巳，就禄于申酉，是庚辛、申酉同也。壬生申死卯，癸生卯死申，就禄于亥子，是壬癸、亥子同也。戊生寅死酉，己生酉死寅，就禄于巳午，与火同位，子随母旺之义，而辰戌丑未，乃其正位也。由是天干地支，相合配偶，生克制化，旺相休囚，其名为印、为枭、为食、为伤、为官、为煞、为财、为劫，刑冲破害，虚邀暗合，而变化无穷矣。徐子平识破此理，故只论财、官、印、食，分为六格，而人命之富贵、贫贱、寿夭，穷通举不外是其余格局，不过自此而推之耳。
