- id: sanming-tonghui-ch152-p002
  volume: 选章正文
  chapter_path:
  - 第152章 论食神
  sequence: 61
  text: 食多者宜行印运，食少者不宜，是枭神夺食，故食喜旺禄相助，月令建禄最佳，时禄次之，更逢贵人运，行食神生旺之地，大地福禄。忌身衰枭旺，柱中虽喜见财，亦不宜多，多则不清，不过一富翁而已。食神重见，变为伤官，令人少子，纵有，或带破拗性，又不可入墓，即是伤官入墓，住寿难延。大忌空亡，更有官煞显露，为太医师巫术数九流之士，若食神逢克，又遇空亡，则不贵，再行死绝或枭运，则因食上气上生灾，翻胃噎食，缺衣食，忍饥寒而已。又曰：甲日食丙，柱中无壬癸亥子方好，如有水气，丙自受制，屈伏于人，己身不能卓立，岂能生物以养其父？如无此制，又要生旺向禄，如丙生夏月，运历东南，火土俱旺，其甲用财必厚。若生三春甲旺，丙火虽得生，不知戊己气薄，须历南方火土俱旺，方许发福。又如庚以壬为食，运历北方水旺之地，发财必厚，东方木旺之乡，发福必紧。细论之，庚以壬为食，长生于申，当断申地福重，暴败在酉，壬水至酉，便不为佳，以壬生甲木为庚之财，即自生分发身之财，非婚配正妻之财，甲至酉地为木困金乡，壬水自败，木岂能助养其父？当断此运平平。行至戌运，如干遇壬甲，亦只断其半吉半凶，逢戊可断其有灾，见庚可断其微福。亥运当言其大吉，子运癸水伤官，伤重泄本身之气，又庚死于子，甲败于子，当断生祸身灾。运至丑，庚金之库，水旺之乡，又有己丑助庚甲冠带成人之地，可断此十年发。寅运亦吉，卯运有灾，余例此推。又曰：食神忌枭，亦有不畏者。如己亥不畏丁倒食，丁与壬合化木，而壬禄在亥；丙午不畏甲倒食，甲与己合化土，而己禄在午；乙巳不畏癸倒食，戊癸化火，乙巳亦火；癸巳不畏辛倒食，丙辛化水，癸贵在巳；庚为众阳之首，不畏戊倒食，戊，阳气归源之数，见戊作喜神论；已不倒食辛，阴气初发散之源；庚不倒食壬，阳气初发散之源；辛有丁，不畏己倒食，为丁养育辛金也，况有丁处便有己土，阴阳干涉，得清福之助。
