  sequence: 5
  text: 又有真太岁、征太岁之说。经云：生时相逢真太岁。假如甲子生人又见甲子年，谓之真太岁，又名转趾煞，要大运日主与太岁相和相顺，其年则吉；若值刑冲破害，与太岁互相战克则凶。如癸已日逢丁亥流年；日干支冲克太岁曰征，运干支伤冲太岁亦曰征，太岁干支冲日干支亦曰征，其年则凶，灾祸未免。又如甲子流年又是甲子运，谓之岁运并临，独羊刃、七煞为凶，财、官、印绶亦吉。又如甲子日见甲子太岁，谓之日年相并，如君子得之，谓之君臣处会，其年利奏对，有面君之喜，若当省士人得之，有登荐仕进之象，又要与岁君帝座和协，方为奇特；若是常俗小人遇之，最为不善，若生时相和，为灾稍轻。故经云：太岁当头立，诸神不敢当，若无官事扰，定主见重丧。此之谓与！更加以勾林、元亡、咸池、孤苦、宅墓、病死、官符、丧吊、白虎、羊刃、暴败、天厄诸凶煞并临，祸患百出，甚者死。
