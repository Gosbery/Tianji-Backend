  sequence: 10
  text: 夫太岁者，年中天子，一岁诸神煞之尊；统正方位，四送六气，迁运四时以成岁功，至尊无上，若人遇克冲压伏，皆为不详之兆。运者协和二十四气，般运一生休咎，扶持四柱，辅弼三元，运与流年二者相为表里，乃人命祸福死生所系，岁用天元，运用地支，凡行好运而日干伤流年天元，为福轻；若行不好运及脱财官运而日干伤岁干，为祸重，若是已发之命，祸患立至，凡行不好运，未可便言衰绝，大要知已发未发，其气数已过未过言之。行运以生月为运元，最怕行运与太岁冲克，若岁运冲月必祸；若岁运与日相对，谓之返吟，岁运压日，谓之伏吟，二者不利六亲，非横破财，不为吉兆。凡岁运吉凶，当生天元，或支中原无官星，天元有正官或原有偏官制伏太过，运遇天元官星，亦可发福；支无财而运干是财，亦可发财；支无煞而运干是煞，亦足为祸。
