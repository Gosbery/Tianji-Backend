  - 第71章 论正官
  sequence: 28
  text: 正官者，乃甲见辛、乙见庚之例。阴阳配合，相制有用，成其道也。故正官为六格之首，止许一位，多则不宜。正官先看月令，然后方看其余。以五行之气，惟月令当时为最，况四柱各管年限，年管十五，失之太早，时管五十后，失之太迟。故只此月令为正，余格例此。甲日生酉月，乙生申巳，丙生子，丁生亥，戊生卯，己生寅，庚生午，辛生寅巳，壬生午未丑，癸生辰巳戌月，皆为正气。官星更天干透出，如甲见辛酉，乙见庚申之例，谓之支藏干透，余位不宜再见，又须日主健旺，得财印两扶，柱中不见伤煞，行运引至官乡，大富大贵命也。大忌刑冲破害、伤官七煞、贪合忘官、劫财分福，为破格。如甲生酉月，见卯为冲、酉为刑、午为破、戌为害、丙为合、乙为劫、丁为伤克、庚为混杂、须是官星纯一，五行和粹，方以正官论。若见前忌柱中，虽有物去之，亦不纯粹，若官星结局，又有财资扶，非行身旺地不发。官止一二，无财有印，身弱无妨，若四柱皆归背禄，宜推岁运向背财官旺地。何如？若财官满目，日主衰弱，不能负荷，徒劳无用，运至财煞旺乡，多染痨瘵，但有七煞行运复遇，便是徒流之命。又曰甲生酉月，辛金正禄，若见丁伤，支中无局，时引归衰败死绝之地，或有制合去之衰绝之火，岂能伤其旺禄。若时引官星临衰败死绝之位，反引丁火归生旺之乡或临煞地，降官失职，祸生无疑。时为归息之地，吉凶全在时消息。日主用神太盛，宜时以节制之；日主用神渐衰，宜时以补助之。柱中虽有凶神，时能节制，亦不能为祸。此看命之要法也。又曰甲生丑月，内有辛金，又值酉时，己是重犯，若天干复透辛多，更行西方，力不胜任，变官为鬼，旺处必倾，多致灾夭，须有合制方吉。若自身乘旺，如甲寅、乙卯等日，更有印生助，官星虽多亦不为害。甲生戌月，虽坐火库，若不成局，无党不能为害。又曰取官星不必专泥月令支辰，或月干，或年日时支干，只一处有，不曾损伤，皆可取用。故经云：明干有气明干取，明干无气暗中取。若明干无气，引归地支，或有助托，运行得地，亦不减月内官星之福。又曰凡论官星，略见一位食神坐实，便能损局，惟月令隐禄，见食却为三奇之贵。大要看官食虚实何如，若官星坐实，合神略虚，随官助贵；合神坐实，官星渐弱，官随合神，谓之贪合忘官。又曰正官格，要行印乡，即是逢官看印，柱中原有印随，官因轻重，日干强弱，以观所以之运，身弱印轻，要补其印，身旺官轻，要补其官，行伤官运即是背禄，行身旺运即是逐马。《三命铃》云：凡禄命身三等官，各禀五行，率以其性推之，如以金为官，职位清峻，多掌刑狱钱谷之任，决断明敏，遇行年太岁在丑为官库。若以木为官主，品秩清高，和俗守慎，遇行年太岁在未为官库。以火为官主，官序炎赫，为性猛烈，用刑惨酷，亦主发歇不常，遇行年太岁在戌为官库。以水为官主，职卑位下，级升序进，谦和得众，矜恤孤寡，亦有道性，遇行年太岁在辰为官库。以土为官主，官序稳当，难侵犯，厚重质直，法令分明，遇行年太岁在辰为官库。凡五行之官，各随其性则吉，若失其性，则主为官不久。西蜀知命者云：凡人年月日时，四干迭相，官印足者，主贵。历观大命，遇两印者颇多，如吕吉甫学士，
