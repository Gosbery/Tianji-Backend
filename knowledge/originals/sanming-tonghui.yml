  sequence: 51
  text: 赋云：金赖土生，土厚而金遭埋没。木从水养，水盛而木必漂流。火炎土燥，则不能生物（如己日得午之类）。刚金不能生水（如庚日得戌之类）。旺土见旺火，逢此必主眼疾痈疽热病。粪土不能生金，燥金不能生水，绝水不能生木，遇此宜详看，不可一概印绶论。若水得金生而逢秋，乃水清金白，秀丽堪夸，一水三金，号曰体全之象。火得木生而值春，为木秀火明，发焰红绿，见金则伤其木，灭火之焰。是金木二印，多者俱作吉论。若火印多者火燥土烈，水印多者水泛木浮，土印多者土重金埋，皆不为吉。
