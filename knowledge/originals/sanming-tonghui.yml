  sequence: 90
  text: 或云：取正财为妻，偏财为妾；女甲则辛为正夫，取阴阳之正合也。甲乙生人俱以甲为兄姊，乙为弟妹，以丁为婆，生我父者为祖母，丁生戊也。壬水为公，壬与丁合也。又以丁火为丈母，生我妻者为我外母，丁生己配与甲作正妻也。壬为丈人，壬与丁合也。妻之兄弟为妻舅。己土为妻，戊土为妻兄妻舅。癸水则是舅之妻为妗也。其余八干俱以类推。女人取用与男不同，我生者为子，克我者为夫，生我夫者为姑，克我姑者为公，其余父母兄弟皆与男同断，但须辨其阴阳耳，如甲乙干则以丙为男，丁为女，庚为夫，辛为夫之兄弟，己为姑，甲为公也。经云：以年为祖业，月为父母兄弟门户，日为妻妾己身，时为子息。须看四柱之中父母兄弟妻子星具何地？论旺相休囚而言其吉凶。如父母星坐长生旺库禄马贵人之地，则主父母富贵福寿荣耀；如坐空刑克煞死亡衰败交并之地，则主父母贫薄破伤刑夭，或死于外及不善终；若带刑带破害，虽居于生旺库之地，主父母有寿而贫贱。兄弟星若生得时得令，坐长生库旺禄马贵人之地，则主兄富贵荣华成群；如坐刑克煞刃死绝衰败之地，兄弟不得力；如坐长生旺库而遇刑冲破害者，虽有兄弟而仇敌及不得力。如妻妾星坐生旺库禄马贵人之地，或有物以生之，主妻妾富贵荣华，美貌多才；如坐空刑克煞羊刃死绝冲败之地，则主妻妾贫薄丑貌刑夭淫乱、残疾或产亡不得力；如坐生旺禄马之地，被刑冲克煞，妻虽有寿亦主破相贫薄。如子息星坐生旺禄马贵人官印之地，有物以相生，主子息荣华聪明，多得送老；如坐禄马贵人居于死绝之地，虽有聪明俊秀，不送老也。如居生旺之地被刑冲破害，有子主愚顽或残疾送老；如居死绝又刑冲破害劫财之地，不得子之力，纵有子主残疾破相或不才。女命如子居生旺之地，主多子；如坐禄马贵人，主子富贵福寿；如坐空刑克煞并冲羊刃死绝之地，主子不得力。或问：甲乙日主以戊癸为父母，四柱干支并无癸水，只戊壬人二字显于干头，或藏于地支，则论何者为父母？答曰：本经所谓明干有时明干取，明干无时暗中求是也。如柱无癸字只有戊字是甲乙之父，将父求其母，如无母只将壬为母，亦须论戊为父。其戊壬不得系婚配，非儿女嫁娶，必是服内成亲，或母多父岁，或失婚而再配也。或又问甲日主月支年支是乙木，时支是甲木，乙先甲后，何为兄？何为弟？答曰：不论先后，只以强为兄，弱为弟。夫人之生也，上父母，下妻子，中兄弟，其联属离合，命之为也。言命不及六亲，自是偏见。
