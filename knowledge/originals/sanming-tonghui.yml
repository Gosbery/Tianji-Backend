  sequence: 71
  text: 歌诀：甲胆乙肝丙小肠，丁心戊胃己脾乡；庚是大肠辛属肺，壬系膀胱癸肾藏；三焦亦向壬中寄，包络同归入癸乡。又曰：甲头乙顶丙肩求，丁心戊肋己属腹；庚是脐轮辛属股，壬胫癸足一身由。又曰：子属膀胱水道耳，丑为胞肚及脾乡；寅胆发脉并两手，卯本十指内肝方；辰土为皮肩胸类，已面咽齿下宾肛；午火精神司眼目，未土胃腕隔脊梁；申金大肠经络肺，酉中精血小肠藏；戌土命门腿踝足，亥水为头及肾囊；若依此法推人病，歧伯雷公也播扬。又曰：午头巳未两肩均，左右二膊是辰申；卯酉双肋寅戌腿，丑亥属脚子为阴。又曰：乾首坤腹坎耳俦，震足巽股艮手留；兑口离目分八卦，凡看疾病此推求。
