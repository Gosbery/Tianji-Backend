  text: 又曰：凡论残疾病症，先论日干，次详月令，然后通年时看之，伤官主残疾，煞重亦然。乾卦在亥，亥为天门，六辛生人得此日此时，多主盲聋。亥属肾，肾通耳，丙火遭水克也；子位坎宫，伤官煞重相刑，主下部疾；寅宫艮土，主脾胃，面色痿黄之疾；辰属震；此月带伤官，少年主多惊疾，盖震者动也。轻则主惊脾胃疾，重则主足疾。巳为巽，伤官煞重，主妇女血气不调，劳疾；午为离为目，伤官煞重，主失明头风之症；申属坤。为众阴，伤官煞重，主腰脚筋骨之疾；伤官伤尽者不在此论；酉为兑，属口齿不完之疾。戌为火库，主下血痔漏之疾。丑未伤官，亦主脾胃。伤官煞旺者，年年病瘟，主用上下战克、五行无救助，主身体不完，头面残伤。
