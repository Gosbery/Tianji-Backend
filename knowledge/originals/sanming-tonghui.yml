  - 第152章 论食神
  sequence: 60
  text: 食神者，日干所生顺数第三位，乃甲食丙、乙食丁之例。甲生丙为泄气，丙生戊为甲偏财，偏财是天禄自然之财，不劳己之心力，享见成福禄。甲丙有父子之道，如子旺相，生起财禄以奉其父母，岂不安享？又甲见庚为煞，见戊为财，其食神丙火能制伏庚煞，使不得克伤甲木，能生戊财，使为甲木所用。凡命遇财煞之地，食神旺相，煞被食制，不敢为祸，财被食生，充裕不竭，故食神一名寿星，一名爵星，良有以也。此格要日主食神俱生旺，无冲破，主人财厚食丰，福量宽弘，肥体肥大，优游自足，有子息，有寿考。四柱见财食在岁月上，祖父荫业丰隆，在日时，妻男获福，怕母子俱衰绝，两皆无成。故经云：“食神宜食生食旺，不可食衰食绝。”又云：“食神生旺，胜似财官”是也。食神大忌偏印为倒食，主为人有始无终，容貌欹邪，身材琐小，心性局促，多愁无成。假如甲见丙为食，柱中有壬作甲木偏印，克制丙火不能生戊土，不能制庚金，使甲木受制退财，岂不窘乎？《元理赋》云：食神制煞，逢枭不贫则夭。《一行》云：阳日食神暗合官星，阴日食神暗合正印，官印不要明显，但得食神纯粹，主贵而有禄，富而有寿，食神只宜一位，不宜太多，恐窃本元之气。经云：“一木叠逢火位，名为散气之父”是也。
