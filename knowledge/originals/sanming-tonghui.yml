  sequence: 70
  text: 又曰：推人性行，只在日时上，看本五行，不论纳音。命若入格而逢生旺，主天性明白，遇物不逆，动必应机，言语声高，突破口大度，临事能断，公平不疑，犯难不畏，平生不以财物为吝，好施与不私己，奢泰欢乐，多情尚义，防有不善终之患。若命入贵格而逢死绝者，主为性寡合，机深意密，多疑多忌，动拘礼节，谨顾行止，修饰仪貌，常自检约，不妄设施，防有阴谋之患。若小人之命已入贱局而逢生旺者，主性无常，不自检束，为事不顾危亡，好斗争，恃强压弱，亲近恶党，不事家业，必竟不得善终；死绝则为性淫邪，动必巧伪，畜缩执拗，举动修饰，专美言词，好自矜炫，临事无断，少是多非，一身无立。《宰公要诀》云：志高量远，盖因水处深源；笃信守仁，只为土成山岳；仁慈敏厚，木成甲乙之方；性速辨明，火应丙丁之位；誉高义重，因金归合庚辛处。于中者，正性不移，或盛或衰，性情变易。水乘衰败，性昏无赖；土力太微，蔽执寡用；木归蹇地，太柔而治事无规；火数未兴，小辨而太伤无决；金当浅薄，虽义而有始无终，是五行得地失地，太过不及，皆能为凶也。《壶中子》云：言词狡猾，诞时合值六虚，六虚住处谩语神，凡人得之，心好撰饰，虚词并重；遇者必狡猾，平生妨克尊亲，漂流他国，作事多虚声。
