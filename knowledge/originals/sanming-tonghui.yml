  text: 正财者，乃甲见己、乙见戊之例。受我克制，为我之妻，譬人娶妻，妻赍财嫁我，我必精神康强，而后可享用，若衰微不振，虽妻财丰厚，但能目视，终不得用。故财要得时乘旺，不偏正混乱，不重叠多见，自家日主有力，皆能发福。若财多身弱，柱无印助，财少身强，柱有比劫，太过不及，皆不为福。《珞》云：若月令得财局，身衰逢印资助，当作富论，如先见印，却怕见财。《独步》云：先财后印，反成其福，先印后财，反成其辱是也。用财不宜明露，柱见比劫，则宜透出，使人共见则不能夺。赋云：财宜藏，藏则丰厚，露则浮荡是也。凡财格，喜见官星显露，别无伤损，或更食生印助日主健旺，富贵双全。如干支见煞，亦能享用，即逢财看煞之义。大怕枭，夺则不能生，刃劫则不能享，库逢空则不能聚。如甲生午月，见壬伤，丙卯破，乙夺；乙生巳月，见癸伤，丁亥破，甲夺；壬生戌月，甲子旬戌落空亡之类。余以例推。又曰：财为养命之源，凡人八字不可无财，但不要太多，多则不清，若柱原无财而行财运，乃有名无实，如财多身弱，又行官乡财旺之地，见财盗气，官克身，不惟不发禄，且祸患百出。又曰：财为马，官为禄，二者不可缺一，实难两全，原有财星宜行官运，原有官星宜行财运，行财运生官，行官运发财，若柱中原无官星，只是财多，又行财运，亦能成就名利，间有登科者。盖财不畏多，多则暗生官也，须得身旺方能胜任，若无财，官多身受其制，反不为吉，柱中无官，只取有财为福。又曰：财官与煞，用月支者，所谓以支为命，日干者，所谓以干为禄，若月支有财官，干头不露，自足为福，若地支无财官，干头明露，乃虚诈无实之命，纵行旺运，亦不济事。苟月支无而年时日支有，亦可取用，月地支坐财官，谓之得时，日地支坐财官谓之得位，时地支坐财官，谓之有成。得时为上，得位次之，有成又次之，兼得一二尤妙。年主祖父富贵，中年后无用。又云：庚辛日生于正月，别位有火为煞，以克庚辛，虽年月见寅卯，亦无祖财，一生熬煎，遇发财处必成灾祸，以木旺生火，害日干之金，天元羸弱，财党煞生，不能为福。又云：正财之格，主人诚实，行事俭约，赋性聪明，惟有悭吝，若财旺身衰，主妻秉男权，持家干蛊，又主有好子替力，反得优游之乐，运行比劫，妻妾多危。《独步》云：财旺生官，富而且贵，露官藏财，无不高位，藏则丰厚，露则虚费，冲者宜透，实则滋利。《中书奥旨》云：我去克他为妻财，干强则富。又云：身弱财多，喜兄弟羊刃为助。又云：财旺者遇比无妨。又云：妻财明朗，乔木相求，财星入墓，必定刑妻，支下伏财，偏房宠妾。口诀云：财星太过愚。又云：大运、流年、三合财乡，必主红鸾吉兆。《千里马》云：财源被劫，父命先倾。又云：男逢财多身弱，妻话偏听，财星得位，因妻致富成家，财遇长生，田园万顷，财旺生官，白身荣显。《元理赋》云：大贵者用财而不用官。又云：财临旺地人多福。又云：孤寡者只为财神被劫。秘诀云：财生身旺两相停，不喜再见比肩。《万祺》云：正财逢生旺而优游享福，遇劫财则晦滞呻吟，官星若见，平生惹是招非，七煞若逢，处事少成多败。财旺身衰，祸深福浅，财多身弱，要印扶身，身旺财衰，怕劫分夺，财食入库者福厚，例食求财者贫夭。诗曰：正财喜旺食丰盈，日主刚强力可胜，若是财多身自弱，平生破败事无成。又：正财还与月官同，最怕干支遇破冲，岁运若临财旺处，须教得富胜陶公。又：正财切忌劫财神，破害刑冲不可论，岁运那堪逢刃地，命延不死也遭。财星得位正当权，日主高强名利全，印绶若逢相济助，金珠满柜福绵绵。又：身旺无官只取财，财神冲破却为灾，身衰财旺还知夭，官盛身强福禄媒。又：财多如何不发财，只因身弱少培栽，运到比肩身旺地，富贵荣华次第来。又：财多身弱刃刚强，身旺之乡大不祥，凤寡鸾孤寒夜怨，房中妻哭两三场。又：财神忌透只宜藏，身旺逢之大吉昌，切忌比劫相遇会，一生名利被分张。又：财多身旺足荣欢，身旺财多化作官，身衰财多财累己，是非不竞起争端。合诸说，观正财喜忌见矣。
