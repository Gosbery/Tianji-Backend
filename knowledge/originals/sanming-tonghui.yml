  text: 赋云：筋骨疼痛，盍因木被金伤；眼目暗昏，必是火遭水克；土虚逢木旺之乡，脾伤定论；金弱遇火炎之地，血疾无疑。又云：木逢金克，定主腰肋之灾；火被水伤，必主眼目之疾；心肺喘满，亦干金火相刑；脾胃损伤，盍因土水战克。支水干头有火遭，必腹病心懵；支火干头有水遇，则内障睛盲。炎上烦焦蒸土曜，头秃眼昏；润下纯湿无土制，肾虚耳闭；荧惑乘旺临离巽，中风失音；太白坚利合兑坤，兵前落魄。又云：心受病，口不能言；肝受病，目不能视；脾受病，口不能食；肺受病，鼻不能嗅；肾受病，耳不能听，各从所主，以证虚实。噫！人病百端，理无二焉，望问闻切，乃医家之妙用；生克制化，为术士之玄征，若能参究根源标本，不离斯法。论曰：康泰生于和合，疾病起于刑伤。究五行衰旺之理，推百病表里之详，内应五脏，外属四肢。且如木气休囚，两鬓消疏而不发；火临死绝，双瞳昏暗而无光；火中隐土少水制，则心神恍惚；木下藏金无水收，则腿足损伤。甲乙兑生逢壬癸，醉乡而死；丙丁坎育遇庚辛，沟港而亡。水盛木浮，多生泄痢；土重金埋，常病气高。诸风掉眩，乙木旺而辛金衰；疼痒疮疡，丁火盛而癸水弱；痞塞肿满，只因己土太过；愤郁病痿，盖为辛金不及。甲乙能伤戊已，无救而缺唇；丙丁善克庚辛，少制而喑哑。火中有土，项生瘰疬之灾；水中有土，腹患蛊肿之病。用神受制而被刑，亡于棒杖；上下逢鬼而无救，死作悬梁。四柱重冲多凶而他乡丧体，五行衰败不足而瘟疫亡身。水败腰驼，莫用轩岐之法；金刑龟背，安施卢扁之方。庚辛气秀，西方见木而亡于兵刃；甲乙败绝，坤南无水，而骨肉飞；辛巳、丙申遇刑，臂虚而人生六指；己卯、戊寅逢敌，胃弱而常病疮疽；乙未、甲午逢金，人多鳖头；癸卯、已丑相刑，病生腰膝；甲申、乙酉，幼年多病肝经；辛卯、庚寅，晚年劳伤筋骨。丙火上炎，丈夫每忌于身心；丁火下湿，女人虚痨而血产。日时衰败，大患难疗；干支刑害，小疾不疗。气相得而安和，气相逆而灾殄。病症不离于六脉，死生难越乎五行，细究兴衰，万不失一。古歌曰：戊己生时气不全，月时两处见伤官；必当头面有亏损，脓血之疮苦少年。又曰：丙丁日干五行衰，七煞加临三合来，升合日求衣食缺，耳聋残疾面尘埃。又：壬癸重重叠叠排，时辰设若见天财；纵然头面无癍癞，定主其人眼目灾。
