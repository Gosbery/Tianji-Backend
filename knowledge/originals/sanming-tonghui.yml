  - 第70章 论古人立印食官财名义
  sequence: 25
  text: 徐子平论格局，独以印、食、官、财四者为纲。其立名之义云何？盖造化流行天地间，不过阴阳五行而已。阴阳五行，交相为用，不过生克制化而已。今指甲乙为例，以日干论甲乙，在五行属木，甲阳而乙阴也。如人命得甲乙，生谓之日主属我，生我者壬癸水，我生者丙丁火，克我者庚辛金，我克者戊己土，而十干尽之矣。生我者，有父母之义，故立名印绶。印，荫也。绶，受也。譬父母有恩德荫庇子孙，子孙得受其福。朝廷设官分职，畀以印绶，使之掌管。官而无印，何所凭据？人无父母，何所怙恃？其理通一无二，故曰印绶。我生者，有子孙之义，故立名食神。食者，如虫之食物，盖伤之也。虫得食物则饱，人得食则益，被食则损造化。以子成而致养，即人子致养父母之道也。故曰食神。克我者，我受制于人之义，故立名官煞。官者，官也。煞者，害也。朝廷以官与人，以身属之公家，任其驱使，赴汤蹈火，不敢有违，至于盖棺而后已，是官害之也。凡人梦棺而得官，亦是此义，故曰官煞。我克者，是人受制于我之义，故立名妻财，如人成家立产，须得妻室内助，故曰妻财。是四者，术家立名之大义。然生近乎身，克隔乎位，造化喜生恶煞，乃自然之理也。中间阴阳从类，阴阳配合，各有至理存焉。生我，我生，如壬生甲、癸生乙，甲食丙、乙食丁，是阴生阴，阳生阳，阴食阴，阳食阳，为阴阳各从其类，故甲喜壬生死，木滋死水中则多年不坏；不喜癸生死，木被雨水淋漓不逾所则朽。甲喜食丙，以丙能制庚煞，而甲始得安其身；不喜食丁，以丁能伤官，而甲不得成其材。以其义也。克我、我克，如辛克甲，庚克乙，甲克己，乙克戊，是阴克阳，阳克阴，阴匹阳，阳匹阴，乃阴阳配合之理。故甲见辛为正官，见庚为偏官。官喜正，不喜偏，掌印佐贰，职有不同。甲见己为正妻，见戊为偏妻。妻贵正，不贵偏，敌体侍立，分则有别，此其理也。至若官怕伤，被伤则祸，财怕劫，被劫则分；印怕财，贪财则坏；食怕枭，逢枭则夺。其理与人事无二，学者明于人事，斯可以言造化矣。夫五行展转生克，皆子为父母复仇之义。故甲乙生丙丁为子，甲乙畏庚辛，赖丙丁克制之。丙丁生戊己为子，丙定畏壬癸，赖戊己克制之。戊己生庚辛为子，戊己畏甲乙，赖庚辛克制之。庚辛生壬癸为子，庚辛畏丙丁，赖壬癸克制之。壬癸生甲乙为子，壬癸畏戊己，赖甲乙克制之。
