  text: 庚申 庚辰 庚子 壬午，是天德月德俱在壬，印绶在辰是也。此格大要生旺，最忌死绝。如果乙见亥子为印，见金成其仁义生养，印元见土则混杂其格，运行西北，官印为福，若时引归卯辰巳地，或运行此地，财印归死绝，流年再遇财克印，决入黄泉无疑。印绶合格，行大运最忌印绶变合，遇地支三合，或变为伤局，或变成财局，或变成煞局，最为不吉。
