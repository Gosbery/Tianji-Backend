  text: 伤官格用财，亦有用印者。《天玄赋》云：伤官用印宜去财，用财宜去印，倘使财印两全，将何发福？身旺者用财，身弱者用印，用印者须去财方能发福，用财者不论印亦主亨通，伤官用印，不忌官煞，去财方发，元犯伤官，须要见财则发。伤官最喜行财运，印绶身旺次之，不喜行官乡，四柱伤官多而见官者，不宜复行伤运，一位无妨。又曰：伤官格务要伤尽，若柱见伤官，而官星隐显，伤之不尽，岁运再见官星，官来乘旺，再见刑冲破害，刃煞克身，身弱财旺，必主徒流死亡，五行有救，亦残疾。若四柱无官而遇伤煞重者，运入官乡，岁君又遇，若不目疾，必主灾破。
