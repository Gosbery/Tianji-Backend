- id: sanming-tonghui-ch152-p004
  volume: 选章正文
  chapter_path:
  - 第152章 论食神
  sequence: 63
  text: 《壶中子》云：犯倒食，在命多被人挠，重叠带者，在幼儿则言乏乳，在老人则言缺食。正食而有余者富贵，争食而不足者贫贱，有余如甲人得两丙三丙，不足如柱中两甲止有一丙之类。又曰：日主时干重叠相食者，曰吞啖脑子，时日俱食，主头风脑漏，早克母死，后无子送终，若吞中逢吞，如甲人逢壬日时，又逢庚字，主贫死沟壑，有干合解则缓。《相心赋》云：食神最能饮食，体厚而好讴歌。《奥旨篇》云：月令值食，身健旺，善饮食，姿质丰肥，四柱有吉曜相扶，堆金积玉，声名显着。《幽微赋》云：食神旺相，老寿弥高。《元理赋》云：食居先，煞居后，功名显达。《宝鉴赋》云：月露食神时露官，荣显乌台助国臣。《万祺赋》云：食神名为吉曜制煞，号称寿星，干强日旺，富贵之士，食旺身衰，蹭蹬之人，逢财旺则食前方丈，遇印绶则甑底生尘，见一位者锺铭鼎鼐，二三者陋巷簟瓢，羊刃重临，平生劳碌，刑克相会，一世奔波。
