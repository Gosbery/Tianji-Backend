  sequence: 88
  text: 或问：阴阳何所配合为夫妇而成六亲？答云：如甲以乙为妹，配以庚金为妻；丙以丁为妹，配以壬水为妻；戊以己配甲；庚以辛配丙；壬以癸配戊，一阴一阳配成夫妇，有夫妇然后有父子，有父子然后有兄弟。六亲者，父母兄弟妻子也。六甲娶己为妻，甲己合而生庚辛为子。男取克干为子，女取干生为息，则己者庚辛之母，庚为父，乙为母，故谓阴干生我为母，我克阳干者为父，克我者为官为子，我克者为财为妻，比和者为兄弟姊妹，生我妻阴干为文母，妻克阳干为丈人，克我女者为女婿，食神为孙，其余六亲俱于十干变化取用。
