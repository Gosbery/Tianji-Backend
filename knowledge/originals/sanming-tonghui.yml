  text: 古歌云：伤官原是产业神，伤尽真为大贵人，若是伤官伤不尽，官来乘旺祸非轻。又：月令逢官在伤乡，伤轻减力尚无妨，若见刑冲并破害，定知为官不久长。又：伤官伤尽复生财，财旺生官互换来，四柱若无官显露，便言富贵莫疑猜。又：伤官遇者本非宜，财有官无是福基，时日月伤官格局，运行财旺贵无疑。又：伤官伤尽始为奇，又恐伤多反不宜，此格局中千变化，详推须要用心机。又：伤官无官最忌剥，运入官乡反见奇，岁运命中逢印绶，诚为富贵定无疑。又：伤官不忌比肩逢，七煞偏官理亦同，若是无官当忌比，如逢身旺却嫌重。又：伤官不尽又逢官，斩绞徒流祸百端，月犯父子无全美，日犯自己主伤残；时伤子息多狼狈，须知富贵不周全，若是伤官居太岁，必招横祸逢斯年。合诸说观之，伤官喜忌尽矣。
