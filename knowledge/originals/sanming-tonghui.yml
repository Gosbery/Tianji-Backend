  text: 经云：五行伤官，惟火人土伤官，土人金伤官忌见官星，若金人水，水人木，木人火，不忌。盖火以水为官，以土为伤，水畏土克，土得水无益；土以木为官，以金为伤，木畏金克，金得木无益，所以火土伤官格忌见官星。金以水为伤，以火为官，水虽克火，若金寒水冷，不得火温，难以济物，况水得火成既济之功；水以木为伤，以土为官，木虽克土，若水泛木浮，不得土止，难以存活，况木得土成栽培之力；木以火为伤，以金为官，火虽克金，若木繁火息，不得金削脱，难以通明，况金得火成器物之象，所以金水木伤官格不忌官星。故经云：“伤官火土宜伤尽，金水伤官要见官，木火见官官要旺，土金官去反成官，惟有水木伤官格，财官两见始为欢”是也。又曰：伤官伤尽，亦有不作福者，伤官见官，亦有不作祸者。如一命
