- id: sanming-tonghui-ch182-p005
  volume: 选章正文
  chapter_path:
  - 第182章 论六亲
  sequence: 92
  text: 又曰：凡推六亲，男命以年为父，胎为母，月为兄弟，官员以月为僚友，日为己身妻妾，时为子孙，官员以时为帝座祸福。凡是子午卯酉日生，主娶子午卯酉命妻，若妻申子辰生、丑生、甲己生者，皆不永。如克过头，妻再醮，不在此限。凡命四柱内有我克者为妻，无我克者，名曰局中无妻，却看所生日在何地？如在财旺之乡，当有得力之妻。更带贵人禄马，年主妻带官嫁夫。若在本命时财死墓绝败处，定主克陷，或一生鳏居。若日禄在时上遇见，如六丙日得癸巳时，六壬日得辛亥时之类，名曰誉煞，不惟主富，亦主因妻有官。若日带年之官，或年之印，主妻夺夫权，或禄出妻荫，或妻权贵之家，驸马郡马之类。日坐命财，更在财生旺之乡，主得妻财，又主妻贤明。日坐贵人，主妻有望族，或贤淑美丽。若命带日刑，日带年冲破年、羊刃、劫煞、六厄、元辰、空亡，或三四娶，或无妻。
