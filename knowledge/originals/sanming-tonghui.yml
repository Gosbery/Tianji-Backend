  sequence: 62
  text: 食神者，十干福禄之会，君子得之显达丰赡，小人得之周旋给足，在福聚之地则官崇禄厚，在祸聚之地则职卑命薄。如以甲子论，食丙子为福星之贵，食丙寅为长生之禄，又为禄马同乡，食神学堂之贵，丙辰为正印，丙午为自刑破命，丙申为克身破禄，丙戌为身衰破空亡，余干例推。若遇生旺、库、印、天乙、天官、华盖、文星、学堂、官印禄马之类，为福聚之地，遇克破、空亡、恶煞、刑害、休、败、死、绝，为祸聚之地。又曰：甲乙食丙丁，加寅卯巳午之上；丙丁食戊己，加辰戌丑未之上；戊己食庚辛，加巳午申酉之上；庚辛食壬癸，加申酉亥子之上；壬癸食甲乙，加亥子寅卯之上，谓之食神见生旺，更带禄马旺相，文为两制两省，武为建节防团，无，亦主财帛丰厚，食神与禄全见，四柱顺当为妙。
