  text: 凡行运，在干兼用地支之神，在支则弃天干之物。盖大运重地支，故有行东方、南方、西方、北方之辨损。用神者欲运制之益，用神者欲运生之身。弱欲运引进旺乡；官欲运生，不欲运伤；煞欲运制，不欲运助。财欲运扶，不欲运劫；印欲运旺，不欲运衰；食欲运生，不欲运枭绝。更看四柱强弱何如，原有原无，原轻原重。如木人用金为官，阳男运出未入申，阴男运出亥人戌；金人用木为财，阳男出丑入寅，阴男出已入辰，俱向禄临马。原有官，行官运发官；原有财，行财运发财；原有灾，行灾运发灾。更看当生年时得气浑浅，四柱得气深，迎运便发，得气浅，须交过运始发，得其中气，运至中则发。
