  sequence: 26
  text: 地支十二，其理亦同，虽动静不同，方圆有异，而生克一也。试言之：北方亥子水，生东方寅卯木，东方寅卯木，生南方巳午火，土寄旺于火，生西方申酉金，西方申酉金，生北方亥子水。然亥子间丑一位而后接寅卯，寅卯间辰一位而后接巳午，巳午间未一位而后接申酉，申酉间戌一位而后接亥子。土立四维，五行均赖。故巳酉合丑为金局，申子合辰为水局，亥卯合未为木局，寅午合戌为火局。金生水，水生木，木生火，火生土，土生金，相生而无间也。丑为金库，生亥子而克寅卯；辰为水库，生寅卯而克巳午；未为木库，生巳午而受金克；戌为火库，克申酉而受水制。东南主生，西北主杀，此天地之大机也。且辰戌丑未，奠安四维，金木水火，咸赖之以生藏。《易》曰：“成言乎艮，终言乎坤。”此土之功用在五行为尤大也。
