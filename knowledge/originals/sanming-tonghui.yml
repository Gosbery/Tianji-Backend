  sequence: 65
  text: 夫贵贱观乎八字，性情应乎五行。善、恶、仁、义、礼、智、信，心之所主；喜、怒、哀、乐、爱、恶、欲，性之所生。东方震位木，号青龙，名曰曲直，五常主仁。其色青，其味酸，其性直，其情和。旺相主有博爱恻隐之心，慈祥恺悌之意；济物利人，恤孤念寡，直朴清高，行藏慷慨；丰姿秀丽，骨格修长，手足纤腻，口尖发美，面色青白，语句轩昂，此则木盛多仁之义。休囚主瘦长发少，拗性偏心，嫉妒不仁，此则木衰情寡之义也。死绝则眉眼不正，悭吝鄙啬，肌肉干燥，项长喉结，行坐不稳，身多欹侧。遇火色带赤，见土则色带黄，逢金则色带白，见水则色带黑。其余四行例见。
