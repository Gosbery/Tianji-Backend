  - 第182章 论六亲
  sequence: 91
  text: 赋云：年逢刃煞，幼年早丧爹娘；时遇刃伤，未年却损儿女。冲者无兄弟，刑者损六亲。岁月官财印全，三代祖先富贵；日时煞刃逢枭，半路妻儿亏损。男命伤官多损子，女命伤官多克夫；伤官见财而有子，七煞有制乃多儿。财重刑伤父母，鬼旺后代迂荣；劫财重重父早丧，破印太重母先亡。岁月财官旺相，公父显荣；日时禄马相生，妻儿贤俊。印伏藏而财秉令，庶出奸生；正财旺而身失时，母年早丧。偏官偏印偏财叠逢，必然偏庶；正官正印正财独遇的，是正宗男。月中劫背绝财官，父终外土；岁月背逐更冲害，公葬他乡。日逢刃，时逢枭，妻妾产亡；岁值煞，月值伤，兄弟难有。月令伤官多夺长，时行神煞兄弟无。男命劫叠外家希，女命煞重亲骨绝。印旺妨儿女，财重妒公姑。岁月叠煞有刑害，公姑遭伤；日时背逐无救助，妻子离克。正财偏财复见合，虽多妻妾主滥淫；偏官正官更冲害，任有丈夫而偷奸。旺夫伤子，乃食神而受伤；旺子伤夫，察官星而丧绝。女命印旺官轻，夫权在手；男命财多身弱，妻语惬心。日下伤官持刃，夫必恶亡；月中带印刑冲，母家零落。刃健煞刚，祖墓微薄；官强财旺，后代昌荣，日逢背禄逐马，多破祖离乡之客；时遇财旺生官，有兴家助国之男。煞刃月逢，有父无母。偏官叠见，多生女子少生男；偏财复逢，少爱正妻多爱妾。财源得地，因妻致富成家，其妻抑且有为；官位临垣，显己增崇祖业，而男亦须兴旺，月官印，年伤官，父优祖劣；日财位，时劫财，父兴子败。比劫重婚必迟，官星生儿必早。男逢伤官阳刃，逢官煞，不可断其无嗣；女命伤官枭印，行财官，亦堪决其有子女。人食重遇，官轻夫衰子旺。男命煞旺逢比劫，兄有弟无；太过不及，兄弟俱无。库位中和同气，主有煞生旺官败绝，女子盛而男子衰。财官旺身，主休夫家兴而祖家失。女比劫太多，夫有绝妻之义；男子财胜劫重，妻怀私欲之心。年月印绶相生，受现成之基业；日时伤官伤尽，发不义之横财。年上官星，父祖为官；月上官星，兄弟必贵。男逢比劫定伤妻，女入印枭难嗣子。羊刃逢伤官七煞，骨肉亲友伤情；三合六合相和，友善五湖四海。
