  text: 晦气者，乃不明之象，昏昧之道也，即甲已乙庚之例，以合则晦也，日干与时干不宜与太岁元天元合，合则名为晦气。又要分日干合太岁，如甲日已年之例，太岁合日干，如已日甲年之例。甲合已灾重，已合甲灾轻，岁位近者灾重，远者灾轻，如岁在日前五辰而遇合，谓之太岁入宅，晦气临门，主灾厄。
