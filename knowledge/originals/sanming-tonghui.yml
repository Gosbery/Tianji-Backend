  sequence: 79
  text: 又曰：人之生也，受气于父，成形于母。五脏和平者无疾，战克太过不及者主疾。《内经》云：东方实西方虚，泻南方补北方。东方实者，木太过也；西方虚者，金不及也；泻南方者，火太过也；补北方者，水不及也。是以五行太过不及，皆主疾也。若水升而火降，火降而金清，金清而木平，木平而土不及克，五脏各得中和之气，疾病何自生焉？《阴阳书》：金刚火强，自刑其方，木落归本，水流趋东。所以论三刑，刑则残害，言太过而身疾也。若只取不及为疾，必有一偏之失。凡五行有死绝而成疾者：水死绝，多肾气腰足攻注，滑泄便溺不利之疾；火死绝，主肠气结塞、惊悸健忘，精神不安之疾；木死绝虚风目涩眩晕，筋急、爪甲桔悴、喜怒颠倒，择饮择食之疾；金死绝，主气虚喘急、咳嗽、皮毛焦燥干啬、骨节疼痛、涕泪、大肠泄痢、便血之疾；土死绝，主面黄、减食、隔噻吐逆、肢体怠惰、喜卧嗜睡、多思足虑、耳聋、神浊健忘、少喜动作之疾。
