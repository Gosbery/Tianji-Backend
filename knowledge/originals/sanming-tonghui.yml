  - 第28章 论太岁
  sequence: 4
  text: 夫太岁者，乃一岁之主宰，诸神之领袖。其说有二：如四柱中生年曰当生太岁，如逐年轮转曰游行太岁。当生太岁乃终身之主，其理已论于前；其逐年太岁游行十二宫，定一年之祸福，为四时之吉凶。盖太岁如君也，大运如臣也。如君臣和悦，其年则吉；若值刑战，其年则凶。经运：岁伤日干，有祸必轻；日犯岁君，灾殃必重。此又分言：岁君伤日者，如庚年克甲日为偏官，譬君治臣，父治子，虽有灾晦，不为大害，何则？上治其下，顺也，其情尚未尽绝；日犯岁君，如甲日克戊年为偏财，譬臣其君，子其父，深为不利，何则？下凌上，逆也，其凶决不能免。若五行有救，四柱有情，如甲日克戊年，四柱原有庚申金，或大运中，亦有将甲木制伏纯粹。不能克戊土为有救；如大运并四柱有一癸字与戊相合为有情。经云：壬以癸妹配戊，凶为吉兆。
