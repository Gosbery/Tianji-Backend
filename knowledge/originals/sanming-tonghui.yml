  sequence: 13
  text: 正印，乃五行之正库，金命见乙丑，木癸未，火甲戌，水土壬辰、丙辰是也。《言谈》云：“生逢正印，必拜玉堂。”《妙选》云：“五行入垣，官居五府。”可见得本家正印为贵。本主同德为上，帝座为中，胎月为下。主人重厚魁梧，功名昭着。本家印又得贵格扶之，更妙。若木得水印，火得木印，多兼他权外财。若身克印，或印克身，废而复兴。若水人得火印，火人带水印，次于本家印，然须本主有旺气，方吉。若克破别无福救，或空亡，只作清闲道僧、无成举人。若五行有清气，则绝世高人；有煞则贫贱。
