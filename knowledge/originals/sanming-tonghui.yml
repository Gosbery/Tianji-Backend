  text: 有相生而生疾者：火木相生，生旺则上盛隔壅，目赤头风；死绝则伤寒作狂、闷乱疾。火土相生，生旺则胃实；死绝则唇焦红气、热结大便不利。金水是相生，生旺则气滞，死绝则晴滑；水木相生，生旺则呕吐胃虚；死绝则精败、伤寒粘疟。金土相生，生旺则多虚无肌肉死绝肠鸣茧作。
