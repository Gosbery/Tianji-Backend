- id: sanming-tonghui-ch026-p001
  volume: 选章正文
  chapter_path:
  - 第26章 论大运
  sequence: 1
  text: 夫运者，人生之传舍。探命之说先以三元、四柱、五行、生死、格局致合以定根基，然后考究运气，协而从之以定平生之吉凶也。古人以大运则一辰十岁，折除以三日为年者何？盖一月之终，晦朔周而有三十日，一日之终，昼夜周而有十二时；总十年之运气，凡三日有三十六时，乃见三百六十日为一岁之数；在一月之中有三百六十时，折除节气，算计三千六百日为一辰之十岁也。天论折除之法必用生者日历。过日时数，其节气之数。阳男阴女，大运以生日后未来节气日时为数，顺而行之；阴男阳女，大运以生日前过去节气日时为数，逆而行之。假如甲子阳男十二月二十四日已时生，是月也二十九日申时立春，阳男数以未来之日，自二十四日已时至二十五日已时方是一日之实数，至二十九日申时正得五日三时之节气，实历过六十三日折除，过六十三时折除，计六百三十日，乃一岁奇九月之大运；起于丁丑，必自十二月生日后，实经历过二十有一之日，月运方移宫，是越三岁九月之内，方是甲子十二月生，行一岁奇九月之大运也。
