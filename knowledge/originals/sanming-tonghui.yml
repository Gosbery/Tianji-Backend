  - 第139章 论偏财
  sequence: 32
  text: 何谓偏财？乃甲见戊、乙见己之例。非妻所带，乃众人之财也。切忌有姊妹兄弟分夺，柱无官星，祸患百出。经曰：偏财好出，亦不惧藏，唯怕分夺，及落空亡，有一于此，官将不成，财将不住。如财弱必待历旺乡而荣，财盛无往不利，但恐身势无力，不能胜任。偏财格，主人慷慨，不甚吝财，与人有情而多诈，若是得地，不止财丰，亦能旺官，以财盛自生官，运行旺相，福禄俱臻，一遇官乡，便可发福。柱中原带官星，便作好命看，若兄弟辈出，纵入官乡，发福必渺。偏财月令所带最重，不宜柱中多逢。年上偏财生旺，月令柱中通气，主受伯叔祖考产业丰隆，或外祖产业恩养。大要日主兴隆，财星生旺，运向财旺之乡发福。若见刑冲破害，比劫分夺，或财星太衰，日主太弱，或财多生煞，皆破祖劳碌之命。凡月令有财，主少年富贵，若生时不得地，或有劫败，更运临凶地，晚年祖财破尽，终身困穷，先富后贫。若年月本无，日时带财，别无劫败冲克，则主自家成立，中晚之年大发。若柱中财多身弱，少年又径休败之地，多事频并，百不如意，中密年后忽临父母之地，或三合可以助我，则勃然而兴。若少年乘旺，老来脱局，不唯守穷途而ゐ惶，抑且是非蜂起，以财能利己，亦能招谤故也。若四柱相生，别带贵格，不值空亡，又行旺运，三合财星，皆是贵命，其福禄浅深，随格轻重言之。又曰：凡人命有两位财，身弱不妨，元用正财，身旺发财，元用偏财，身旺脱财。又云：偏正二财，喜忌大同，唯有喜官星不喜官星小异，有正财不若有偏财，偏财重实，其福则厚，最怕劫败比肩，在年最重，在月稍次，一名孤辰，一名逐马，主克妻害子，破财贫薄，又防阴贼小人同类相伤，柱中元犯此忌，运行财旺之地，亦可发福，再行比劫，退败而身死者有之，遭官破败者有之。《通明赋》云：月上偏财，无劫无败，富甲人间。《相心赋》云：偏财透露，轻财好义，爱人趋奉，好说是非，嗜酒贪花，亦系如此。《惊神赋》云：偏财身旺，趁求商贾之人。《奥旨》云：偏财能益寿延年。《千里马》云：出现偏财，少爱正妻，多爱妾。古歌曰：偏财元是众人财，最忌干支兄弟来，身强财旺皆为福，若带官星更妙哉！又：偏财身旺要官星，运入乡发利名，姊妹弟兄分夺去，功名不遂祸随生。又；偏财财位发他乡，慷慨风流性要强，别立家园三两处，因名因利自家忙。
