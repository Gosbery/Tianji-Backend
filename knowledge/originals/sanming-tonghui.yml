  sequence: 69
  text: 水属北方，名曰润下，五常主智，其色黑，其味咸，其性聪明，其情良善。旺相则机关深远，足智多谋，学识过人，诡诈无极；面黑光彩，语言清和。太过则是非好动，飘荡贪淫。不及则人物矮小，行事反复，情性不常，胆小无略。此虽五行之喻，实与人事相干。以上五行、情性参以命中所遇吉凶神煞断之，大抵生旺者主长大，死绝者主矮小。若有煞临，不在此限，又从煞上断。若有克，则从所克之五行断，又概取日时，上纳音，看有克无克，并神煞所临有气无气，断其形状、性情，无有不验。
