  text: 补曰：假令甲生午日，午中己土，为甲木之正财，而丁火生之。乙生巳月，巳中戊土，为甲木之正财，而丙火生之，是谓身强，正财有气者最喜也。甲生木之正财，而丙火生之，是谓身强，正财有气者最喜也。甲生午月，丙酉月，戊生子月，庚生卯月，壬生午月，阴支之阳干之正财也。乙生巳月，丁生申月，己生亥辛生寅月，癸生巳月，取阳支为阴干之正财也。如身居休囚死败，天元赢弱，柱中支干重重，三合财多，非徒无益，则反生杀生灾，所谓只怕日干元自弱，财多生杀赶身衰是也。如身居临官地旺，或注中生扶，而财三合太旺，则富贵利名，声显者，所谓财多身量，则我黍意是也。愁官鬼，盖官鬼乃盗财之气，克我之身，本为可虑，正财多盗气，本身自柔之谓也。怕空亡，乃六甲空亡，甲子旬中以戌空亡之类。财落空亡，必贫窘不聚财为可畏。空亡为害最悉人，堆金积主也须贫之衰也。印绶相生荣贵昌，盖言财多身弱，或带官鬼，有印绶相生，自然富贵荣昌，盖言财多身弱，或带官鬼，有印绶相生，自然富贵荣昌。《独步》云：“先财后印，反成其福。”《通明赋》云：“财逢印助，相如乘驷马之车。”此之谓也。休囚泊年二句，盖言四柱既然财多身弱，而年轻休囚之地，亦不如意，不惟不发福，亦且祸患百出。或(未)
