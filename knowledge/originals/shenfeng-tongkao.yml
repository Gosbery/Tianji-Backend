  text: 何以为之病？原八字中原所害之神也；何以为之药？如八字原有所害之字，而得一字以去之谓了，如朱子所谓各因其病而药之也。故书云：“有病方为贵，无伤不是奇；格中如去病，财禄两相随。”命书万卷，则四句为之括要。
