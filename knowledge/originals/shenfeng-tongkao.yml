  sequence: 433
  text: 丁巳日生于四阳之月，炎气方炽，再加卯未结成木避以生之，则火气愈炎。其精好泄，喜年干透己未之土，则火见土而泄真焉，秀气则在土矣。但戊己土到卯月极衰，而又有乙卯结局之木，以破其土，则土为用神，畏木为克土之病也。所以土少木多，其病甚重。早行戊午己未，土衰亦宜行土运。一入庚申辛苦酉，上下皆金，克木净尽，去尽病根，位入台阁。入亥木气得生，病神复作方死。世术或以杀印论，或以拱禄格论，俱无一毫应验。
  normalized_text: 丁巳日生于四阳之月，炎气方炽，再加卯未结成木避以生之，则火气愈炎。其精好泄，喜年干透己未之土，则火见土而泄真焉，秀气则在土矣。但戊己土到卯月极衰，而又有乙卯结局之木，以破其土，则土为用神，畏木为克土之病也。所以土少木多，其病甚重。早行戊午己未，土衰亦宜行土运。一入庚申辛苦酉，上下皆金，克木净尽，去尽病根，位入台阁。入亥木气得生，病神复作方死。世术或以杀印论，或以拱禄格论，俱无一毫应验。
