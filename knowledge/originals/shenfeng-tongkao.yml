  text: 己土虽生巳月，本为火生之域。夫何金气重重？己土见金泄其精气，赖有三重火气，大抵土好暖而畏寒，则己土亲火为印绶。运行己卯戊寅，杀星太旺，故曰印轻者赖官杀以生之，所以位至方伯。西内运火轻，犹宜补起火来。大运入子见财而破印，财乃妻也，因妻而致祸也。盖原无水止有火土，则东方水运不美，此则土虚而好火，畏水伤火，子运死也明矣。
