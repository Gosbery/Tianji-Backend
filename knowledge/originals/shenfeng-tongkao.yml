  - 第55章 论太岁
  sequence: 645
  text: 太岁，乃天中天子，甚不可犯之，若犯之则凶，云日犯岁君，灾殃必重，五行有救，其年反必为财，如甲日见戊土太岁是也。克重者死，甲乙生寅卯亥未日时，犯克岁君，决死无疑。有救则吉。大抵太岁不可伤之，犯岁者其年必主凶丧，是下犯上之意。如以勾绞、死亡、咸池、宅墓、病符、死符、白虎、羊刃诸杀推之，干不克岁，尤防运克岁，亦如此不利，倘有贵人禄马化之则吉也。
