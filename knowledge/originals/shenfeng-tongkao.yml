  text: 庚子日生寅月，年月丁壬作化，生火助杀，用杀明矣。木命三阳之火尚衰，金水寒威犹在，壬癸水透天干，制伏太过，病在此矣。犹喜羊刃存时，丑酉合金得局，身主不弱，又得乙庚存时，化金成旺，早行子丑，丙火气寒，杀衰不能为我运动，故多蹇满。渐行己亥，甲木财神得生，财来生杀，隐隐兴隆。一人戊戌，原壬水为丙火之病神，一见戊土，克去壬水净尽，如鸿毛之遇风，飘然而举。如枯苗之得雨，勃然而兴，财发成缗，书林出色，岂偶然哉！大运入酉，丙火杀神死地，更且财来生水，水来灭杀，法尽无民，其死也非偶然也。
