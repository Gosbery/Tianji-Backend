  text: 又曰：年看祖宗兴废事，月推父母定留存。然年属祖宗之宫临财官之地，乃坐禄马之乡，荣显理然也。但坐比肩劫财，无财官之地。乃坐禄马之乡，荣显理然也。但从比肩又当与罗土之祖宗，月上兄弟两宫相寓而参看焉。若岁月无财官，俱主根基浅薄，白手成家，独月令官杀司权，俱主损伤兄弟。虽有兄弟，多主阋墙，何也？比肩乃兄弟之寿星，见官杀面克之，安得不损兄弟乎？
