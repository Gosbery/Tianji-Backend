  sequence: 138
  text: 旧注云：“此七杀即偏官也。”且如甲忌庚为七杀，而甲生于寅地，乃身旺。其中暗包丙长生，则不畏金为杀，而镣化为偏断，则甲庚各自恃旺之势，而行纯杀之运，乃为极品之贵，此说似牵强。盖身杀或强，而或制伏得官，固多权贵者，使柱中杀旺身强无制，又行纯杀无制之运。乃为极品之贵，恐不可从。或者又解为身旺杀旺，身杀居长生临官帝旺之乡，乃通月气者是也。运纯谓中和之道，制杀化杀之运是也。清贵者，清高而贵显，绣衣黄门是也。盖四柱四七杀日生俱旺，无食神制杀，运入制伏之地，则为清高而贵显也。此说可从。
  normalized_text: 旧注云：“此七杀即偏官也。”且如甲忌庚为七杀，而甲生于寅地，乃身旺。其中暗包丙长生，则不畏金为杀，而镣化为偏断，则甲庚各自恃旺之势，而行纯杀之运，乃为极品之贵，此说似牵强。盖身杀或强，而或制伏得官，固多权贵者，使柱中杀旺身强无制，又行纯杀无制之运。乃为极品之贵，恐不可从。或者又解为身旺杀旺，身杀居长生临官帝旺之乡，乃通月气者是也。运纯谓中和之道，制杀化杀之运是也。清贵者，清高而贵显，绣衣黄门是也。盖四柱四七杀日生俱旺，无食神制杀，运入制伏之地，则为清高而贵显也。此说可从。
