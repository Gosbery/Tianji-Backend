- id: shenfeng-tongkao-ch017-p120
  volume: 选章正文
  chapter_path:
  - 第17章 伤官食神格
  sequence: 501
  text: 丙行日主，结成火局，其火旺矣。原寅中有戊土，午中有己土，又时上透出己土，其丙火身旺，见此土而好泄其精也。正谓有病方为贵格。脱辛逢癸酉流年，克去甲木病神，所以早擢秋闱，甲戌年入亥运，原有甲木，得生于亥，正谓破伤官损寿元而死矣。盖正月戊己，带木之寺也，而土神极衰，最畏旺木克之，入亥运甲木得生，其死也明矣，若天假之年，若行庚戌运，庚金克去甲木贵不可言也。凡日干旺者，见有食神伤官。虽在日时，亦只作伤官看，何也？凡日干旺，精气满畜，见有通泄血气之处，则秀气从之，不可泥执子平，只以月令上用神。如日主衰弱见印星及阳刃，身弱则亲印绶阳刃也，身旺则自亲食神伤官也。如用食神伤官，只要食伤类聚一处有情，不宜间隔，如前夏衣胜命用木类是也。如此造，多不晓作用土，只以官印。若用官印，如卯亥运不顽强也。此则用衰土，见木克之明矣。
  normalized_text: 丙行日主，结成火局，其火旺矣。原寅中有戊土，午中有己土，又时上透出己土，其丙火身旺，见此土而好泄其精也。正谓有病方为贵格。脱辛逢癸酉流年，克去甲木病神，所以早擢秋闱，甲戌年入亥运，原有甲木，得生于亥，正谓破伤官损寿元而死矣。盖正月戊己，带木之寺也，而土神极衰，最畏旺木克之，入亥运甲木得生，其死也明矣，若天假之年，若行庚戌运，庚金克去甲木贵不可言也。凡日干旺者，见有食神伤官。虽在日时，亦只作伤官看，何也？凡日干旺，精气满畜，见有通泄血气之处，则秀气从之，不可泥执子平，只以月令上用神。如日主衰弱见印星及阳刃，身弱则亲印绶阳刃也，身旺则自亲食神伤官也。如用食神伤官，只要食伤类聚一处有情，不宜间隔，如前夏衣胜命用木类是也。如此造，多不晓作用土，只以官印。若用官印，如卯亥运不顽强也。此则用衰土，见木克之明矣。
