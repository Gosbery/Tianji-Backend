  text: 补曰：辰有乙戊癸，乃水土之墓库，为春季；戌中有辛戊丁，乃火之墓库，为秋季；丑中有癸巳辛，乃金之墓库，为冬季；未中有丁己乙，乃为木之墓库，为夏季。此四季中，所藏印绶财官，皆天地不正之气，故曰居杂气。须看格中透出，何字为福。大概杂气格，透出贵气固为妙，亦以财多为尊贵，所谓无官见财，亦能生官，多为及第之命是巳。
