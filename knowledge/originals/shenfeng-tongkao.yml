  sequence: 481
  text: 甲木得生於亥，辰年木气托根，甲木寅时得禄。四柱木俱得气，又有壬水滋之，甲木则变弱成强，望见时上丙火，精光透也贴身，则甲木情思向丙火为用神也。则以壬火为破丙之病，辛金为破格之病，早行壬子癸丑，甚是平常，破坏丙火用神。望见东南，有木有火，有土克水，有火克金，病神净尽，一发轰天，至庚申金水破格而死也。
  normalized_text: 甲木得生於亥，辰年木气托根，甲木寅时得禄。四柱木俱得气，又有壬水滋之，甲木则变弱成强，望见时上丙火，精光透也贴身，则甲木情思向丙火为用神也。则以壬火为破丙之病，辛金为破格之病，早行壬子癸丑，甚是平常，破坏丙火用神。望见东南，有木有火，有土克水，有火克金，病神净尽，一发轰天，至庚申金水破格而死也。
