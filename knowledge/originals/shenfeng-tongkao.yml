  sequence: 409
  text: 乙木生临戌月，本金刚而木柔也。若以旺弱而推，人命行南方，似泄气矣。盖旺弱命，乃愚术不精妙理。大抵当以有病而论，十月九验。故八字有病者，窒行去病之运。人多富贵，此造顶喜戌中有一点火星，透出天干，再喜戌午合成火局，作木火假伤官看，喜月上有一点庚金为官星，为我之病神也。何以言之？盖伤官以官星为病。书云：“有病方为贵”，早年己酉戊申，病神得禄，推其不美。一人南方丙午丁未，去庚金病神，所谓作品中如去病，财禄两相随，兴家创业，则富宜矣。乙甲运中，虽不及丙丁炎，去庚金为亲切，盖亦喜甲乙以生丙丁也。所以老益精神，只畏壬运来破火，放起庚字，恐生不得禄。但子星不足者，盖因日主气火中和也。若以杂气财官论之，全非妙理也。
