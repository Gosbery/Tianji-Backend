  sequence: 16
  text: 楠曰:正官者，何以言之？盖以阳见阴，阴见阳，故曰一阴一阳之谓道，如人之一夫一妇之有配对也。何以谓之官？盖官者答也。如人焉，必须官管，然后循规蹈矩，居仁由义，不敢放逸为非，故为制我身主之宫也。然月令提纲之官，若我之本府太守本县之令尹也。但当服其管，则岂能用之。故凡月上官星，世无用官之理，如此将如取用？但或止有官星一点，日主又旺，则官星轻而日主弱，运行官旺最为奇。譬如府县官，是我之主也。今主人弱也。当以财生之，行官运以助之。若行印运，则又泄弱官星之气。若官星犯重，日主根弱，克制日干太重，则不曰官星，而曰七杀也。七杀克身，则伤官食神，以制其官杀也。大抵用月上官星，要官旺，官旺方好取用。要官星有病，各因病而药之，官旺官多，喜食神以制去之，官星气弱，喜财神以生之，官旺之运以助之。若日干官星二者，纯和无病，俱是平常人也。若岁日时上虚官，用之十有九贵。然官为扶身之本，夫人非官，则放于礼法之外，故官星不宜破损，而亦不可用也。惟官星太弱太旺，方为有病，因其病而药之，斯可作为用神而论祸福也。
