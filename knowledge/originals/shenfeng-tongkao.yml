  sequence: 140
  text: 旧注解曰：“伤官本禄七杀，则财本马之七乡，偏官本身之七杀，四柱有之，身旺建禄不为富矣。”此诚确论可从。盖建禄身旺之人，喜见财官，所谓一见财官，自然成福是巳。忌见七杀反伤，所谓切忌会杀为凶是己。若柱中有伤官，则官禄之七杀彰矣。有败财，则财马之七杀彰矣。有七杀偏官，则身之七间彰矣。此所以为全彰，虽见禄身旺，贫不自聊者，故曰：“身旺极贫。”或曰此乃纯杀格怕身弱也。盖言人命四柱中七杀之神全彰著，又身弱者，乃极贫穷夭寿之人也，乃又为身弱极贫下中农寿。噫！以此解杀重身轻终身有损可也，以此解非夭即贫定是身衰遇鬼可也，解此节则凿之甚矣。
  normalized_text: 旧注解曰：“伤官本禄七杀，则财本马之七乡，偏官本身之七杀，四柱有之，身旺建禄不为富矣。”此诚确论可从。盖建禄身旺之人，喜见财官，所谓一见财官，自然成福是巳。忌见七杀反伤，所谓切忌会杀为凶是己。若柱中有伤官，则官禄之七杀彰矣。有败财，则财马之七杀彰矣。有七杀偏官，则身之七间彰矣。此所以为全彰，虽见禄身旺，贫不自聊者，故曰：“身旺极贫。”或曰此乃纯杀格怕身弱也。盖言人命四柱中七杀之神全彰著，又身弱者，乃极贫穷夭寿之人也，乃又为身弱极贫下中农寿。噫！以此解杀重身轻终身有损可也，以此解非夭即贫定是身衰遇鬼可也，解此节则凿之甚矣。
