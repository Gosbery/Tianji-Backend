  sequence: 328
  text: 虽不是丙火夏生金叠叠，富有千钟，凡丙丁旺见金者，但可以此理论之，独有丙丁见金，为天地之真财，日干者，十有九富。此造喜年时丙火得生，又有乙木贴身，则为身旺。且二阳进气，又喜庚金透出，财神明白，岂不富巳午未月，火返嫌弱，喜火旺，子丑亥月旺也。此则正理之外见也。甲乙生寅卯辰，丙丁生巳午未，庚辛生申酉戌，壬癸生亥子丑，俱要身旺。略喜一二点克神，克多者多贫夭，此理外之见，试之屡中。
