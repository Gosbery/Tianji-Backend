  text: 壬子日干，生临亥十一月，天干又有庚辛，贴助身强。壬水贵精，秀气从何而泄？盖喜寅亥两木，望一陌而生，两木类聚有情。壬水见木，而泄其真精，秀气分明在木矣。木衰为病，又有瘐辛浮金，遥欲克木，但庚辛运金，亦不能克地支这静木也。一入东方寅卯辰乙之支，衰木得此，殆犹枯木之逢春也，则富贵不丰且厚乎。运入巳中，有庚金损木，推其不利，入午未辰地，午中巳土，又且损刃，则死之理，亦可知矣。
