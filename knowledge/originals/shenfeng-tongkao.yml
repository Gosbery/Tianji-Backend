  text: 楠曰：伤官食神，一阴一阳谓。伤官阴见阴，阳见阳之谓。食神皆盗我血气之物也。子平书论伤食神之理，书虽甚多，但所言皆不亲切。何以为之伤官也？盖人之身，以官星为管我之官，如府县官之类也。出入动作，皆要循守规矩，不敢妄为。今则伤官者，则是伤杀其官，不服官管，如弑杀上官之类，则为强贼化外之民。如此格，就要不见官星，如再见官星，如再见官星，就如打府县官者，又再去府县官，则官肯放汝乎？今书止云：“伤官见官。为祸百端。”而不直言其理。
