- id: shenfeng-tongkao-ch003-p001
  volume: 选章正文
  chapter_path:
  - 第3章 男女合婚说
  sequence: 1
  text: 原出吕才蛮灭之说，只以男女年，浪立数目，配合相成，名曰合婚。妄立天医福德为上婚，游魂归魂为中婚，五鬼绝命为下婚。其谬甚矣。安可只以男女二年命，舍去月与日时，而能论人婚配者乎？若是有理，则天下之议婚者，俱择上中二婚者而配之，择下婚者而舍之，其书其易而不难，宜乎天下先天奇之妇，丧偶之矣。夫何后世又有孤孀之患者？分虽出于宿世之所定，而亦由于议婚者之明也。然议婚之礼，人道之端，亦不可不慎也。其理当何如耶？但当看男命，带比肩劫财重者，心择妇命带伤官食神重者配之。若妇命带伤官食神重者，必择男命带比肩劫财重者配之。此系合婚之正理。岂可以吕才上中下三婚无根之说，无据之理，而议人之婚配也耶！吕才说之谬，不足信也明矣。
