  - 第54章 论大运
  sequence: 644
  text: 夫大运者，就月上起。譬之树苗，树之见苗则名。月之用神，则知其格，故谓交运。如同接木然，论命有根苗化实者，正合此意，岂不宜哉。或甲乙得寅卯运，名曰动劫财败财，主克父乃克妻破财争斗之事。行丙丁巳午运，主吉庆增产。辰戌丑未戊己财运，主名皆通。此乃死法譬喻，须随格局喜忌推之，其验如神，不宜与太岁相克，若岁冲运又吉，运冲岁则甚不利，岁运相生者吉，宜细推无不应验。
