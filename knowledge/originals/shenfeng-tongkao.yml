  sequence: 643
  text: 补曰：官轻印财轻，入墓无妨。如四柱财官，三合太旺，则天元赢弱，又入墓运三合，则官旺克身，财旺生杀，则赢弱太过必祸。如上柱印绶太旺，重重三合，又入墓运三合，则生气太过必祸。空谓木盛水漂，土多金埋是已。柱内伤官食神经，遇库无灾，若伤官食神三合太旺，又遇墓合，则绝气，愈甚必灾，此以身弱之极而言。已注论伤官格内。身弱遇库无灾，惟四柱比劫三合，则身旺已无倚劫，又遇库身愈旺，无制必灾，此以身旺之极而言。故曰旺虽逢墓库绝，生加生旺过非宜。又曰中和为福，偏党为灾。
