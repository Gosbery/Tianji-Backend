  text: 补曰：伤官者，我生彼之谓也。阳见阴，如甲生午月，戊生酉月之类；阴见阳，如乙生巳月，己生申月之类。亦名盗气，喜身旺，喜印绶，喜财星，喜伤官，忌身弱，忌无财，忌官星，岁运同。如甲生午月，干头又见丁火重重，柱中有官星显露，岁运又见，是谓身弱官，伤之不尽，其祸不可胜言。故曰：“伤官见官，为祸百端，”有财有印乃解。若伤官伤尽，四柱不留一点官星，又行身旺及印运，却为贵也。故《定真篇》云：“伤官见印绶，贵不可言。”如四柱虽伤尽官星，身虽旺，若人无一点财气，只为贫薄之命。故《元理赋》云：“伤官无财可恃，虽巧必贫，须见财为妙，”是财能生官也。伤官七杀，甚于伤身七杀，其验如神。年带伤官，父母不全；月带伤官，只弟不完；时带伤官，子息凶顽；日带伤官，妻妾不免。伤官原有官星，运发去官发福，伤官用印不忌官杀，去财方发。伤官用财，见比有祸，行伤官运方发。若四柱伤官无财，又遇比劫，乃行奸弄巧，克妻伤子命。元犯伤官多，不宜复行伤官，须要见官则发，故曰：伤官无官，再见蹇滞。运入官乡，局中反贵。若伤官轻，只一位者，宜行伤官运，宜轻重较量，不可执一而论。
