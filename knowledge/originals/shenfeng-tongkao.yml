  text: 补曰：四柱纯杂有制，盖言四柱中纯杀无官。有食神制伏得宜，定居一品之尊。上文所谓五行遇月支偏官，岁时中亦宜制伏之谓也。若杀为用神，杂以正官，有伤官克制，或官为用神，杂发七杂，有食神制伏，亦定居一品之尊。上文类有去官留杀，亦有去杀留官之谓也。略见一位正官，官杀混杂反贱，是无制伏，无去留之谓也。或才改纯杂有制，为纯杀有制，误。
