  text: 又曰：伤官伤尽最为奇，尤恐伤多反不宜。此虽正理犹《志通玄》云：“伤官之格，四柱并不见，官星本然入格，但太纯而无病。”事见下文病药说。虽然日干有气，若四柱重重伤官，盗尽我身之气，如人屡屡服大黄补硝渚般通药，则身由此而泄，伤气元气，则将何以救之。如此之弱，则用附子之药，方能救其其性命。若八字重叠伤官食神，日主原又衰退弱，急须行印运以破其伤官，行财运以资其日主，此是有病这命，得药救之，亦多富贵。又如日主生旺，比肩太多，财神衰弱，盖伤官以财为用神也。则又喜见官星，以制其比劫，存起财星也。何又喜见官，前后进退之言也。缘我本身兄弟太多，官星但来制我兄弟，存起我财星，此官星为我之福，不来祸我也。故书云：“木火见官官要旺，金木伤喜见官。”雨人虚立此言，反滋人惑，不彻底讲明进退之说，岂不泥耶。何也？盖木火伤官格，假如甲乙木生正月，见火为假伤官，其火乃虚火，其焰未炽，且木气朴坚，虽见火而木之真性不焚。再若木旺，则喜庚金旺相之官星，以克制其木也。则金木有面名之用，则木火见官官要旺，其理然也。若甲乙木生临巳午月，炎火盗甲乙木之气，则谓真伤官也。原又泄木精英太多，再加庚辛官杀，制其日主，此则木火伤官，亦畏见官也。若日主旺，伤官多，见官杀反为我之权杀，亦多富贵。金水伤官喜见官何也？若庚辛日主，生于子月，或亥丑月，重重水气，泄弱庚辛金之气，则谓金水冷，则喜丙丁火官星，以暖其金气也。若水气不多，金气不旺，亦畏官星也。又云：“土金官去反成官。”宜去官昨屯，其说近理。“惟有水木伤官格，财官两见始为欢。”此则见财宜也，见官则不宜也。下此官字，反致惑人。
