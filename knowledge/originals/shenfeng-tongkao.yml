- id: shenfeng-tongkao-ch012-p002
  volume: 选章正文
  chapter_path:
  - 第12章 偏官格 附弃命从杀格
  sequence: 85
  text: 又曰：弃命从杀格，缘日主全无一点生气，四柱纯然有官杀，则不得已而只得从杀也。劈如遇强盗，本身无主，只得舍命从之，就要有财，生起其杀，行财杀运，以生用其杀也。畏见八字有根处，及制杀运犹如从盗，又思归父母兄弟之乡，则盗必恶汝。此格出正理，甚有验也。但六阴日干有从之之理，如妇人属阴，亦有从人之道。若六阳日干，见杀多，只或作杀重身轻看，若日主全无气，亦作弃命看，亦畏见根死。
