  text: 丁火日干，生于立春后二三日，其火檄寒矣，其木极嫩矣。正为木嫩火衰，不合年月两点壬水，再来湿火湿木，时上申宫庚金，冲出嫩木。且有戌了透出，年支戊土透出，月上真土，作正火土伤官用印，不合衰印受伤。一入巳运，庚金得生于巳，坏了衰印，因杀死乐安东陈人云壬余命，武十为首，问凌迟。迥罪而殆。盖透出伤官，身衰用印，印昨受伤，故犯此极刑。
