  - 第20章 杂气财官印绶格 附时墓格
  sequence: 603
  text: 楠曰：杂气财官者，盖辰戌丑未四字，乃天地不正之气，为天地四个牢狱之所，又为天地四个收藏之库。如丙丁日生辰月，若天干透也戊己多，则作杂气火土伤官格；如透出乙木多，则作杂气印绶格；如透出癸水多，方作杂气财官格；如戊日生戌月，身弱透丁火多，作杂印绶格，透辛金作杂气伤官格。又曰：杂气财官喜见冲。惟日干旺，用杂气财官者，喜见之，原财藏天地之库中，牢密坚固。如戊日生辰月，癸乙为财官，钱在库中，十分牢固，若无戌时锁匙，岂能开之，冲开财库，福兴隆然也。若不用财官，则不可把冲开作论。当以中和偏枯看，或嫌其冲为害神，再冲也来，其害愈甚。如丙日生辰月，露出乙木印星，再看又有乙木休贴作印绶格。柱中原略有金气，原印星衰也，若再行戌运，戌中辛金，冲破我辰中乙木，此原是贪财坏印看，岂可杂气财官喜见冲论乎？又如丙丁日生戌月，透出戊土多，作杂气伤官格看，原日干丙丁属火，到九月授衣之月，火气寒凉，见土多泄弱火之精，喜东主木运，克去其伤官，不来泄我，喜木运又来资我则吉。若到辰运，再冲出戌中戊土来，愈泄弱我精神，安得不死，此亦不可作杂气财官喜见冲也。惟身旺有财官，方喜冲开，早年发达。此格与伤官甚难看，此格要露库中何物也来，方可定用神。书之中概以冲开为美，岂不谬也。
