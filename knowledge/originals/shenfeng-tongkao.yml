- id: shenfeng-tongkao-ch012-p001
  volume: 选章正文
  chapter_path:
  - 第12章 偏官格 附弃命从杀格
  sequence: 84
  text: 楠曰：偏官为阳见阳、阴见阴，原非阴阳配合。更得食神伤官，以制去其凶锐，虽先为克我之凶神，今则驯致其凶，而反为我之奴仆也。用偏官，如人之畜奴仆，擒制太过，则为尽法无民，则奴仆力衰，不能为我运动。若擒制之不及，则奴欺主矣。偏官即七杀也，如甲日干，数至七个字逢庚字，号为七杀，乃克身之刀剑一般，偏官无制曰七杀，故宜制伏，亦畏太过，亦畏不及。凡看命先看七杀，若有七杀，就要将此七杀处置了，方能用得别物。若不能制去其七杀，则杀星能害我性命。譬如人虽有金银田产，无性命，此实为闲物。原书去云：“有杀须论杀，无杀方论用。”盖先人立有此言，特未分明显说，故使学者心上模糊，但杀是势恶权贵，奸邪小人之象。故用杀得宜，多主显耀，宦臣相类与其媚于奥，不若媚于灶之意也。月上逢官无可用之理，但能管束我之身，安肯为我用也？但或官星衰，则生之，官星太旺，则克之，取此定祸福。吾亦未见用月上官星是贵命，只见用杀星，多富贵人也。子平书俱涵说隐，而不发其真理。故杀者，杀我也，是杀身之对手。官者管我也，是制身之绳法。此造化之正理，不可知也。
  normalized_text: 楠曰：偏官为阳见阳、阴见阴，原非阴阳配合。更得食神伤官，以制去其凶锐，虽先为克我之凶神，今则驯致其凶，而反为我之奴仆也。用偏官，如人之畜奴仆，擒制太过，则为尽法无民，则奴仆力衰，不能为我运动。若擒制之不及，则奴欺主矣。偏官即七杀也，如甲日干，数至七个字逢庚字，号为七杀，乃克身之刀剑一般，偏官无制曰七杀，故宜制伏，亦畏太过，亦畏不及。凡看命先看七杀，若有七杀，就要将此七杀处置了，方能用得别物。若不能制去其七杀，则杀星能害我性命。譬如人虽有金银田产，无性命，此实为闲物。原书去云：“有杀须论杀，无杀方论用。”盖先人立有此言，特未分明显说，故使学者心上模糊，但杀是势恶权贵，奸邪小人之象。故用杀得宜，多主显耀，宦臣相类与其媚于奥，不若媚于灶之意也。月上逢官无可用之理，但能管束我之身，安肯为我用也？但或官星衰，则生之，官星太旺，则克之，取此定祸福。吾亦未见用月上官星是贵命，只见用杀星，多富贵人也。子平书俱涵说隐，而不发其真理。故杀者，杀我也，是杀身之对手。官者管我也，是制身之绳法。此造化之正理，不可知也。
