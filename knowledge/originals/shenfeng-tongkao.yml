  - 第18章 印绶格
  sequence: 534
  text: 楠曰：正印偏印格者，如父母生身之义也，盖日主得其资助。书云：“印绶生月利官运，畏入才乡，盖财乃破印之气也。”此亦书之死路，非通变之道也。然四柱印星太旺，日主有气，印叠生身，如人元气本旺，再服补药，生可存乎“此则几用见屠以破印也。四财少，必须运上财神为吉。又若日主根轻。印星又弱，最畏财星，谓之贪财损印，宜也。又有真印假印，如丙日生人，生临亥月，或用亥月甲木作假印地也。十月木气，根桔叶落，则此衰木，宜行东方木旺之地，以辅助其根气，则枯苗得雨，勃然而兴，畏巳酉丑运，冲克其木，尤畏行西方申辛本，天干地支俱全，损伤尤甚。若天干得壬癸甲乙丙丁盖头，虽祸亦浅，又若丙丁日主，临寅卯多根之地，谓之真印也。若印多不畏财星，日主轻，如只有一二点印，亦畏财也。大抵木不能胜金，谓之印绶被伤。倘若荣华不久，真假印辩，不可不究。财、官、印、杀、食神、伤官，此六乃日干月令。正格外有阳刃格！此系日月相通。出此之外，或虚邀财官，或刑合财官，或暗拱财官，或冲摇财官，亦几近理。说见小文。
