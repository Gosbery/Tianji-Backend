  sequence: 361
  text: 予修净土人也，亦不事此术，为继家君之志，而编此书。予命正合书云：“素食慈心，印绶遂逢于德。”信矣：凡壬水喜财官，生子月为建刃若行财官运，为人必白手兴家。但二木伤官杀，有二金以当以之，八字巳中土无多，故主不贵，喜时日骗财，类聚亲切。凡用偏财者多慷慨，身旺肯施舍而不吝。故古歌云：“偏财身旺是英豪，羊刃无侵禄位高。结织有情多慷慨”云云，然哉是言也，所恶者刃，敌不免重婚耳。所宜者官杀，官杀旺比劫方衰。行癸运罹父母灾，遭妻子变，故曰身旺比劫重损，财又伤妻是也。酉运一入，火土俱败，不遂宜矣。若壬运比癸不同，一旦运至南方，利壬而不利癸，申运水土得长生，或遂贻燕之谋。辛未庚午己巳，行官印之乡，可望妥安。辰运水土入墓，不免西归矣，但无奈时逢七杀，更兼寅巳相刑，妻子遭丧，惟喜贴身甲木制之，故曰时上偏官有制。晚子英奇，理或然也。但命至微妙，宣父难言之。予据先人成说，更稽先人遗训，故浪揣摩以为后鉴云。
