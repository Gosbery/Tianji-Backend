  text: 然伤官格人多傲气者何乎也？子平之言，未言其理。盖人用官，为管我之官。我则不畏其宫而伤之，是肯放我为非，岂不是好傲僭者乎，又多聪明者何也？盖日主之气破，泄其精英，是其英华发于外也，故多聪明，若日干旺，精英喜泄，则为儿卿为相。若日干弱，泄气太多著，多为迂谬寒儒。盖其所泄精英，亦不好精英也。若男以官星为子，见伤官以破之，多主克子，其理易晓。若见财暗生于星，则又有子也，食神格亦多类此。若见二三点，则混为人伤官看，若单见一点食神，为食神生财格，亦要日干旺，食神生其财星，最忌偏印为枭神夺食。若食神多则不畏也，一则与真伤官同，不畏印运也。若止一点，再如食神气弱，又柱中有官杀，原赖此食神制杀，今被此枭印破去食神，不能来制杀，则反来克身，多主寿夭贫寒。伤官格多畏入墓运，故言其祸甚烈，亦不推明立说之意。盖伤官格，乃伤杀官长之人将如此等人，提入牢狱，必多苦楚，此说亦不甚近理也。但原真伤官太多，泄气太过者，行伤官墓地，又添一点伤官。愈泄精神多死，亦非之墓之害也。又或假伤官气轻，日干旺，喜伤官泄其精神，再行伤官墓地，又添一点以泄其精英，入墓运返多富贵，亦不可以入墓为说也，但当以伤官轻重假论之，其理甚是。
