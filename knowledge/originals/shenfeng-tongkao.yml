  text: 补曰：财者，养命之源；官者，扶身之本；印绶者，资身之基也。此三者藏蓄于辰戌丑未之月，乃四隅之气，非天地东西南北之正气，故曰杂气财官印绶格。此格喜透露，喜刑冲破害，或用财官，而财官透，或用印绶而印绶透，透财则富，透官则贵，透印则吉，享万物之见成，故曰始为丰。若财官印闭锢于库中，不中不刑，则少年不发库中人，所以宜冲破也。若支干则遇比劫之压伏，官遇食伤之压伏，印绶遇财星之压伏，而且太多，则欲其富贵，而享现成之福也难矣，故曰切忌干支压伏重。
