  text: 楠曰：正财者，何也？财为吾性命之物，人见之未尝不欲。若身主有气，则能任之，若金宝，若田产，皆我之物也。身弱则不能任，如盗偷人财物，事发则为害命之物也。书云：“逢财喜杀而遇杀，十有九贵。”下场虽是甚是，而不显言。若用财之人，日干旺，比肩兄弟多，则此比劫，又分夺我之财也。则喜官杀以去其比劫，存起其财星。若身弱财多，再见官杀来克身，则自己性命，且不可保，安得享其财乎？其财官星多，若身主旺，则喜食神伤官以生起其财神。若身主弱，财星多，则喜兄弟比劫以分之，父母印运以助之。凡用偏财者，多主富贵，用正财者多不及。盖阴克增爱分明，阳克阳，财神有气，用时日偏财尤美。此乃试验之多，故多用偏财者为上格，亦有财神亲功，若有比肩间隔，不纯和，亦不美，此系五行之正理。
