  text: 补曰：月上偏官，谓阳见阳，阴见阴。如甲生申月，乙生酉月，是已。为人刚暴好杀，触之即怒，性情如虎，最怕三刑六害，或羊刃魁罡，相冲必有凶祸。最喜运皆旺相，身强有制，化为权贵。若身弱杀强，无制之运，则虎加翼者也，其咆哮之威不可御，反为所噬。然偏官固宜制伏，亦贵中和。如一位偏官，制伏有二三，复行制伏之运，反不作福。何以言之？盖尽法无民，可绎思也。
