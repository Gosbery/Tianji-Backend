  text: 补曰：甲乙生于丑月，丙丁生于辰月，戊己生于戌未月，庚金生于辰戌月，壬癸生于戌月，皆月支逢季月也，各有印绶藏库，喜干头显露，又要柱中官杀相生，财星有气，则财生官，官生印，印生身。身克财则荣贵，所谓印赖杀生，官因财旺是巳。或曰此以杂气绶言，有官禄，不惟贵显，更资财产业饶盛，亦不要见财。
