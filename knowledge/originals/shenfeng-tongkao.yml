  text: 补曰：旧文第二句，原是“不忌当生金水编”而或都改为“不见”与末句“再逢”字不相应，仍当作不忌看。盖土临卯位，谓己卯日主，亥卯未三合杀局，谓从杀亦可。当生金水，俱有谓金生水。水生杀，亦不忌。或生火土旺运，杀印相印相生，功名显达。再行坤坎金水之运，必祸连，盖当生既逢金制，而运又逢之，必祸连绵不已，所谓食神破局反不吉是已。又一说末句旧文，原是福连绵，而或改为祸连绵亦非。盖己卯日主，逢亥卯未三合，是谓杀强身弱，当生金水相缠，水固生杀，而金能制杀。故不忌。及犯行身旺之地，则廊庙之客，金紫之贵，所必至矣，故曰功名大用福双全。
