  sequence: 489
  text: 壬生酉月，金水两字双清，金水之气有余，木火两字不足。金虽有余也，而喜天干丙丁，遥来损金也。喜无地支午火，实去破印，所以印得两全其美，壬水气虽有余，喜亥中甲木，泄其精英也。其贵如此，丙了火，暗销庚金，而存起亥上食神。所以八月木气凋零，其病甚重，所以病重者，金大贵也。运入东方，补起水火二字，位登黄阁也，宜矣。此乃天地至清之命，所以为天下至贵人也。
  normalized_text: 壬生酉月，金水两字双清，金水之气有余，木火两字不足。金虽有余也，而喜天干丙丁，遥来损金也。喜无地支午火，实去破印，所以印得两全其美，壬水气虽有余，喜亥中甲木，泄其精英也。其贵如此，丙了火，暗销庚金，而存起亥上食神。所以八月木气凋零，其病甚重，所以病重者，金大贵也。运入东方，补起水火二字，位登黄阁也，宜矣。此乃天地至清之命，所以为天下至贵人也。
