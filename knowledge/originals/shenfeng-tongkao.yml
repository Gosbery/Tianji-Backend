  text: 究人之命，将何以探其玄妙？如八字中看了日干，次看了月令，且如月令中支中所属是火，先看月令中此一火字起，又看年上或火，又看月时上或有火，宜将以上各火做一处看，或为病，或非病。又或地支虽又藏有别物，且不必看，若再看别物，由混杂不明，故曰：从重者论。此理是看命下手法处。若以火论，又再年水金看土，则不知命理之要也。若财官印绶有病，就要医其财官印缓也。如身主有病，就要医其身主也。如八字纯然不旺不弱，原财官印俱无损伤，日干之气，又得中和，并无起发可观，此是平常人也。
