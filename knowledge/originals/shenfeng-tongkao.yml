  text: 补曰：正财偏财，皆喜身旺，皆忌印绶倒食，身弱比肩劫财，但偏财喜官星，而正财忌官星，故：《集说》云：正财偏财二格，喜忌不同。惟有喜官星，不喜宜星之小异耳。及偏财为人有清高，而多主慷慨，不其吝财，盖能利己，亦能招谤。虽喜官星，亦当较量身之强弱，运之盛衰而言。如运行旺相，福禄俱臻，行官乡便可发禄。若财盛而身弱，运到官乡，既被财之盗气，又见官之克身，不惟不发禄，亦妨患咎。如四柱中先带官星，便作好命看。若四柱兄弟背出，纵入官乡，发禄必少。正财为人诚信，作事俭约，处信聪明，惟是悭吝，虽正财不喜见有官，恐盗财之气。然四旺多身旺劫重重，亦喜见官杀制钛比劫，故曰逢看杀，见官尤妙。藏妙露官。当作贵推，亦不可泥于喜见官之说也。
