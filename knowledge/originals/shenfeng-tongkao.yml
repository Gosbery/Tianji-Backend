  text: 《食神格补》曰：“食神者，我生彼之谓也。”阳见阳干，阴见阴干，如甲日见丙，乙日见丁之例。丙禄在巳，甲人食丙，又见巳字，丁禄在午，乙人食丁，又见午字，是谓天厨食神。而食神有气，要曰千自旺，则贵而有禄，富而有寿，故曰食神有气胜才官。先要强地旺本干，最忌枭神夺食，此肩分食。又不喜见官星，并刑冲，喜才星相生独一位见之，则为贵神。盖重逢见之，则为伤官，反为不美，令人少子，有克难存。若食神纯粹，主人财厚食丰，度量宽洪，肌体肥大，优游自足，有子息，有寿考。又忌行食神死绝运，并偏印枭神运，主生灾咎不利，惟偏财能制救。故《洪范》云：“偏财能益寿延年，”以其能制枭也。又曰：“食神明朗寿元长，继母逢之不可当。若无宠来救助，恰如秋草遇秋霜。”古歌云：“食神生旺喜生财，日主刚强福禄来，身弱食多反为害，或逢枭神主凶灾。”又曰：“食神生旺无刑克，全逢此格胜财官。更得运行生旺地，少年折桂拜金蛮。”
