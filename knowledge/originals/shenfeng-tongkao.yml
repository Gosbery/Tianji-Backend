  - 第67章 天干阴阳通变、定格局决
  sequence: 678
  text: 子平之法，一曰：官分之阴阳，曰官，曰杀，甲乙见庚辛是。二曰：财分之阴阳，曰正曰偏，甲乙见戊己是。三曰：生气之阴阳，曰印绶曰倒食，甲乙见壬癸是。四曰：窃气之阴阳，曰食神，曰伤官，甲乙见丙丁是。五曰：同类之阴阳，曰劫财，曰羊刃，甲乙见甲乙是也。人之富贵贫贱寿夭，皆不出此五者，术士不明其格，乱惑世人，无异乎命不验也。今立格定局诀於左，以便稽考。
