  text: 补曰：偏财谓阳见阳财，阴见阴财，如甲见戊，乙见己之类。然偏财乃众人之财，非义不当得之财也。惟忌干支比肩劫财分夺，则兴一。所谓妹兄弟分夺，功名不遂祸随生是己。不有官星，祸百生出，故曰：“若带官星更妙哉。”但恐身势无力，财弱无。故曰：“身强财旺皆为福。”何者？盖身旺自能胜财，财旺自能生官矣。
