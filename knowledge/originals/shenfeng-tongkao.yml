  text: 戊土生未，极为土旺也。然辰戌丑未四土之神，然辰土带木气克之，戌丑之土带金气泄之，此戊土虽旺而不旺故戊临此三位全，多作稼穑格，不失中和。若未月土火气也，见火以生之，所以土为极旺也。若土临此未月，见四柱土重，多作火炎土燥，不可稼穑看。但临此月之土，见金结局者，不贵即富也。书云：“土逢季位见金多”终为贵论。若此造早年，行午运尚否，火伤金也。一行辛巳庚辰二运，衰金得此，财发数千万缗。一入寅运，甲辰年，虾蟆瘟死，家无瞧类，盖为火克衰金也。
