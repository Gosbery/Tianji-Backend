  sequence: 352
  text: 楠曰：时上偏财格，盖以日干有气，能任其财也。如甲寅日见戊辰时也，天干透出财神，斯格方真。若又岁月有财相杂，克倒曰干，则不能任其财，嫌官杀运，克倒曰干，则不能任其财。盖身太旺比肩多，又喜官杀运制去其比肩，放起其财神，不可其财神，不可救药执泥。但用偏财日旺多富贵，盖阴克阳，财神亲切有气也。用正财未见其美，身旺多有施舍谊气，多得横来财也，理也于是。
