  text: 故曰：官杀排门兄寿夭，杀官司户弟成行。故月乃门户也，又若日通月气，比肩神旺，多主鸿雁成行，理虽如是，变贵变通。苟或日主根多，比肩太旺，亦主参商，盖缘兄弟多来劫财神也，此又喜官杀而得兄弟也。偏财为父，比劫重重损父亲，正印为母，星旺处虽损母，以官杀为子，伤官食神多损子。若官杀太重，克制日主，早自身救死不赡，安能生子乎”必须食神伤官，制去官杀，方能生子也。男命如斯，女命亦然。若财官旺而日主弱，夫家兴而母家灰，盖财官乃旺夫之物也。然财能损母，官能克兄弟，多主父母兄弟凋零。
