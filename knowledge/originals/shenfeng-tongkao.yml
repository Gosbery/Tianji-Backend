  text: 然伤官之格，有真伤官，有假伤官。如真伤官者，甲乙日生于巳午未月，真火为伤官用事，盖甲乙日被火焚其精英，若火多而木性失，则喜北方水运，以破其伤官，扶起其木气，如止一二点火，亦畏印以破之，故曰破了伤官损寿元，如甲乙木生正二月，见火为假伤官。其火气尚未炽烈，则用虚火为用神，正谓木能生火木荣昌，木火通明佐庙廊。又曰假伤官行伤官运发，若行南方火运。动其虚火，且木气坚朴，又得火以泄其精英，金主富贵。若行北方运，破其盛火，正谓假伤官印运必死，真伤官印运必死，真伤官行伤官运必灭。如甲乙木生于巳未月，伤官泄气太重，再行寅午戌火运，泄木精英太甚，安得不死乎？书云：“木作飞灰，男几寿夭。”
