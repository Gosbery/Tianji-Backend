  text: 补曰：时上偏财者，如庚日见甲干，或寅支，辛曰见乙干，或卯支之类。只要一位贵，不要多，而三处不要再见财。劫怕年月日冲破，如寅冲申，酉冲卯日己。如不逢，自享荣华富贵矣。柱中及运，若见败财，如辛见庚及申见劫羊刃，如庚见辛及酉之类，必伤妻耗财，破家不足而已。苟干支无遇，则富而有财，贵而有权，可比石崇矣。
