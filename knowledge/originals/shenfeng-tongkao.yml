  text: 一说此言世之人纳粟奏名者，乃是身临财库。居于月令生旺之守。假令金以木杰财，库于未，辛未日生人，是身临财库，若生于冬月，谓之财库居生地，若生于有春月，谓之财库居旺地，故日财库居生旺之地。此说亦似牵强。盖杂气喜爱身旺，如身居休囚也，天元赢弱，正为富室贫人，岂能纳粟奏名乎？财库固要生旺，须要身居生旺，可以当之。此说不如前说，亦当参者。如身居生旺，财库亦生旺更妙，可外身而专言财库生旺乎？
