  text: 补曰：印绶生月，干头重重，一见印绶之比肩，又行印旺之运，必伤身。所谓木赖水生，水盛则木漂，木逢壬癸水漂流，日主无根枉度秋是巳。印旺遇财乃发，须入财乡运，乃能发福发禄，如水盛木漂，必须行败运，以土制木，则木植其根为福，所谓岁运若行财旺也，反凶为吉遇王侯是也。《格解》所谓印绶畏入财乡之句，不可抱泥是也。
