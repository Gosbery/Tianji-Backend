  text: 盖人之造化，虽贵中和，若一于中和，则安得探其消息，而论其休咎也？若今之至富至贵之人，必先“劳其筋骨，饿其体肤，空乏其身，然后动心忍性，增益其所不能，”人命之妙，其犹此乎！愚尝先前未谙病药之说，屡以中和而究人之造化，十无一二有验。又以财官为论，亦俱无归趣。后始得悟病药之旨，再以财官中和参看，则尝八九而得其造化所以然之妙矣。
