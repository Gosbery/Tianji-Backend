  sequence: 437
  text: 壬水日主，生于十二月，初旬水气犹旺，再加年上庚子，俱是水乡，时上金水气旺，壬水旺甚，多好泄也。女人血气旺盛，多好淫亵也。壬水望见寅亥进气之木，壬则望见寅亥进气之木。壬则泄其精英，在寅亥木上矣。所贵者，四柱有庚辛金，暗来损木，类牛山之木也。木神受病甚重，大运入卯，再逢丁卯流年，衰木得局，如枯苗之得雨，勃然而兴，中江西解元。壬辰癸运，水滋枯木，擢北方吏部，又选司郎中，名显天下，大运入己巳，有庚金刑克寅亥衰木，王荣奏本，戍辽东铁鼎卫而死也。盖因亥再会二字相联，木神有气，两点食神，遂作假伤官格，正谓假伤官运发也。如甲木散乱，原非类聚，亦不作此格，大凡看格不拘月令，只看运静，归秀气在何处，十有八九验也。
