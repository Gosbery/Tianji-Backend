  text: 补曰：生加生旺过非宜，此申上文生财须逢墓库绝而言也，非有别意。墓库逢休终不发，日上文墓库必来生旺发言也，亦非有别意。如柱中财官印生旺，不宜入财官印墓也，故曰旺官旺印与旺财，入墓有祸。如日干生旺，不宜入日干库地，故曰身旺入库必兴灾。墓必来生旺发，如财官居墓库，必来财官生之地发财发官。如身主墓库，必来身主生财之地可以发身。又生加旺过非宜，如身居生旺，加以身财官生旺之运，则太过必祸，所谓遇生地之相逢，宜退身主生旺之运，则太过有咎。所谓财多无财，运逢化杀生灾，官多无官，太旺倾危是己。如身居生旺，加以身主生旺之运，则太必弱。所谓遇生地之相逢，宜退身而避位，生地相逢，壮年不禄是己。墓库逢休终不发，如财官居墓库之地，又逢身主休败之运，何以发身。
