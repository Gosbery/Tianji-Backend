  text: 补曰：凡伤官格，行旺相吉者，是言四柱伤官轻，而运行旺相临官帝旺之地，则吉而福荣。死墓皆凶祸败。如甲生午月，乙生巳月，柱中有寅午戌字，又行戌运，寅午戌三合伤官，谓之入墓，必祸是也。阳顺憎爱分明逆。以用神而推者，是言阳伤官为用神，运顺行，其祸死者多矣。阴伤官为用神，运顺行，其祸死者多矣。阴伤官为用神，运逆行其祸小，未心死也。故《醉醒子气象篇》云：“入库伤官，阴生阳死。”夫伤官轻而行旺相固吉，如年上伤官，柱中重重三合太旺，又无财，虽再行旺之地，泄气愈甚反凶。故古歌云：“年上伤官最可嫌，重怕伤官可嫌不可蠲。”又古歌云：“伤官伤尽最为奇，犹恐伤多反不宜。此格百中吉千变化。消息须要用心机。”又古歌云：“戊己生时气不全，月时两处是伤官。必当头面有亏损，脓血之疮苦少年。”观三歌柱内，伤官既重，不可行旺相也明矣。《纂要》是言轻者，当行旺相也。当轻重较量，不可执一。夫柱内伤官重，而和地墓死固皆凶。然正气伤官，虽柱中轻，亦不可入墓死之运。故古赋云：“伤官食神并身旺，遇库兴灾有祸殃。虽然当有阴阳辨，如前所言甚精详。”又格解以下二格，与此格合解，亦非尽伤官。以月令生我者言，正倒禄，非以曰主暗冲者言，内有二字泛指，四柱非指伤官也。
