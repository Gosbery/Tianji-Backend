  text: 补曰：庚日值寅，坐休绝之地，而柱中又遇丙，似乎衰而危。然寅中戊土生长，能生庚金，以泄丙火之气，乃绝处逢生，名曰胎元受气，又名小长生。人命逢之，主一生造化，衣禄兴旺而无危，非言日主之旺也。下文云金逢恳而遇土，号曰还魂。或者以庚寅日为旺不通，遂以庚值寅而为庚值申，以迎合主旺为日主之旺。非经本义，不可从。
