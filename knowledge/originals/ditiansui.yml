  text: '甲子 戊辰 庚申 壬午

    己巳 庚午 辛未 壬申 癸酉 甲戌 乙亥 丙子

    此造以俗论之，干透三奇之美，支逢拱贵之荣，且又会局不冲，官星得用，主名利双收。然庚申生于季春，水本休囚，原可用官，嫌其支会水局，则坎增其势，而离失其威，官星必伤，不足为用。欲以强众敌寡而用壬水，更嫌三奇透戊，枭神夺食，亦难作用。甲木之财，本可借用，疏土卫水，泄伤生官，似乎有情，不知甲木退气，戊土当权，难以疏通。纵用甲木，亦是假神，不过庸碌之人。况运走西南甲木休囚之地，虽有祖业，亦一败而尽，且不免刑妻克子，孤苦不堪。以三奇拱贵等格论命，而不看用神者，皆虚谬耳。'
  normalized_text: 甲子戊辰庚申壬午己巳庚午辛未壬申癸酉甲戌乙亥丙子此造以俗论之，干透三奇之美，支逢拱贵之荣，且又会局不冲，官星得用，主名利双收。然庚申生于季春，水本休囚，原可用官，嫌其支会水局，则坎增其势，而离失其威，官星必伤，不足为用。欲以强众敌寡而用壬水，更嫌三奇透戊，枭神夺食，亦难作用。甲木之财，本可借用，疏土卫水，泄伤生官，似乎有情，不知甲木退气，戊土当权，难以疏通。纵用甲木，亦是假神，不过庸碌之人。况运走西南甲木休囚之地，虽有祖业，亦一败而尽，且不免刑妻克子，孤苦不堪。以三奇拱贵等格论命，而不看用神者，皆虚谬耳。
