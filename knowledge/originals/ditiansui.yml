  text: '丙子 己亥 乙丑 壬午

    庚子 辛丑 壬寅 癸卯 甲辰 乙巳 丙午 丁未

    此造初看，一无可取，天干壬丙一克，地支子午遥冲，且寒木喜阳，正遇水势泛滥，火气克绝，似乎名利无成。余细推之，三水二土二火，水势虽旺，喜无金；火本休囚，喜有土卫，谓儿能救母；况天干壬水生乙木，丙火生己土，各立门户，相生有情，必无争克之意。地支虽北方，然喜己土原神透出，通根禄旺，互相兹护，其势足以止水卫火，正谓有病得药。且一阳后万物怀胎，木火进气，以伤官秀气为用。中年运走东南，用神生旺，必是甲第中人。交寅，火生木旺，运登甲榜，入翰苑，是以青云直上。'
  normalized_text: 丙子己亥乙丑壬午庚子辛丑壬寅癸卯甲辰乙巳丙午丁未此造初看，一无可取，天干壬丙一克，地支子午遥冲，且寒木喜阳，正遇水势泛滥，火气克绝，似乎名利无成。余细推之，三水二土二火，水势虽旺，喜无金；火本休囚，喜有土卫，谓儿能救母；况天干壬水生乙木，丙火生己土，各立门户，相生有情，必无争克之意。地支虽北方，然喜己土原神透出，通根禄旺，互相兹护，其势足以止水卫火，正谓有病得药。且一阳后万物怀胎，木火进气，以伤官秀气为用。中年运走东南，用神生旺，必是甲第中人。交寅，火生木旺，运登甲榜，入翰苑，是以青云直上。
