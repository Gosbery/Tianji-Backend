  text: '辛卯 甲午 乙卯 乙酉

    癸巳 壬辰 辛卯 庚寅 己丑 戊子

    乙木生于午月，卯酉紧冲日禄，月干甲木临绝，五行无水，夏火当权泄气，伤官用劫，所忌者金。初运壬辰癸巳，印透生扶，平顺之境；辛卯运，惟辛酉年冲去卯木，刑丧克破，至庚运丙寅年，所忌者金，而丙火克去之，局中无土水泄制丙火，又火逢生，金坐绝，入泮，得舒眉曲也。'
  normalized_text: 辛卯甲午乙卯乙酉癸巳壬辰辛卯庚寅己丑戊子乙木生于午月，卯酉紧冲日禄，月干甲木临绝，五行无水，夏火当权泄气，伤官用劫，所忌者金。初运壬辰癸巳，印透生扶，平顺之境；辛卯运，惟辛酉年冲去卯木，刑丧克破，至庚运丙寅年，所忌者金，而丙火克去之，局中无土水泄制丙火，又火逢生，金坐绝，入泮，得舒眉曲也。
