- id: ziping-zhenquan-ch43-p001
  volume: 正文
  chapter_path:
  - 正文
  - 第43章 论阳刃
  sequence: 268
  text: 阳刃者，劫我正财之神，乃正财之七煞也。禄前一位，惟五阳有之，故为旭刃。不曰劫而曰刃，劫之甚也。刃宜伏制，官煞皆宜，财印相随，尤为贵显。夫正官而财印相随美矣，七煞得之，夫乃甚乎？岂知他格以煞能伤身，故喜制伏，忌财印；阳刃用之，则赖以制刃，不怕伤身，故反喜财印，忌制伏也。
  locator: 第43章 论阳刃·第1段
