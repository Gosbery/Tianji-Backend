  text: 予自束发就传，即喜读子史诸集，暇则子平《渊海》、《大全》略为流览，亦颇晓其意。然无师授，而于五行生克之理，终若有所未得者。后复购得《三命通会》、《星学大成》诸书，悉心参究，昼夜思维，乃恍然于命之不可不信，而知命之君子当有以顺受其正。
