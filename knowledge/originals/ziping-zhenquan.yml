  - 第10章 论用神变化
  sequence: 53
  text: 又有变之而不失本格者。如辛生寅月，透丙化官，而又透甲，格成正财，正官乃其兼格也。乙生申月，透壬化印，而又透戊，则财能生官，印逢财而退位，虽通月令，格成伤官，百戊官忌见。丙生寅月，午戌会劫，而又或透甲，或透壬，则仍为印而格不破。丙生申月，逢壬化煞，而又透戊，则食神能制煞生财，仍为财格，不失富贵。如此之类甚多，是皆变而不失本格者也。
  locator: 第10章 论用神变化·第5段
