  normalized_text: 刑者，三刑也，子卯巳申子类是也。冲者，六冲也，子午卯酉之类是也，会者，三会也，申子辰之类是也。合者，六合也，子与丑合之类是也。此皆以地支宫分而言，系对射之意也。三方为会，朋友之意也。并对为合，比邻之意也。至于三刑取庑，姑且阙疑，虽不知其所以然，于命理亦无害也。
- id: ziping-zhenquan-ch07-p002
