- id: ziping-zhenquan-ch01-p001
  volume: 正文
  chapter_path:
  - 正文
  - 第1章 论十干十二支
  sequence: 7
  text: 天地之间，一气而已。惟有动静，遂分阴阳。有老少，遂分四象。老者极动静之时，是为太阳太阴；少者初动初静之际，是为少阴少阳。有是四象，而五行具于其中矣。水者，太阴也；火者，太阳也；木者，少阳也；金者，少阴也；土者，阴阳老少、木火金水冲气所结也。
  locator: 第1章 论十干十二支·第1段
