  sequence: 30
  text: 况八字虽以月令为重，而旺相休囚，年月日时，亦有损益之权，故生月即不值令，而年时如值禄旺，岂便为衰？不可执一而论。犹如春木虽强，金太重而木亦危。干庚辛而支酉丑，无火制而晃富，逢土生而必夭，是以得时而不旺也。秋木虽弱，木根深而木亦强。干甲乙而支寅卯，遇官透而能受，逢水生而太过，是失时不弱也。
