  sequence: 93
  text: 况四库之中，虽五行俱有，而终以土为主。土冲则灵，金木水火，岂取胜以四库之冲而动乎？故财官属土，冲则库启，如甲用戊财而辰戌冲，壬用己官而丑未冲之类是也。然终以戊己干头为清用，干既透，即不冲而亦得也。至于财官为水，冲则反累，如己生辰月，壬透为财，戌冲则劫动，何益之有？丁生辰月，透壬为官，戌冲则伤官，岂能无害？其可谓之逢冲而壬水之财库官库开乎？
