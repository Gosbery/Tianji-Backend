  sequence: 29
  text: 书云，得时俱为旺论，失时便作衰看，虽是至理，亦死法也。然亦可活看。夫五行之气，流行四时，虽日干各有专令，而其实专令之中，亦有并存者在。假若春木司令，甲乙虽旺，而此时休囚之戊己，亦尝艳于天地也。特时当退避，不能争先，而其实春土何尝不生万物，冬日何尝不照万国乎？
