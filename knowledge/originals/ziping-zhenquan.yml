  text: 然星辰命书，亦有谈及，不善看书者执之也。如“贵人头上带财官，门充驰马”，盖财官如人美貌，贵人如人衣服，貌之美者，衣服美则现。其实财官成格，即非贵人头上，怕不门充驰马！又局清贵，又带二德，必受荣封。若专主二德，则何不竟云带二德受两国之封，而秘先曰无煞乎？若云命逢险格，柱有二德，逢凶有救，右免于危，则亦有之，然终无关于格局之贵贱也。
