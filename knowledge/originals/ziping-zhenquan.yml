  normalized_text: 何谓变之而不善？如丙生寅月，本为印绶，甲不透干而会午会戌，则化为劫。丙生申月，本属偏财，藏庚透壬，会子会辰，则化为煞。如此之类亦多，皆变之不善者也。
- id: ziping-zhenquan-ch10-p005
  volume: 正文
  chapter_path:
