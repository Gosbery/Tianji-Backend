  sequence: 94
  text: 今人不知此理，甚有以出库为投库。如丁生辰月，壬官透干，不以为库内之壬，干头透出，而反为干头之壬，逢辰入库，求戌以冲土，不顾其官之伤。更有可笑者，月令本非四墓，别有用神，年月日时中一带四墓，便求刑冲；日临四库不以为身坐库根，而以为身主入库，求冲以解。种种谬论，令人掩耳。
