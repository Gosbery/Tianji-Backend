  sequence: 2
  text: 戊子岁予由副贡充补官学教习，馆舍在阜城门右，得交同里章公君安，欢若生平，相得无间，每值馆课暇，即诣君安寓谈《三命》，彼此辩难，阐民无余蕴。已而三年期满，僦居宛平沈明府署，得山阴沈孝瞻先生所著子平手录三十九篇，不觉爽然自失，悔前次之揣摩未至。遂携其书示君安，君安慨然叹曰：“此谈子平家真诠也！”
