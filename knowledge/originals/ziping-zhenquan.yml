- id: ziping-zhenquan-preface-p003
  volume: 序
  chapter_path:
  - 序
  sequence: 3
  text: 先生讳燡燔，成乾隆己未进士，天资颖悟，学业渊邃，其于造化精微，固神而明之，变化从心者矣。观其论用神之成败得失，又用神之因成得败、因败得成，用神之必兼看于忌神，与用神先后生克之别，并用神之透与全、有情无情、无力无力之辨，疑似毫芒，至详且悉。是先生一生心血，生注于是，是安可以淹没哉！
