- id: ziping-zhenquan-preface-p004
  volume: 序
  chapter_path:
  - 序
  sequence: 4
  text: 君安爰谋付剞劂，为天下谈命者，立至当不易之准，而一切影响游移管窥蠡测之智，俱可以不惑。此亦谈命家之幸也；且不谈命家之幸，抑亦天下士君子之幸，何则？人能知命，则营竞之可以息，非分之想可以屏，凡一切富贵穷通寿夭之遭，皆听之于天，而循循焉各安于义命，以共勉于圣贤之路，岂非士君子厚幸哉！
  locator: 序·第4段
