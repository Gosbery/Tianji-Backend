- id: mingli-yueyan-ch008-p001
  volume: 选章正文
  chapter_path:
  - 第8章 看格局法二
  sequence: 36
  text: 五行之理，只是生我克我，我生我克，但不设名目，不便推详，故古人立官煞、印财、食伤之名，而六格出焉。然所谓官者非诚官爵；所谓印者，非诚印章；所谓财者，非诚财宝；所谓伤者，非诚损伤。故得时得局，煞伤可以富贵；失时失局，官印可以贫贱。大抵成格则为上命，破格则为下命。然有初看甚吉，而竞不吉，或吉凶相参者，初看甚凶，而竞不凶或吉凶相参者此乃主中有暗神助格破格，而不易见也。又有细看仍吉而终不吉，或吉凶相参者，细看仍凶而终不凶，或吉凶相参者，此乃运中有暗神助格破格，而未及察也。且或即此一字，而助格破格亦在此，是以吉处藏凶，凶中隐昔贤谆谆言之，岂不精审乎。若人命更有令神无力，六神皆轻，不敢取某神为格者，故多下命，亦有上命，此亦随柱斟酌，逐运消详，不必胶执取格也。至于诸变格，亦不外生克之理。从局化局，则欲生扶其所从所化。一行得气，则欲生扶此一行，不欲损克此一行。两神成象，则或相生、或相克、欲轻不欲混。暗冲暗合，暗取克我之神，欲虚不欲实。此其大略也。然变局有时似成矣，而竞不成，有时似不成矣，而竞有成，此亦吉藏凶，凶隐吉耳。宁求全毋姑取也。
