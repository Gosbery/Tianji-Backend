- id: mingli-yueyan-ch005-p001
  volume: 选章正文
  chapter_path:
  - 第5章 看命总法一
  sequence: 1
  text: 看命大法，不过生克扶抑而已。列下四柱，先看日干是何五行；随看月支，或是生我克我，或是我生我克。如月支本气透于天干，寅透甲，午透丁，即取为格，系正官、食神、偏财、偏印，则宜生之助之；系偏官、伤官，则宜制之化之。若本气未透遭克，则寅不用甲，而用所藏之丙戊；午不用丁而用所藏之己。若所藏之神，又不通遭克则不用月支，而用别干之势盛力旺者为格。其禄刃比劫，无论在干在支，均不以取格，但用为日干之助耳。总之以日干与财官等较其强弱，强者抑之，弱者扶之，不能扶抑者，以运扶抑之，其必不可扶者则弃之，必不可抑者则顺之。惟合化格、一气两神格、暗冲暗合格，不在此例。总之钱而易见者小，清而难测者大，清而有神者贵，浊而无气者贱，纯粹中和者贵而安，奇怪偏驳者贵而危。或谓太平之世取正，有事之秋取奇，余尝阅古今之命数万，承平安乐，尽多七煞伤官，开创经纶，不少正官正印，特奇正之命，世多世少，气运偶然。非奇者生太平之世必无用，正者生有事之世必不贵也。
