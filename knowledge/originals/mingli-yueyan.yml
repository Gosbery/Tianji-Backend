  - 第57章 格局赋
  sequence: 55
  text: 总纲既定，格局宜详，月令所得何支，依之取断，柱神所有何类，参以酌量。偏正不必甚分者，曰财星，曰印绶。阴阳必应各取者，曰官煞，曰食神。月遇禄神，未可推为领袖，月逢刃曜，又何取此凶狂。格从司令而来（司令即月令），此实以经顺理。格由他神而取，盖为舍弱用强，（详参卷一，看命总法。）。逢官看煞，逢煞看印为要（用官最忌煞混，故必需看七煞何如。用煞最忌身衰，故必须看印煞何如。）。用财畏劫，用食畏枭是其常（劫能夺财，枭能夺食，故畏。）。若全局无官星可言，则暗格亦取，或日主配他干而变，则化局可商。其余外格多端，半皆诞妄，更有纳音诸法，益以咣洋。总之先定何格以推，则喜忌自见，随取何神为用，则休咎弥章。或止恃一神，始终相托，或兼求他用，变化无方。至于气象茫茫，论格既无可取，神情泛泛，言用亦无足当，此则深求反凿，浅论为长。
