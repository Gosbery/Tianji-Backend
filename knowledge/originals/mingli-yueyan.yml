- id: mingli-yueyan-ch046-p001
  volume: 选章正文
  chapter_path:
  - 第46章 看富贵吉寿贫贱凶夭总法
  sequence: 51
  text: 术家看命，必取何局为贵，何局为富，何局为吉，何局为寿，以及何局为贫贱凶夭，此未尝悖理也。然往往有验，有不验，是有故也，局当贵而得富，局当富而得贵，富贵之美一也，足以相准矣。局当贱而得贫，局当贫而得贱，贫贱之不美一也，足以相准矣。不宁惟是，吉寿富贵，可相准也。凶夭贫贱，可相准也。富贵而凶夭，贫贱而吉寿，可相准也。故今统富贵吉寿，列上局六十，统贫贱列下局六十，人命合上局多者备美，少者次之。合下局多者穷凶，少者次之。虽然泛而无定如此，何取惟命乎？法当取上下诸局，融会贯通于胸中，而证以古人之命，学以今人之命，则相准之故彻，而有定之理出矣。即分孰富贵，孰吉寿，孰贫贱，孰凶夭，亦无不可耳。
