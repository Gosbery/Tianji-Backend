  - 第49章 看富贵吉寿贫贱凶夭要法
  sequence: 52
  text: 看富贵吉寿贫贱凶夭诸局，相准之故即彻，有定之理既得矣。然以人命不尽然，是有己身之善恶焉，有家世之善恶焉，福善祸淫，必然之理。如为恶之人，命应一品之贵，而减至四五品。命应百万之富，而减至六七十万。命应百岁之寿，而减至六七十岁。命应五福全备，而减至一二。又如为善之人，命应极贱，而得一命之荣。命应极贫，而得中人之产。命应早世，而得数十岁之寿。命应诸凶必集，而免其二三。世俗之见，将为恶者，何尝不福，为善者，何尝不祸，岂知福之易损，祸之己减乎？知祸福者，非知命者也。知善恶之为祸福者，则诚知命耳。虽然，徒知之何益，是有转移之道焉？昔袁了凡先生，，遇术士推命，止于贡士而无子，因详列将来履历，始则一一神验。后遇高僧，导以造命之学，积以若干善求科第，积若干善求子息，善数既积，果登两榜而举子。术士所推，毫不验矣。故凡欲求富贵吉寿，而免贫贱凶夭者，当以积善为要。每日自记功过，必期念念皆仁，事事皆善，久必如其所愿。若恃命之善，而敢于为恶，咎命之薄，而不思挽回，此为天下至愚之人，无志之士矣。诸命法皆末耳，是乃要法也。
