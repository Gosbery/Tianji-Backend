  - 第21章 看偏官法
  sequence: 42
  text: 看煞之法，先论日干强弱，日干强，则一点煞星亦可不制，日干弱，则不问煞之多寡，必须制之。再看煞星得时得势否，当令而又透干，为煞旺，次则或当令而不透干，或不当令而干煞通支，支煞通干，又次则干有支无，支有干无。制之用食伤，食较有力，合之用刃劫，刃较有势，化之用印，偏正同功。煞太旺则制化两用，但须食神配正印，则不相战也。或食伤配正印，干支俱异，各有理会，不相战也。若刃劫合煞，引日不如阳日，盖甲用卯中之乙合庚，乃卯之本气，乙用寅中之丙合辛，视本气有间矣；甲用乙合庚，庚贪合则忘煞，乙用甲只能帮身，视合煞又有间矣，故阴日以制化为急。若煞星太弱，宜财神姿之，制神太过，宜印破之。至煞星太强而无制，日主太弱而无根，宜弃命从之，总之日干能任财煞为要。苟日干衰绝，又不能从煞，即有制有化，岁运财煞旺地，必成灾祸。徜更有制无化，岁运财煞旺地，无不危亡。若身煞两停，行运宁可扶身。古云：煞不离印，印不离煞。又云：印无煞不显，煞无刃不威。盖印所以生日主，刃所以护日主，虽不言扶身，而扶身在其中矣。又有煞强于主，行煞云反利者，此必日主本非衰绝，而原局印绶成像有力，煞生印，印生身也，惟忌行财运，坏印助煞，则必为祸矣。
