- id: mingli-yueyan-ch026-p001
  volume: 选章正文
  chapter_path:
  - 第26章 看偏正财法
  sequence: 45
  text: 看财之法，不论正偏，只取得时得势，适当月令而有气为得时，不当月令而成象为得势。然看日干强弱为要，日干强，则当扶财，日干弱，则当扶日。旧云逢财看官者，不尽然，凡我克我生，一件入格得气，皆可取贵，但恐只此一件，便是滞物，故财与食伤，又欲其辗转生化，非必以生出克我为贵也。每见用财之命，或财轻而行生财之运，或财重而行制财之运，一生不行官煞，往往富贵，但局中运中见官煞，亦其所宜耳。苟财多身弱，又加以官煞，取祸必矣。旧谓正财乃分内之财，遇之非奇，偏财乃众人之财，得之为美，夫不安己之分，而喜取人之物，此贪夫之见耳。特正财能伤正印，偏财能制枭神，然不可因此而贵偏贱正也。旧又有恶露喜藏之说，此亦谬认财为钱币耳。即以钱币论之，源远流长，挥霍岂忧睥睨。力微势弱，扃钥何难劫夺乎？至于财神太旺，而用比劫，盖爱其助主，非取其分财，财神太衰而用食伤，虽籍其生财，亦防其泄主。若财多而强不可制，当弃命从之，行助财运则吉，行夺财助助运则凶。他如时上偏财，时上财库，日时专财，夹财拱财等格，皆多立名目，不若四柱通融取用，较为简当也。
