- id: mingli-yueyan-ch019-p001
  volume: 选章正文
  chapter_path:
  - 第19章 看流年法
  sequence: 40
  text: 自少至老之岁，谓之流年。虽不若大运之重，然于原柱及大运，亦能抑扶，其法合上干下支，先看于原柱干支生克何如，此看与大运干支生克何如，参伍穷究之，柱运喜神相聚，能助吉乎，能损吉乎，柱运忌神交会，能增凶乎，能减凶乎，柱运或有不合和，为解斗乎，为佐斗乎，柱运或有偏胜，为左袒，为右袒乎，虽柱与运之所喜憎，大略相同，然柱运流年三项，干支辗转生克，情理多端，亦有柱喜而运憎者，且一年之中，当令不齐，一支之中，藏神非一，其理甚纷甚细，既须穷精极微，又须从详反约，推断休咎之难，全在此处。果能了于心，则命理思过半矣。
