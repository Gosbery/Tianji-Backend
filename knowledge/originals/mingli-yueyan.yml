- id: mingli-yueyan-ch007-p001
  volume: 选章正文
  chapter_path:
  - 第7章 看格局法
  sequence: 3
  text: 格局有正有变，正者五行之常理也。曰正官，曰偏官，曰印，曰财，曰食神，曰伤官。变者五行之常理，而取用则异矣，曰从，曰化，曰一行得气，曰两神成象，曰暗冲，曰暗合。凡正格未有不相兼者，官煞必兼财印，印财必兼官煞，食伤必兼印财，推之须详，取之须确，变格更宜精审。从化须极真，一行两神须无杂，暗冲暗合须至当，俱勿依稀妄取，开列于左。正官格——兼印曰官印格、兼财曰财官格。
  normalized_text: 格局有正有变，正者五行之常理也。曰正官，曰偏官，曰印，曰财，曰食神，曰伤官。变者五行之常理，而取用则异矣，曰从，曰化，曰一行得气，曰两神成象，曰暗冲，曰暗合。凡正格未有不相兼者，官煞必兼财印，印财必兼官煞，食伤必兼印财，推之须详，取之须确，变格更宜精审。从化须极真，一行两神须无杂，暗冲暗合须至当，俱勿依稀妄取，开列于左。正官格——兼印曰官印格、兼财曰财官格。
