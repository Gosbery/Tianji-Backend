- id: mingli-yueyan-ch027-p001
  volume: 选章正文
  chapter_path:
  - 第27章 看食神法
  sequence: 46
  text: 看食神之法，如用于制煞，则以食煞相较，煞重食轻，当扶食抑煞，食重煞轻，当扶煞抑食。如无煞可制，只以食神取用，或当令有援，或成局有势，皆妙。然须生出财神，或局中有财，或运行财地，方为有用。此神与正官相似，性情和顺，多吉少凶。旧云只要一位，此系不然。假令甲日得丙，而又见巳，乙日得丁，而又见午，斯为更美。即甲日或遇两丙两巳，乙日或遇两丁或遇两午，亦有何碍。所虑者，日主衰弱，不能任之耳。故先看日主强弱为要。身食两旺，可为贵格。然谓食神有气胜于财官，亦一偏之论也。此神最忌枭印可之，得偏财亦不畏。若满局食神日主无气，亦可从之，此乃我生之神，较之从煞则更纯，较从财则更美，勿泥旧勿从例也。或日主太旺，局中无一可倚，只有一二点食神，略成气象，则需顺行食神生旺之运为妙。如食伤相混，用食则宜去伤，用伤不比去食，盖食纯伤驳，犹之官不容煞混，煞不容官混也。至于用食见煞，虽与伤官见官不同，然克伤日主，则任食无力，抗敌食神，则养主少气。惟主多比劫，最喜煞制，主用印绶，反喜煞生耳。否则官宜不宜多见，况煞乎？
