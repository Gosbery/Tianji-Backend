- id: mingli-yueyan-ch029-p001
  volume: 选章正文
  chapter_path:
  - 第29章 看食神法
  sequence: 48
  text: 食神格中有优秀者，曰木火通明，曰金白水清，曰土金育秀，今略举取用之法。木火通明格，以以春三月木日遇火为妙，妙在木旺能任火相，方进也，四月亦取，盖火当令而未燥，但木需得势通根耳。金白水清格，以七八月金日遇水为合，亦妙在金旺水相。水木清奇格，以二月癸日遇乙，及卯木为上。土金育秀格，以八月己日遇辛，及酉金为上，盖卯酉气专而清，但癸与己需得气通根耳。凡合此四格者，皆清贵上命。其喜忌之理，随格详审之。然不特此也，凡日主强旺，喜泄甚于喜克，局中官煞与食伤并见，势均力敌，照常取断。若官煞轻浅，其情恒向食伤，不必当时得令，但透干成象，即可取用，反以官煞为病神矣。术家如此等局面，只泥官煞为用，所以往往不验。是亦所谓六神通变之端，不可不知也。
