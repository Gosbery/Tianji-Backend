  - 第17章 看运法一
  sequence: 38
  text: 旧书谓一运上干下支，分管年数，率谓上下各五年，又有因运重地支之说，或谓上四下六，或谓上三下七，其实皆不然也，盖行运从月见而起，顺行者，行未来之月建，逆行者，行已往之月建，凡月建干支，共管一月之事，无干管上半月，支管下半月之理，乃因以行运，反分裂干支，各管几年，有是理乎？故上干下支共管十年为是。上下比和，上下相生，则其力相同，上克下者，上之力胜于下，下克上者，下之力胜于上，合之命主，上下俱喜，则十年全吉，上下俱忌，则十年全凶，上下一喜一忌，则十年之间，吉凶参半，此理之最确当者。但看上干较易，看下支较难，盖干神甲只是甲，乙只是乙，惟支则各有所藏，须一一研析。如行运寅字，原柱有或甲或丙或戊，当察此运，某干得气，再看上干是甲，则此运纯然是木，上干是丙，则此运大半是火，上干是戊，则此运一般是土，余支仿此。又上下与原柱干支，止论生克，理亦易见，下支则与原柱干支，生克之外，更有相冲、相合、相刑、相害种种道理，未易草率论断也。
