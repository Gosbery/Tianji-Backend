- id: mingli-yueyan-ch009-p001
  volume: 选章正文
  chapter_path:
  - 第9章 看用神法
  sequence: 37
  text: 命以用神为紧要。看用神之法，不过扶抑而已。凡若者宜扶，扶之者即用神也。扶之太过，抑其扶者为用神。扶之不及，扶其扶者为用神。凡强者亦抑，抑之者即用神也。抑之太过，抑其抑者为用神，抑之不及，扶其抑者为用神。如弱扶之以水，水扶太过，制水以土，水扶不及，生水以金。木强抑之以金，金抑太过，制金以火，金抑不及，生金以土。至通类之相助，财气之相姿，亦扶也。生物泄其气，克物煞其势，亦抑也。是故有日主之用神也。有六神之用神焉。六神之互相扶抑者是也。六神之用神即为日主用也，有原局之用神焉。局中本俱之扶抑是也。更有行运之用神焉，运中补足之扶抑是也，行运之用神，即为原用局也。用神无破为吉，有助则更吉，用神有损为凶，无救则更凶。命譬之身，用神譬之身之精神，精神厚则身旺，精神薄则身衰，精神长存则身生，精神坏尽则身死，看命者，看用身而已矣。然取用神之法，虽当专一而不玄眩，宜变通而不拘。如正偏官格，有时制化互用，甚或生制参用，况行运数十年，无俱木俱金之理。尝见大富贵之命不特一神为用，其专恃一神者，乃补偏救弊之命耳。抑更有说焉，有体而后有用，日主六神体也，扶抑日主六神者，用也。苟日主六神或强不可制，或衰不堪扶，或散漫无伦，或战争不定，是则体先不成，用于或有？其为下命决矣。
