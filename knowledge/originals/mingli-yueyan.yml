- id: mingli-yueyan-ch018-p001
  volume: 选章正文
  chapter_path:
  - 第18章 看运法二
  sequence: 39
  text: 初运管少年，中运管中年，未运管晚年，此看运法也。更有旧法可参用者，即以四柱推论，年管少年，月日管中年，时管晚年。若年为喜神，则少年发达，为忌神，则少年处困而不得志，月日为喜神，则中年亨通，为忌神则中年蹇滞，时为喜神，则晚年安荣，为忌神，则晚年零落，此法屡试有然，故附之。然但可约略少旺老之大概而已，若确分年限，详断吉凶，仍当看运为主耳。
