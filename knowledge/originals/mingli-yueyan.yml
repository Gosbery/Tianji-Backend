  - 第41章 看六亲法二
  sequence: 50
  text: 看六亲之法，旧以年为祖上，月为父母，日支为妻，时为子息，同类为兄弟，此立法之有理者。如吉神居年则祖上荣显，亦主受祖上之阴；凶神居年，则祖上寒薄，亦主不受祖上之阴。如吉神居月，则父母贵盛，主受父母之阴；凶神居月，则父母衰残，亦主不受父母之阴。如吉神居日支，则妻室皆老，主受妻室之力，；凶神居日支，则妻室丧亡，主不得妻室之力。如吉神居时，则子息繁衍，主得子息之力；凶神居时，则子息凋零，主不得子息之力。若兄弟则无定位，但看同类为吉神，则兄弟繁昌，主得兄弟之力；同类为凶神，则兄弟衰寡，亦主不得兄弟之力。此法虽难尽拘，然大概不远，与前法参看可也。若旧书更有以月为兄弟者，夫月尊于日，兄弟安能当之？柱无兄弟，犹之干无妻位，岂可强乎？
