- id: mingli-yueyan-ch058-p001
  volume: 选章正文
  chapter_path:
  - 第58章 行运赋
  sequence: 56
  text: 格局既分，荣枯之分已具，运途参考，否泰之理斯完，从生月而推，递行前月后月之建，以男女为别，乃分顺行逆行之端，男生阳年，女生阴年，则以未来取用。男生阴年女生阳岁，则从已往详观。计生辰之离节，凡有几日，知人命之交运，应在何年。一日则为四月，虽片时而必扣，三日为一岁。苟缺月而勿宽。一运管十年，荣枯有准，五行配四柱，休戚相连，宜与不宜，全凭格局，利与不利，但问日干，破格者，值之为戚，助格者，遇之为欢。日弱扶之而气盛，日强抑之而美全。旺日复到旺乡，必罹悔吝。衰日再行衰地，定主摧残。吉若财官印食，喜于相见（行运中固喜见财官印食，然亦需看日主之气势何如，能否应付。）。凶若刑冲枭劫，多主不安（行运中固忌刑冲枭劫，然果日主气势有余，应分四项而论，非枭与劫，逢刑冲也。）。但吉而无情，亦难吉论，苟凶而有余，不作吉论。运重支，然须合干神兼论。运虽忌岁，亦难上下截看。火若在天，下有水流而减曜。金于处地，上逢火灼而失坚。木火同来，十年并暖。水金相济，一运皆寒。（所谓一运者，一干一支是也，虽不能截断分论，然果干害支，支害干，其吉凶之力，未尝不减轻，干助支，亦未尝不加重耳。）取神煞以评，实在干支而较缓。谓交接必咎，岂行运福利而亦然（俗谓交运脱运之际）。然凶运既去为殃，是离任之官，犹能行令。言吉运未来作福，将候选之职，遂可操权。（凶运既去，自无祸害，吉运未来，安有瑞祥）。命吉运凶，若良马坚车，阻险道而难进。命凶运吉，若破帆敝楫，乘顺风而亦前。行运此大略，通变难以言宣。
