  sequence: 47
  text: 看伤官之法，不当月令，而局成他格，些小伤官为害，则去之，不为害则置之。虽当月令，而用以敌煞，当从煞格推究。惟局中无足取用，而伤官或当令有援，或党众有势，则用之。虽不得令得势，而日主旺甚无倚，止一二点伤官略成气象，则亦用之。用之者何？以其亦我所生，虽不如食神之纯粹，亦我之精气流通，英华发外，亦可取也。然比生出财神方为有用，否则顽而不灵，徒泄我气耳。用伤官大法，日主强健则喜财，日主衰弱则喜印，财印俱正俱偏，则恐其相争，财印一正一偏，则不嫌并露，然亦看全局理气及财印情势。有俱正俱偏而相安者，有一正一偏而相戾者，此在舒配之妙。若必如旧书所云，用财去印，用印去财，则太拘矣。旧又有以当令为真伤官，不当令为假伤官，夫以不当令而为之假，则不当令之官煞，为假官煞乎？不当令之财印食神为假财印食神乎？不知伤官无论真假，当论强弱，强则制之，伤官强而复行伤运，则日愈泄气矣。弱则复之。伤官弱而复行破伤，则日主愈无倚矣。制伤之法，印运为上，帮身次之。扶上之法，伤食运为上，比劫次之。若伤官不喜见官，正如先有比劫而见财，先有枭神而见食，必为患害。旧书譬之殴伤官长而又见官，官必不恕，则鉴矣。又为伤官伤尽，反喜见官，将劫财劫尽，反喜见财，夺食夺尽，反喜见食矣。然官亦有可见者，身弱伤强而有印绶，可以见官，官生印绶，则身能任伤也。身强财弱而有比劫，可以见官，官制比劫，则财不受夺也。否则皆不可见官，见之非惟取伤之害，而日主受克，亦不能任伤为用。次必仍行伤运克之为妙，次则食运亦可。若伤官伤尽不见官，似乎如格，而乃贫贱者，必无财之故耳。旧分五行孰可见官，孰不可见官，支离无理，关于伤官赋中，至于见煞虽非见官之比，然无印无比而见煞，则亦克主而不能任伤，不可不去。若阳刃甚有益于伤官，以其助主生伤，又能合煞也。至于日主无气，满局皆伤，当弃命从之，反倚凶神为用，行运忌坏伤相主，又未可以伤多不宜为论矣。
