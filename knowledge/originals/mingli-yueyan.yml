- id: mingli-yueyan-ch040-p001
  volume: 选章正文
  chapter_path:
  - 第40章 看六亲法一
  sequence: 49
  text: 旧取正印生我为母，偏财克正印为父，我所克之财为妻，财所生之官煞为子。命家封为定法，实则悖戾多端，请一一论之。人由父母共生，止以正印属母，岂母能独生耳？其悖戾一也。偏财故正印之配，然财乃我之所克，安能生我？其悖戾二也。夫有制妻之道，子无制父之理，偏财系我所克，是为子制父，其悖戾三也。财为妻财，又可为父，是翁与妇共矣，其悖戾四也。子与夫妻共有，至取财生官煞，将妻能独生焉，其悖戾五也。官煞克我之神，岂肯为我之子，其悖戾六也。为人子则制父为人父又受制于子，可谓聚逆矣，其悖逆七也。父之与母，既以克取，儿之于妇，亦应以克推，官煞克者即日主，是又妇与翁共矣，其悖逆八矣。为日之父者，则为日生者之祖，为日之子者，则为日生之孙，偏财实生官煞，是孙从祖生？其悖戾九也。考其凭据，不过日有夫妇然后有父子，若依夫妇父子之例，辗转推之，三党男女，错综无极，其悖戾十也。今定男以印为父母，食神伤官为子，我克之财为妻，女以印为父母翁姑，食神伤官为子，克我之官煞为夫。印不论偏正，但不遭冲克，则父母俱全，扶抑合宜，则父母双寿，更带贵气，则父母荣显。食神伤官不遭冲克，则有子，扶抑合宜，则多子，更带贵气，则有贵子。财不遭劫夺，官煞不遭冲克，则夫妻皆老，扶抑合宜，则夫妻贤淑，更带贵气，则夫显妻荣。反是则父母或不全或不贵，子或无或少或有而不肖，夫妻或克或不贤不显，此宜得其大略耳。人命常有无印而父母贵寿者矣，无食神伤官而子息繁昌者矣，无财官煞而夫妻安荣者矣。但就日主及全局观之，知其有无根气，则知其父母，知其有无生气则知其子息，知其有无和气则知其夫妻。即显露财印官煞食伤亦须以此意消息之。总之中和完好者，家门必多福庆，偏枯缺陷者，骨肉不免刑伤，此自然之理也，若兄弟但看同类干支气势如何，纯美者多或贵，亏损者或寡或贱，和洽者得力，偏驳者相乖，如无同类干支，即看日主气势如何，或生扶有情，或孤干无辅，可以知其兄弟矣。
