  - 第25章 看正偏印法
  sequence: 43
  text: 旧书取印。喜正忌偏，此只论天干耳，若地支仿此推之，五阳干遇寅申巳亥为枭，遇子午卯酉为败，五阴干遇子午卯酉为枭，遇寅申巳亥为死，则地支竞无印可取矣，不之五阳干遇寅申巳亥是生印，非枭也，遇子午卯酉是正印，非败也，五阴干遇寅申巳亥，亦正印，非死也，惟遇子午卯酉为偏印，然子为乙贵，午为己禄，何可以枭论乎？大抵印不论正偏，但当月令而取之为格，必不可伤，即不当月令而倚之为用，尤不可伤，在局在运皆然。术家往往重财官而轻印，不知印被伤，与官被克，财被劫相同。其有时而轻者，局偶不用印也，若局用印，而无显印，则暗印宜可取。或木日取申中之壬，辰丑中之癸；或火日取亥中之甲，辰未中之乙，此需二三处有之，仿可取用。行运透出为吉，克坏为凶。仅止一点，亦不济事。总之局印太轻，须以官煞运生之，局印太多须以财运制之。若太多而强不可制，竞为下命。盖印乃生我之神，忌无弃命从印之法，又无比劫泄印之法。至于枭印克食，惟枭食两透于干，祸并见于支，而无制无化则忌。苟制化得宜，或干支异处，则亦不忌。又旧忌印行死地，亦不尽然，盖所贵乎印者，以扶其身耳，印之病死，即身之禄旺，何害之有？若但取印旺，则印之禄旺，即官之死绝，何利之有乎。
