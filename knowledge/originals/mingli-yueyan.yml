- id: mingli-yueyan-ch006-p001
  volume: 选章正文
  chapter_path:
  - 第6章 看命总法二
  sequence: 2
  text: 推命先看日干，或得时，或失时，或得势，或失势。下坐某支，紧贴某干，于日干生克扶抑何如。随看余三干及四支，于日干生克扶抑何如，此恒法也。然不特日干而已，凡主中干支皆当如此研究，如看年干，先看得时得势否？下坐扶抑何如？月干时干亦然。又看年支，先看得时得势否？上载何干紧贴何支？于年支生克扶抑何如？随看余三支四干，于年支生克扶抑何如？月支时支亦然。如此一一研究的确，然后用之为官煞，为财印，为食伤，其是强是弱，当用当舍，自然精当无差，洞彻不惑矣。此看命第一要诀也。
  normalized_text: 推命先看日干，或得时，或失时，或得势，或失势。下坐某支，紧贴某干，于日干生克扶抑何如。随看余三干及四支，于日干生克扶抑何如，此恒法也。然不特日干而已，凡主中干支皆当如此研究，如看年干，先看得时得势否？下坐扶抑何如？月干时干亦然。又看年支，先看得时得势否？上载何干紧贴何支？于年支生克扶抑何如？随看余三支四干，于年支生克扶抑何如？月支时支亦然。如此一一研究的确，然后用之为官煞，为财印，为食伤，其是强是弱，当用当舍，自然精当无差，洞彻不惑矣。此看命第一要诀也。
