  - 第51章 看性情法
  sequence: 53
  text: 旧分五行抡人性情。此不可拘。如木主仁寿慈，然有成局入格之木而不仁者矣。金主肃杀，然又有得时乘势之金而不杀者矣。须先看柱中神情气势，或正大，或光显，或纯厚，或英发，皆贤人也。或偏驳，或晦昧，或刚戾，或卑琐，皆不贤人也。又看取格取用，或中正显白，无所贪恋包藏，或奇巧隐曲，多所牵合攘取，则性情大端可睹矣。然后以五行推之，深见其肺腑，浅则得其梗概。其又始正而终邪者，始驳而终粹者，则行运使然耳。至于二德多善，贵人多贤，空亡多虚，劫煞多暴，理之所有。然执一端取断，断不验也。
