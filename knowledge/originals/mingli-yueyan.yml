  text: 大运司十载之休咎，流年管一岁之穷通。岁干如君，固应从重，岁支为辅，实则同功。先观岁与日干，或为利，或为害，此详岁与大运，或为顺，或相攻，或问其有无会合，考其宜否刑冲。大抵命之所喜者，自非运所忌见，命之所恶者，亦非运所乐逢。岁与运战争，须凭原局之中，有神救解，岁与运和睦，若系主干之吉，加倍兴隆。或谓犯岁而致灾必重，或谓合岁而引悔成凶，夫犯必日之财官，非正即偏，有何不利？合必日助之正配，非官即财，正喜相逢，惟衰官不任财官，反罹其祸，非太岁每逢克合，必害厥躬（凡日干犯太岁者，如甲见戊，乙见己之类，皆为偏财。太岁合日干者，如甲见己，乙见庚之类，非正财即正官，倘日主气势有余，得此反主奋发）。先遇是物而安，后遇是物而危，由运途亨蹇之异。初见斯神而喜，复见斯神而畏，因岁建上下不同。上来降祥，而为支所生，则弥增福力，下欲逞虐，而受干之制，则半减凶锋（流年干支，固不能截断分论，然以上半年属干，下半年属支。然果岁干为喜神，而又得岁支生之，未倘不可弥增福力。岁支为忌神，得岁干制之，未尝不可半减凶锋）。木若司年，至金月而阴浅。水如禀岁，涉冬令而波洪。岁运并临，灾祥庚大。干支同类，势力尤雄。煞年而局食先强，岂能相难。（日主虽衰，而原柱食神得势，即岁逢七煞，亦不为害，盖食先煞后，食可制煞也。）。劫岁而运财方盛，亦止得中（运行财地，其财方盛，虽遇劫财流年，亦不至损失。）。举此为例，其类可充。至本年每月之吉凶，仿此推究，若逐岁小运之谬妄，不必研穷。
