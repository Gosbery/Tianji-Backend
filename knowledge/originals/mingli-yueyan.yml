  - 第52章 看疾病法
  sequence: 54
  text: 旧分五行，论人疾病，未尝不合于理。但人身脏腑经络，五行具全，人命柱中运中，五行未必全备，必以某行断其病，亦不尽然。须看日主及所用格局，或朗健，或中和，或平顺，皆无疾病之命。或晦弱，或驳杂，或乖戾，皆有疾病之命也。又看其神理气势，或太过或不及，兼取柱中运中五行参合论之。即无木而就生木，克木，木生，木克之神，亦可推木之受病否。至于干支配头目手足等项，皆当以意消息之，弱必取诸病而拟议之，则名医所论。孰非五行，空须摘取医书数十百种，列于命书矣。
