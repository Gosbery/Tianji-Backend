- id: mingli-yueyan-ch020-p001
  volume: 选章正文
  chapter_path:
  - 第20章 看正官法
  sequence: 41
  text: 看官之法，先论日干强弱。日干强则当扶官，日干若，则当扶日，再看官星得时得势与否，适当月令，又透天干为上。如甲生酉月，天干透辛，乙生申月，天干透庚是也。次则或当月令而不透干，或不当月令而干官通支，支官通干，又次。则干有支无，支有干无，皆需财以生之，则官之根茂。印以卫之，则伤官之害远，必须正财配偏印，偏财配正印，则财印不相战，或财在干，印在支，或印在干，财在支，虽皆正皆偏，各有理会，亦不相战也。若官星太多，亦需食伤制之，然不作煞论。切忌有二：一曰冲破，一曰伤官。须忌有三：一曰食众暗损，一曰印众泄气，一曰时归死绝。大抵官之强旺者，遇次五忌，但减贵气；官之衰弱者，遇次五忌，则坏矣。至于逢官看财，虽一定之理，然官衰依财，以多为贵，官旺亦不甚依财，略见已足。行运之法，俱与看官法相同。总之日干能任财官为要，苟日干太衰太旺，运局中又无生克扶抑，即财官俱有，亦不免贫贱。古云小人命内，亦有正气官星，盖坐是耳。至于日主无气，满局皆官，当弃命从之，与从煞同法，然自是从官，非官多作煞也。若神峰张楠年时虚官可用，月令官星必无可用之理，此偏激之见，不足深信。又旧书有官不见官之说，谓甲日见丙辛，则甲得辛为官，辛又得丙为官此乃节外生枝，不足信也。
