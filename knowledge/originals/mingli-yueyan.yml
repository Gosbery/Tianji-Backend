  - 第91章 太岁论
  sequence: 58
  text: 旧称太岁为诸煞之首，夫太岁至尊，非煞也。特诸煞皆从太岁干支而起耳，凡流年太岁，原柱干支，以之扶抑，大运干支以之参赞。或干支具为柱运之福，或干支具为柱运之害，或干为福，支为害，或干为害，支为福，此项须合看而深察之。旧书往往独取天干，尝考历载每年太岁，甲子年则曰太岁在甲子，未尝之言太岁在甲也。及列年神方位之图，子下有太岁字，甲下无太岁字，奈何详干略支耶。旧书又以日干可克岁为犯，日干合岁为晦，并主凶咎，此一偏之见，流年赋中，已辩之矣。若征太岁之说，尤为不经，夫征者，上伐下也，太岁命中之君，可言征也。惟阳岁干克阴日干，而岁支又冲日支，是为天克地冲，间有不利耳。
