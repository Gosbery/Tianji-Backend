- id: annotation-yuanhai-ziping-ch079-original_note001
  title: 《渊海子平》论偏官即七杀·眉批
  kind: commentary
  content: 眉批：甲见庚为偏官，乙见辛为偏官，丙见壬为偏官，丁见癸为偏官，戊见甲为偏官，己见乙为偏官，庚见丙为偏官，辛见丁为偏官，壬见戊为偏官，癸见己为偏官。七杀者，甲至庚为七数，庚克甲为杀，故曰七杀，五行同此。诀曰，若有制伏化其杀，身旺文章有必发，君若同来合有情，功名成就百千强。诀曰，偏官偏印最难明，上下相生有利名，四库坐财直向贵，等闲平步出公卿。此论偏印相生，功名显达，如有刃身旺主权贵。
