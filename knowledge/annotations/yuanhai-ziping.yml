  title: 《渊海子平》论起大运法·眉批
  kind: commentary
  content: 眉批：如初一日午时生，若卯时立春，便作正月；若寅时生，未还交节，作上提十二月节推命。如正月初一子时生，上四刻仍作上年十二月，夜子时生下四刻方作正月初一子时推正，谓神仙难断夜子时。
