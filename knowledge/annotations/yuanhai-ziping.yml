  title: 《渊海子平》论大运·眉批
  kind: commentary
  content: 眉批：看命宜精详强弱观之，所谓以年为根，以月为苗，以日为花，以时为实，实能结果者之谓也，亦能一生喻之。用神者，月中所藏之字，如子宫取癸水之类。转角交运如同接木，倘接木者犹忌大风摇动，则损其根枝必断折，宜护持之可也。行运比之，若遇恶杀或流年相克亦主凶。假如寅交卯、卯交辰，此乃东方一气，谓之移花，虽遇风雨亦不折之，以命比之，虽以恶星相克亦不伤命。若遇运气好，东松柏茂西倾秀，南园花盛北园成。若运气不好，则曰接木不移花，主凶。
