- id: annotation-yuanhai-ziping-ch077-original_note001
  title: 《渊海子平》正官论·眉批
  kind: commentary
  content: 眉批：甲见辛为正官，乙见庚为正官，丙见癸为正官，丁见壬为正官，戊见乙为正官，己见甲为正官，以下仿此。年为君，月为五行君之令，谓之月令。正官无印乃非真官，故喜身旺财旺。“巳酉丑金局”，《四言独步》云，八月官星、大忌卯丁、卯丁克破、有情无情。诀曰，正气官星只用支，更详财气到年时，若还四支无冲破，富贵双全折桂枝。
