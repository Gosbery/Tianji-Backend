- id: annotation-yuanhai-ziping-ch065-original_note001
  title: 《渊海子平》论日为主·眉批
  kind: commentary
  content: 眉批：见杀宜身旺，用在杀主亨强，日主绰美。财者养命之源，印为生我之母。伤官食神我生之子，盗母气。甲见己为财，乙见甲为劫财，以强淩弱之故。以日为主，如人之己身。年干为祖、支为祖母，月干为父、支为母及兄弟也，日干为己、身支为妻身，时干为子、支为女。论命论人则贵贱有克制论之。
