- id: annotation-ditiansui-ch023-original_note001
  title: 《滴天髓阐微》官杀·原注
  kind: commentary
  content: 【原注】杀即官也，同流共派者可混也；官非杀也，各立门墙者，不可混也。杀重矣，官从之，非混也；官轻矣，杀助之，非混也。败财与比肩双至者，杀可使官混也；比肩与劫财两遇者，官可使杀混也。一官而不有生印者，杀助之，非混也；一杀而遇食伤者，官助之，非混也。势在于官，官有根，杀之情依乎官；依官之杀，岁助之而混官，不可也。势在于杀，杀有权，官之势依乎杀；依杀之官，岁扶之而混杀，不可也。藏官露杀，干神助杀，合官留杀，皆成杀气，勿使官混也；藏杀露官，干神助官，合杀留官，皆从官象，不可使杀混也。
