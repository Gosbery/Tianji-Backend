- id: annotation-ditiansui-ch009-original_note011
  title: 《滴天髓阐微》天干·原注
  kind: commentary
  content: 【原注】丁干属阴，火性虽阴，柔而得其中矣。外柔顺而内文明，内性岂不昭融乎？乙非丁之嫡母也，乙畏辛而辛抱之，不若丙抱甲而反能焚甲木也，不若乙抱丁而反能晦丁火也，其孝异乎人矣。壬为丁之正君也，壬畏戊而丁合之，外则抚恤戊土，能使戊土不欺壬也，内则暗化木神，而使戊土不敢抗乎壬也，其忠异乎人矣。生于秋冬，得一甲木，则倚之不灭，而焰至无穷也，故曰可秋可冬。皆柔之道也。
