- id: annotation-ditiansui-ch040-ren_commentary002
  title: 《滴天髓阐微》兄弟·任铁樵注
  kind: commentary
  content: 【任氏曰】；比肩为兄，败财为弟，禄刃亦同此论。如杀旺无食，杀重无印，得败财合杀，必得弟力；杀旺食轻，印弱逢财，得比肩敌杀，必得兄力；杀旺食轻，印弱逢财，得比肩敌杀，必得兄财轻劫重，印绶制伤，不免司马之忧；财官失势，劫刃肆逞，周公之虑。财生杀党，比劫帮峰，大被可以同眠；杀重无印，主衰伤伏，鸽原料能无兴叹。杀旺印伏，比肩无气，弟虽敬而史必衰；官旺印轻，财星得气，兄虽爱而弟无成。日主虽衰，印旺月提，兄弟成群；身旺逢枭，劫重无官，独自主持，财轻劫重，食伤化劫，可无斗粟尺布之谣；财轻遇劫。官得明显，不作煮豆燃萁之咏。枭比重逢，财轻杀伏，未免折翎之悲啼；主衰有印，财星逢劫，反许棠棣之竞秀。不论提纲之喜忌，全赁日主之爱憎，审察宜精，断。
