- id: annotation-ditiansui-ch009-original_note003
  title: 《滴天髓阐微》天干·原注
  kind: commentary
  content: 【原注】五阳得阳之气，即能成乎阳刚之势，不畏财杀之势；五阴得阴之气，即能成乎阴顺之义，故木盛则从木，火盛则从火，土盛则从土，金盛则从金，水盛则从水。于情义之所在者，见其势衰，则忌之矣，盖妇人之情也。如此，若得气顺理正者，亦未必从势而忘义，虽从亦必正矣。
