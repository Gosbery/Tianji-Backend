- id: annotation-ditiansui-ch014-ren_commentary004
  title: 《滴天髓阐微》八格·任铁樵注
  kind: commentary
  content: '【任氏曰】：

    影响遥系者，即暗冲暗合之格也。俗书所谓飞天禄马是也。如丙午日支全三午，癸酉日支三酉，逢三则冲，午去暗冲子水为官，酉去暗合辰土为官。尚有冲财合财，如壬子日支全三子，暗冲午火为财，乙卯日支三卯，暗合戌土为财。又云，先要四柱不要财官，为真方可冲合。夫冲者，散也，合者，化也，何能为我用乎？四柱原有财官，不宜冲合，尚有喜与不喜，何况四柱无财官乎？至于杂气财官，亦是画蛇添足。辰戌丑未，无非支藏三干，各为杂气；寅申巳亥，亦有三干，何故不论？夫库中余气，可以言格，生地之神，莫非反弃？又云杂气财官喜冲，尤为穿凿。若甲木生丑月，为杂气财官，喜未冲之，未中丁火，紧伤丑中辛金之官，格乃破矣，余支皆然，不若透出天干取格为是。

    诸书所载，禄分四种，年为背禄，月为建禄，日为专禄，时为归禄。又云建禄喜官，归禄忌官，则又遗背禄专禄矣，又云日禄归时没官星，号为青去得路，诚如所论，则丙辛两日生人，逢癸巳丁酉时者，世无读书出仕者乎？无非日干旺地之比肩也，不可认作食禄为王家之格言，则四柱神，竟同亲刻，既柱中之禄为美，何得运逢禄支反为禄堂而家破人亡乎？命彻底根源，则穷通寿夭，自不爽矣。大凡格局真实而纯粹者，百无一二，破坏而杂气者，十有八九，无格可取者甚多，无用可寻者不少。格正用真，行运不悖，名利自如；格破用损，谓这有病，忧多乐少。倘行运得所，去其破损之物，扶其喜用之神，譬如人染沉疴，得良剂以生也，不贵亦富。无格可取，无用可寻，只可看其大势，与日主之所向，运途能补其所喜，去其所忌，虽碌碌营生，可免饥寒之患。若行运又无可取，则不贫亦贱；若格正用真，五行反悖，一生有志难伸矣。'
