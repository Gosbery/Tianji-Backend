  title: 《滴天髓阐微》天干·原注
  kind: commentary
  content: 【原注】纯阳之木，参天雄壮。火者木之子也，旺木得火而愈敷荣。生于春则欺金，而不能容金也；生于秋则助金，而不能容土也。寅午戌，丙丁多见而坐辰，则能归；申子辰，壬癸多见而坐寅，则能纳。使土气不干，水气不消，则能长生矣。
