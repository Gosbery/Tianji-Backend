- id: annotation-ditiansui-ch063-ren_commentary008
  title: 《滴天髓阐微》地位·任铁樵注
  kind: commentary
  content: '【任氏曰】：

    命者，天地阳阳五行之所钟也，清者贵也，浊者贱也。所以杂职佐二等官，亦膺一命之荣，虽非格正局清，真神得用，而气象格局之中，冲合理气之内，必有一点清气，虽清浊气之形影难辨，总不外处天清地浊之理。天干象天，地支象地。地支上升于天干者，轻清之气也；天干下降于地支者，重浊之气也。天干之气本清，不忌浊也；地支之气本浊，必要清也，此命理之贵乎变通也。天干浊，地支清者贵；地支浊，天干清者贱也。地支之气上升者影也，天干之气下降者形也，于升降形影，冲合制化中，分其清浊，究其轻重，论其尊卑可也。'
