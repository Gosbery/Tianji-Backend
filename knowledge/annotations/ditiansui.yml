- id: annotation-ditiansui-ch009-original_note009
  title: 《滴天髓阐微》天干·原注
  kind: commentary
  content: 【原注】火阳精也，丙火灼阳之至，故猛烈，不畏秋而欺霜，不畏冬而晦雪。庚金虽顽，力能煅之，辛金本柔，合而反弱。土其子也，见戊己多而成慈爱之德；水其君也，遇壬癸旺而显忠节之风。至于未遂炎上之性，而遇寅午戌三位者，露甲木则燥而焚灭也。
