- id: annotation-ditiansui-ch009-original_note007
  title: 《滴天髓阐微》天干·原注
  kind: commentary
  content: 【原注】乙木者，生于春如桃李，夏如禾稼，秋如桐桂，冬如奇葩。坐丑未能制柔土，如割宰羊、解割牛然，只要有一丙丁，则虽生申酉之月，亦不胃之；生于子月，而又壬癸发透者，则虽坐午，亦能发生。故益知坐丑未月之为美。甲与寅字多见，弟从兄义，譬之藤萝附乔木，不畏斫伐也。
