- id: annotation-ditiansui-ch019-original_note001
  title: 《滴天髓阐微》衰旺·原注
  kind: commentary
  content: 【原注】旺则宜泄宜伤，衰则喜帮喜助，子平之理也。然旺中有衰者存，不可损也；衰中有旺者存，不可益也。旺之可损，以损在其中矣；衰之极者不可所当损者而损之，反凶；实所当益者而益之，反害，此真机，皆能知之，又何难于详察三微奥乎？
