- id: annotation-ditiansui-ch061-ren_commentary002
  title: 《滴天髓阐微》疾病·任铁樵注
  kind: commentary
  content: '【任氏曰】：

    五行在天为五气青、赤、黄、白、黑也；在地为五行，木、火、土、金、水也；在人为五脏，肚、心、脾、肺、肾也。人为万物之灵，得、五行之全，表于头面，象天之五敢，裹于脏腑，象地之五行，故为一小天地也，是以脏腑各酏五地之服阳而属焉，凡一脏配一腑，腑皆属阳，故为甲、丙、戊、庚、壬；脏皆属阴，故为乙、丁、己、辛、癸。或不和，或太过不及，则病有风、热、湿、燥、寒之症矣。必得五味调和，亦有可解者。五味者，酸、苦、甘、辛、咸也。酸者属木，多食伤筋；苦者属火，多食伤骨；甘者属土，多食伤肉；辛者属金，多食伤气：咸者属水，多食伤血，比五味之相克也。故曰“五行和者，一世无灾”。不特八字五行宜和，即脏腑五行，亦宜和也。八字五行之和，以岁运和之；脏腑五行之和，以五味和之。和者，解之意也。若五地和，五味调，而灾病无矣。故五行之和，非生而不克，全而不缺为和也，其要贵在泄其旺神，泻其有余，有余之旺神泻，不足之弱神受益矣，此之谓和也。若强制旺神，寡不敌众，触怒其性，旺神不能损，弱神反家伤矣。是以旺神太过者宜泄，不太过宜克；弱神有根者宜扶，无根者反宜伤之。凡八字须得一神有力，制化合宜，主一世无灾。非全而不缺为美，生而不克为和也。'
