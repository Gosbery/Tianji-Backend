- id: annotation-ditiansui-ch063-ren_commentary004
  title: 《滴天髓阐微》地位·任铁樵注
  kind: commentary
  content: '【任氏曰】：

    掌生杀大权，兵刑重任者，其精神清气，自然超特，必以刃旺敌杀，气势出人也。局中杀旺无财，印绶用刃者，或无印而有羊刃者，此谓杀刃神清也。气势特者，刃旺当权也，必文官而掌生杀之任。刃旺者，如春之甲用卯刃，乙用寅刃；夏之丙用午刃丁用巳刃，秋之庚用酉刃，辛用申刃，冬之用子刃，癸用亥刃是也。若刃旺敌杀，局中无食神印绶，而有财官者，气势虽特，神气不清，乃武将之命也。如刃不当权，虽能敌杀，不但不能掌兵权，亦不能贵显也。其人疾恶太严，如刃旺杀弱亦然，必傲物而骄慢也。'
