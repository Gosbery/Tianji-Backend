- id: annotation-ditiansui-ch061-ren_commentary006
  title: 《滴天髓阐微》疾病·任铁樵注
  kind: commentary
  content: '【任氏曰】：

    忌神入五脏者，阴浊之气，埋藏于地支也。阴浊深伏，难制难化，为病最凶。如其为喜，一世无灾；如其为忌，生平多病。土为脾胃，脾喜缓，胃喜和，忌木而入土，则不和缓而病矣。金为大肠肺，肺宜收，大肠宜畅，忌火而入金，则肺气上逆，大肠不畅而病矣。水为膀胱肾，膀胱宜润，肾宜坚，忌土而入水，则贤枯膀胱燥而病矣。木为肝胆，肝宜条达胆宜平，忌金而入木，则肝急而生火，胆寒而病矣。火为不肠心，心宜宽，小肠宜收，忌水而入火，则心不宽，小肠缓而病矣。又要看有余不足，如土太旺，木不能入土，是脾胃自有余之病。脾本忌湿，胃本忌寒，若土湿而有余，其病发于春冬，反忌火以燥之；土燥而有余，其病发于夏秋，反忌水以润之。如土虚，弱木足以疏土，若土湿而不足，其病发于夏秋；土燥而不足，其病发于冬春。盖虚湿之土，遇夏秋之燥，虚湿之土，逢春冬之湿，使木托根而愈茂，土受其克而愈虚。若虚湿之土，再逢虚湿这时，虚燥之土，再逢虚燥之时，木必虚浮，不能盘根，土反不畏其克也。余仿此。'
