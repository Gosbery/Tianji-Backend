- id: annotation-ditiansui-ch019-ren_commentary002
  title: 《滴天髓阐微》衰旺·任铁樵注
  kind: commentary
  content: '任氏曰：得时俱为旺论，失令便作衰看，虽是至理，亦死法也。夫五行之气，流行于四时，虽日干各有专令，而其实专令之中，亦有并存者在，如春木司令，甲乙虽旺，而此时休囚之戊己，亦未尝绝于天地也；冬水司令，壬水虽旺，而此时休囚之丙丁，未尝绝于天地也。物时当退避，不敢争先，而其实春土何尝不生万物，冬日何尝不照万国乎？况八字虽以月令为重，而旺相休囚，年日时中，亦有损益之权，故生月即不值令，亦能值年值日值时，岂可执一而论？有如春木虽强，金太重而木亦危；干庚辛而支申酉，无火制而不富，逢土生而必夭，是得时不旺也。秋木虽弱，木根深而木亦强，干甲乙而支寅卯，遇官透而能受，逢水生而太过，是失时不弱也。是故日干不论月令休囚，只要四柱有根，便能受财官食神而当伤官七杀。长生禄旺，根之重者也；墓库余气，根之轻者也。天干得一比肩，不如地支得一余气墓库。墓者，如甲乙逢未，丙丁逢戌，庚辛逢丑，壬癸辰之类是也。余气者，如丙丁逢未，丙丁逢戌，庚辛逢丑，壬癸逢辰之类是也。余气者，如丙丁逢未，甲乙逢辰，庚辛逢戌，壬癸逢丑之类是也，得二比肩，不如支中得一长生禄旺，如甲乙逢亥寅卯之类是也。盖比肩如朋友之相扶，通根如家室之可托，干多不如根重，理固然也。今人不知此理，见是春土夏水秋木冬火，不问有根无根，便谓之弱：见是春木夏火秋金冬水，不究克重克轻，便谓之旺，更有壬癸逢辰，丙丁逢戌，甲乙逢未，庚辛逢丑之类，不以为通根逢库，甚至求刑冲以开之，竟不思刑冲伤吾本根之气。此种谬论，必宜一切扫除也。

    然此皆论衰旺之正面，易者也，更有颠倒之理存焉，其理有十：木太旺者而似金，喜火之炼也；木旺极者而似火，喜水之克也。火太旺者而似水，喜土之止也；火旺极者而似土，喜木之克也。土太旺者而似木，喜金之克也；土旺极者而似水，喜火之练也。金太旺者而似火，喜水之济也；金旺极者而似水，喜土之止也。水太旺者而似土，喜木之制也；水旺极者而似木，喜金之克也。木太衰者而似水也，宜金以生之；木衰极者而似土也，宜火以生之。火太衰者而似木也，宜水以生之；火衰极者而似金也，宜土以生之。土太衰者而似火也，宜木以生之；土衰极者而似水也，宜金以生之。金太衰者而似土，宜火以生之。金衰极者而似木也，宜水以生之。水太衰者而似金也，宜土以生之；水衰极者而似火也，宜木以生之。此五行颠倒之真机，学者宜细详，玄玄之妙。'
