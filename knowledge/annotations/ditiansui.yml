- id: annotation-ditiansui-ch020-original_note001
  title: 《滴天髓阐微》中和·原注
  kind: commentary
  content: 【原注】中而且和，子平之要法也：“有病方为贵，无伤不是奇”，举偏而言之也。至于格中如去病，财禄两相宜，则又中和矣，到底中和，乃为至贵。若当令之气数，或身弱而财官旺地，取富贵不必于中也；用神强，取富贵而不必于和也；偏其古怪，取富贵而不必于中且和也。何也？以天下之财官，止有此数，而天下之人材，惟此时为最多，皆尚于奇巧也。
