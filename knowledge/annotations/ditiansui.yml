- id: annotation-ditiansui-ch014-ren_commentary002
  title: 《滴天髓阐微》八格·任铁樵注
  kind: commentary
  content: '【任氏曰】：

    八格者，命中之正理也。先观月令所得何支，次看天干透出何神，再究司令以定真假，然后取用，以分清浊，此实依经顺理，若月逢禄刃，无格可取，须审日主之喜忌另寻别支透出天干者，借以为用。然格局有正有变，正者必兼五行之常礼也，曰官印，曰煞印，曰财煞，曰食神制杀，曰食神生财，曰伤官佩印，曰伤官生财；变者，必从五行之气势也，曰从财，曰从官杀，曰从食伤，曰从强，曰从弱，曰从势，曰一行得气，曰两气成形。其余外格我端，余务考群书，俱不从五行正理，尽属谬谈；至于《兰台妙选》，所定一切奇格异局，纳音诸法，尤属不经，不待辩而知其荒唐也.自唐宋以来，作者甚多，皆虚邙之论;更有吉凶神煞，不知起自何人，作此险语，往往全无应验，诚意伯〈千金赋〉云：“吉凶神煞之多端，何如生克制化之一理”。一言以蔽之矣，即如壬辰日为“壬骑龙背”，壬寅日为“王骑虎背”，何不再取壬午、壬申、壬戌、壬子，谓骑猴马犬鼠之背乎？又如六辛日逢子时，谓“六阴朝阳”，夫五阴皆阴，何独辛金可朝阳，余干不可朝阳乎？且子乃体阳用阴，子中癸水，六阴之至，何谓阳也？又如六乙日逢子时，谓“鼠贵格”，夫鼠者，耗也，何以为贵？且十干之贵，时支皆有之者，岂余干不可贵乎？不待辩而知其谬也。其余谬格甚多，支离无当，学者宜细详正理五行之格，弗以谬书为惑也。'
