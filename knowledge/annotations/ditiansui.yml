- id: annotation-ditiansui-ch062-ren_commentary006
  title: 《滴天髓阐微》出身·任铁樵注
  kind: commentary
  content: '【任氏曰】：

    秀才之命，与异路贫富人无会什分别，细究之，必有清气存焉。官星不起者，非官星不透之谓也，如官星太旺，日主不能用其官；如官星太弱，官昨不能克日主。如官旺用印见财者，如官衰用财遇劫者，如印多泄官星之气者，如官多无印者，如官透无根，地支不载，如官坐伤位，伤坐官位，如忌官逢财，喜官遇伤者，皆谓之官星不起也。纵有清气，不过一衿终身，有富而秀者，身旺财旺，与官星不通也，或伤官顾财不顾官也；有贫而秀者，身旺官轻，财星受劫也。或财官太旺，印星不现，或伤官用印，见财不见官也；有学问过人，竟不能得一衿，老于儒童者。此亦有清气存焉，格局原可发秀，只因运途不济，破其清气，以致终身不能稍舒眉曲也。亦有格局本可登科发甲者，亦因运途不济，屡困场屋，终身一衿，不能得路于青云也。有格局本无出色，竟能科甲连登，此因一路运途合宜，助其清气官星，去其浊气忌客之故也。'
