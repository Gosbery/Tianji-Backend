- id: annotation-ditiansui-ch009-original_note020
  title: 《滴天髓阐微》天干·原注
  kind: commentary
  content: 【原注】壬水即癸水之发源，昆仑之水也；癸水即壬水之归宿，扶桑之水也。有分有合，运行不息，所以为百川者此也，亦为雨露者此也，是不可歧而二之。申为天关，乃天河之口，壬水长生于此，能泄西方金气。周流之性，冲进不滞，刚中之德犹然也。若申子辰全而又透癸，则其势冲奔，不可遏也。如东海本发端于天河，复成水患，命中遇之，若无财官者，其祸当何如哉！合丁化木，又生丁火，则可谓有情；能制丙火，不使其夺丁之爱，故为夫义而为君仁。生于九夏，则巳、午、未、申火土之气，得壬水熏蒸而成雨露，故虽从火土，未尝不相济也。
