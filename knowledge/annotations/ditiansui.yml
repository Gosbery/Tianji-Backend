- id: annotation-ditiansui-ch022-original_note001
  title: 《滴天髓阐微》通关·原注
  kind: commentary
  content: 【原注】天气欲不降，地气欲上升，欲相合相和相生也。木土而要火，火金而要土，土水而要金，金木而要水，皆是牛郎织女之有情也。中间上下远隔，为物所间；前后远绝，或被刑冲，或被劫占，或隔一物，皆谓之关也。必得引用无合之神及刑冲所间之物，前后上下，授引得来，能胜劫占之神，能补所缺之物，明见暗会，岁运相逢，乃为通关也。必得引用无合之神，及刑冲所间之物，前后上下，援引得来，能胜劫占之神，能补所缺之物，明见暗会，岁运相逢，乃为通关也。关通而其愿遂矣，不犹牛郎织女之入洞房也哉？
