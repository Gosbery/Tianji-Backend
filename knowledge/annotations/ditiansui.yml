- id: annotation-ditiansui-ch016-original_note001
  title: 《滴天髓阐微》精神·原注
  kind: commentary
  content: 【原注】精气神气皆无气也，五行大率以金水为精气，木火为神气，而土所以实之者也。有神人不见其精，而精自足者，有精足不见其神，而神自足者；有精缺神索，而日主虚旺者；有精缺神索，而日主孤弱者，有神不足而精有余者，有精不足而神有余者，有精神俱缺而气旺；有精神俱旺而气衰，有精缺得神以助之者，有神缺得精以生之者，有精助精而精反泄无气者，有神助神而神反毙无气者，二者皆由气以主之也。凡此皆不可以一偏求也，俱要损益其进退，不可使有过不及也。
