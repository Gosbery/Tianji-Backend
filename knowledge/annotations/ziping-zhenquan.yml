- id: annotation:ziping-zhenquan:yongshen-scope
  title: 《子平真诠》“用神”术语范围待审说明
  kind: research_note
  content: 第八篇把“用神”与月令、格局及顺逆使用连在一起。建立现代知识卡时，应先核对这里的术语范围， 不宜未经论证就与后世其他流派的扶抑、调候等“用神”概念合并。
