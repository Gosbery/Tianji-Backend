- id: annotation:ziping-zhenquan:provenance
  title: 《子平真诠》网络底本与导入边界
  kind: research_note
  content: 本次底本来自中华典藏网公开在线阅读页。网站目录包含清乾隆四十一年胡焜序、徐乐吾凡例、正文四十七篇及徐乐吾附篇； 原典层只纳入清代序与正文第一至四十七篇。第二篇网页末尾夹带的《滴天髓》天干篇及《渊海子平》干支体象篇也已从派生正文排除，
    但原始 HTML 完整保留。当前文本仅移除隐藏水印并归一化空白，尚未与馆藏影印本逐字校勘。
